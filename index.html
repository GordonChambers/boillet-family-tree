<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>Ascendance Boillet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F141A; --ink1:#151C24; --ink2:#1D2630; --ink3:#26313D;
  --rule:#2A3542; --rule2:#374556;
  --chalk:#E8E2D5; --chalk2:#A5AEB9; --chalk3:#6E7885;
  --woad:#6E9CBF; --madder:#C0605A; --weld:#C9A44E; --verd:#6E9E85;
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bar:52px; --tabs:44px;
  --bar-bg:rgba(15,20,26,.94); --shadow:0 3px 14px rgba(0,0,0,.5);
  --map-fill:#161E27; --map-stroke:#333F4D; --map-label:#46525F;
  --terr-water:#1E3A4F; --terr-water-ink:#4A7C9B; --terr-town:#2E343D;
  --pcard-bg:#151C24; --pcard-border:#374556;
  --hist-fr:#6E9CBF; --hist-reg:#C9A44E; --hist-loc:#6E9E85;
  --ctx-life:#374556;
}
html[data-theme="light"]{
  --ink:#F7F5EF; --ink1:#F0EDE4; --ink2:#E8E4D9; --ink3:#DED9CC;
  --rule:#C8C2B4; --rule2:#B9B4A4;
  --chalk:#1A1F26; --chalk2:#4A5563; --chalk3:#6B7280;
  --bar-bg:rgba(247,245,239,.94); --shadow:0 3px 14px rgba(0,0,0,.12);
  --map-fill:#E8E4D9; --map-stroke:#B9B4A4; --map-label:#6B7280;
  --terr-water:#BBD3E2; --terr-water-ink:#5C8AA8; --terr-town:#D6D1C2;
  --pcard-bg:#F7F5EF; --pcard-border:#B9B4A4;
  --ctx-life:#6B7280;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ink); color:var(--chalk); font-family:var(--serif);
  font-size:17px; line-height:1.5; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--woad);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- chrome ---------- */
.bar{
  position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:40;
  display:flex;align-items:center;gap:12px;padding:0 14px;
  background:var(--bar-bg);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top);height:calc(var(--bar) + env(safe-area-inset-top));
}
.brand{display:flex;flex-direction:column;gap:3px;line-height:1.1;min-width:0;flex:1}
.brand b{font-weight:600;font-size:20px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk3)}
.lang{display:flex;font-family:var(--mono);font-size:12.5px;border:1px solid var(--rule2);border-radius:3px;overflow:hidden;flex:none}
.lang button{padding:5px 9px;letter-spacing:.08em;color:var(--chalk3)}
.lang button[aria-pressed=true]{background:var(--woad);color:var(--ink);font-weight:600}

.tabs{
  position:fixed;left:0;right:0;z-index:39;height:var(--tabs);
  top:calc(var(--bar) + env(safe-area-inset-top));
  display:flex;background:var(--ink1);border-bottom:1px solid var(--rule);
}
.tabs button{
  flex:1;font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--chalk3);border-bottom:2px solid transparent;transition:color .18s,border-color .18s;
}
.tabs button[aria-selected=true]{color:var(--chalk);border-bottom-color:var(--woad)}

main{padding-top:calc(var(--bar) + var(--tabs) + env(safe-area-inset-top))}
.view{display:none}
.view.on{display:block}

/* ---------- stage (tree + map) ---------- */
.stage{
  position:relative;width:100%;
  height:calc(100dvh - var(--bar) - var(--tabs) - env(safe-area-inset-top));
  touch-action:none;overflow:hidden;
}
.stage svg{display:block;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
.stage svg text{user-select:none;-webkit-user-select:none}
.stage svg.drag{cursor:grabbing}

.tools{position:absolute;top:10px;left:10px;right:10px;z-index:20;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.tools-map{flex-direction:column;flex-wrap:nowrap;align-items:flex-start;gap:4px}
.tools > *{pointer-events:auto}
.chipset{display:flex;flex-wrap:wrap;gap:0;background:var(--ink1);border:1px solid var(--rule);border-radius:4px;overflow:hidden;box-shadow:var(--shadow)}
.chipset button{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:7px 9px;color:var(--chalk3);border-right:1px solid var(--rule);white-space:nowrap;
}
.chipset button:last-child{border-right:none}
.chipset button[aria-pressed=true]{background:var(--ink3);color:var(--chalk)}
.chipset .chip-div{width:1px;align-self:stretch;background:var(--rule2);margin:4px 6px;flex:none}
.theme-btn{
  font-family:var(--mono);font-size:14px;padding:5px 8px;border:1px solid var(--rule2);
  border-radius:3px;color:var(--chalk3);flex:none;line-height:1;
}
.theme-btn:hover{color:var(--chalk);border-color:var(--woad)}

.zoomer{position:absolute;right:10px;bottom:16px;z-index:20;display:flex;flex-direction:column;
  background:var(--ink1);border:1px solid var(--rule);border-radius:4px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.5)}
.zoomer button{width:44px;height:38px;font-family:var(--mono);font-size:16px;color:var(--chalk2);border-bottom:1px solid var(--rule)}
.zoomer button:last-child{border-bottom:none;font-size:11.5px;letter-spacing:.06em}

/* ---------- foldable panels ----------
   Everything floating over a chart is furniture, and furniture you cannot
   move is in the way. The legend, the life log and the event stream all fold
   to their title bar and stay that way until told otherwise. */
.panel-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  flex:none;text-align:left;cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--chalk3);padding:7px 10px 6px;
}
.panel-bar:hover{color:var(--chalk2)}
.tl-caret{
  flex:none;border:5px solid transparent;border-top-color:currentColor;
  margin-top:3px;opacity:.7;transition:transform .16s ease;
}
.folded .tl-caret{transform:rotate(-90deg);margin-top:0}
.pb-info{display:none;align-items:center;justify-content:center;line-height:0;color:var(--chalk2)}
.pb-info svg{display:block;width:16px;height:16px}
.folded>.legend,.folded>.life-ticker{display:none}
.tl-chart.folded .tl-body{display:none}
.tl-chart.folded{height:auto;max-height:none}

/* Reference material, not a column of its own: it may take two thirds of the
   map's height and no more, or on a narrow desktop it grows up into the
   ticker that is reporting what is happening right now. */
.legend-wrap{
  position:absolute;left:10px;bottom:16px;z-index:20;max-width:min(300px,62vw);
  display:flex;flex-direction:column;max-height:calc(100% - 110px);
  background:rgba(21,28,36,.95);border:1px solid var(--rule);border-radius:4px;
  box-shadow:0 3px 14px rgba(0,0,0,.5);
}
html[data-theme="light"] .legend-wrap{background:rgba(240,237,228,.95)}
/* it may rise to whatever the chips and the life log above it leave free —
   fold the log and the legend gets the room */
#stage-map .legend-wrap{max-height:calc(100% - var(--map-tools-h,264px) - var(--tl-dock,0px) - 30px)}
.legend-wrap .panel-bar{border-bottom:1px solid var(--rule)}
.legend-wrap.folded .panel-bar{border-bottom:0}
.legend{
  overflow-y:auto;overscroll-behavior:contain;padding:8px 10px;
  font-family:var(--mono);font-size:14px;line-height:1.7;color:var(--chalk2);
}
.legend .t{color:var(--chalk3);letter-spacing:.1em;text-transform:uppercase;font-size:12px;margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.leg-curve{width:18px;height:0;border-radius:0;border-top:2px solid var(--chalk2);vertical-align:middle;transform:rotate(-6deg)}
.legend i.leg-dash{width:18px;height:0;border-radius:0;border-top:2px dashed #C9A44E;vertical-align:middle}
.legend i.leg-fil{width:18px;height:0;border-radius:0;border-top:1px solid var(--chalk3);vertical-align:middle}
.legend i.leg-bracket{width:0;height:15px;border-radius:0;border-left:2px solid var(--chalk2);opacity:.55;vertical-align:-4px;margin-right:9px}
.legend i.leg-plinth{width:18px;height:0;border-radius:0;border-top:1.6px solid var(--chalk2);opacity:.75;vertical-align:middle}
.legend i.leg-ring{width:11px;height:11px;border-radius:50%;border:1.4px solid var(--chalk2);background:none;vertical-align:-2px}
.legend i.leg-ring.est{border-style:dotted}
.legend i.leg-ring.band{border-color:#C9A44E}
.legend .leg-sym{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-2px}
.legend .ramp{height:8px;border-radius:2px;margin:3px 0 2px}
.legend .geo-map{
  position:relative;width:112px;margin:6px 0 4px;
}
.legend .geo-map svg,
.legend .geo-map img{
  display:block;width:112px;height:112px;border-radius:3px;
  border:1px solid var(--rule2);
}
.legend .geo-map .geo-corners{
  position:absolute;inset:0;pointer-events:none;
  font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;color:#F7F5EF;
  text-shadow:0 0 3px rgba(0,0,0,.65),0 1px 2px rgba(0,0,0,.5);
}
.legend .geo-map .geo-corners span{position:absolute;line-height:1}
.legend .geo-map .geo-corners .nw{top:2px;left:2px}
.legend .geo-map .geo-corners .ne{top:2px;right:2px}
.legend .geo-map .geo-corners .sw{bottom:2px;left:2px}
.legend .geo-map .geo-corners .se{bottom:2px;right:2px}
.legend .rl{display:flex;justify-content:space-between;color:var(--chalk3)}

/* classic branch tree (index.html layout, index2 styling) */
.classic-wrap{display:none;position:absolute;inset:0;overflow:hidden}
.classic-wrap.on{display:block}
.classic-scroller{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.classic-scroller.drag{cursor:grabbing}
.classic-scroller .person-card,.classic-scroller .toggle{cursor:pointer;user-select:text;-webkit-user-select:text}
.classic-ruler{position:sticky;top:0;height:26px;z-index:10;background:var(--ink);border-bottom:1px solid var(--rule);width:100%}
.classic-ruler .tick{position:absolute;top:0;height:26px;padding-left:8px;border-left:1px solid var(--rule);display:flex;align-items:center;gap:6px;white-space:nowrap}
.classic-ruler b{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--chalk2)}
.classic-ruler span{font-family:var(--mono);font-size:11px;color:var(--chalk3)}
.classic-zoom{padding:14px 48px 72px 16px;transform-origin:0 0;width:max-content}
.branch{display:flex;align-items:center;position:relative}
.kids{position:relative;display:flex;flex-direction:column;justify-content:center;padding-left:17px}
.kids>.rail{position:absolute;left:0;width:1px;background:var(--chalk3);pointer-events:none}
.kids>.branch::before{content:"";position:absolute;left:-17px;top:50%;width:17px;height:1px;background:var(--chalk3)}
.stub{flex:none;align-self:center;width:17px;height:1px;background:var(--chalk3)}
.person-card{
  width:212px;position:relative;background:var(--ink1);border:1px solid var(--rule);
  border-left:3px solid var(--woad);padding:7px 24px 7px 9px;margin:3px 0;cursor:pointer;
  text-align:left;display:block;transition:border-color .12s,background .12s,box-shadow .12s;
}
.person-card.unknown{border-left-color:var(--rule2);background:var(--ink2);opacity:.72}
.person-card:hover{background:var(--ink3);border-color:var(--rule2)}
.person-card.sel{background:var(--ink3);border-color:var(--woad);box-shadow:0 0 0 1px var(--woad)}
.person-card.dim{opacity:.3;filter:saturate(.35)}
.person-card.dim:hover{opacity:.48}
.person-card .sosa{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--chalk3);display:block;line-height:1.4}
.person-card .nm{font-size:17px;line-height:1.16;display:block;margin-top:1px}
.person-card .nm b{font-weight:600;letter-spacing:.02em}
.person-card.f .nm b{color:var(--madder)}
.person-card .yr{font-family:var(--mono);font-size:12px;color:var(--chalk3);letter-spacing:.05em;display:block;margin-top:2px}
.person-card .pl{font-size:14px;font-style:italic;color:var(--chalk2);display:block;line-height:1.2;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-card .toggle{
  position:absolute;right:0;top:0;bottom:0;width:20px;border:0;border-left:1px solid var(--rule);
  background:transparent;padding:0;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--chalk3);cursor:pointer;
}
.person-card .toggle:hover{background:var(--woad);color:var(--ink)}
.branch.new>.person-card{animation:branchIn .22s ease-out}
@keyframes branchIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
.person-card.flash{animation:cardFlash 1.1s ease-out}
@keyframes cardFlash{0%,55%{background:var(--ink3);box-shadow:0 0 0 2px var(--weld)}100%{background:var(--ink1);box-shadow:none}}

/* search */
.search{position:relative;flex:none}
.search input{
  font-family:var(--mono);font-size:13px;width:164px;padding:7px 9px;color:var(--chalk);
  background:var(--ink1);border:1px solid var(--rule);border-radius:4px;box-shadow:0 3px 14px rgba(0,0,0,.5);
}
.search input::placeholder{color:var(--chalk3)}
.results{
  position:absolute;top:calc(100% + 4px);left:0;width:min(300px,80vw);max-height:46vh;overflow:auto;
  background:var(--ink1);border:1px solid var(--rule2);border-radius:4px;box-shadow:0 10px 34px rgba(0,0,0,.6);
}
.results:empty{display:none}
.results button{display:block;width:100%;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
.results button:hover,.results button:focus{background:var(--ink3)}
.results b{font-weight:600;font-size:16px}
.results span{display:block;font-family:var(--mono);font-size:12px;color:var(--chalk3)}

/* ---------- detail sheet ---------- */
.sheet{
  position:fixed;z-index:60;background:var(--ink1);border:1px solid var(--rule2);
  box-shadow:0 -10px 40px rgba(0,0,0,.6);
  left:0;right:0;bottom:0;max-height:76dvh;overflow:auto;border-radius:12px 12px 0 0;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule2);margin:9px auto 2px}
.sheet .x{position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:13px;color:var(--chalk3);padding:6px 8px}
.d-body{padding:6px 18px 22px}
.d-eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--woad)}
.d-name{font-size:27px;font-weight:600;line-height:1.15;margin:3px 0 1px}
.d-sur{letter-spacing:.02em}
.d-rel{font-style:italic;color:var(--chalk2);font-size:17px;margin-bottom:12px}
.d-rows{border-top:1px solid var(--rule);margin-top:6px}
.d-row{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.d-row dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk3);padding-top:4px}
.d-row dd{margin:0}
.d-row dd button{font-family:var(--serif);font-size:inherit;color:inherit;padding:0;text-align:left}
.d-row dd button:hover{color:var(--woad)}
.d-age{font-family:var(--mono);font-size:12.5px;color:var(--chalk3);display:inline-block;min-width:2.4ch;text-align:right;margin-right:5px}
.d-row dd em{font-style:italic;color:var(--chalk2)}
.d-row .sub{display:block;font-family:var(--mono);font-size:12.5px;color:var(--chalk3)}
.path{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.path button{
  font-family:var(--mono);font-size:12px;padding:4px 7px;border:1px solid var(--rule2);border-radius:3px;
  color:var(--chalk2);background:var(--ink2);
}
.path button:hover{border-color:var(--woad);color:var(--chalk)}
.path .sep{color:var(--chalk3);align-self:center;font-size:12px}
.d-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.d-acts button{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 12px;border:1px solid var(--rule2);border-radius:3px;color:var(--chalk2)}
.d-acts button:hover{border-color:var(--woad);color:var(--chalk)}
.ctx-grp{margin:10px 0 6px}
.ctx-grp>span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk3);display:block;margin-bottom:4px}
.ctx-ev{font-size:15px;line-height:1.38;padding:4px 0 4px 10px;border-left:3px solid var(--hist-fr);margin:3px 0;color:var(--chalk2);white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.ctx-ev.reg{border-left-color:var(--hist-reg)}
.ctx-ev.loc{border-left-color:var(--hist-loc)}
.ctx-ev.life{border-left-color:var(--ctx-life)}
.ctx-ev .yr{font-family:var(--mono);font-size:12.5px;color:var(--chalk3);margin-right:6px;white-space:nowrap}
.ctx-empty{font-style:italic;color:var(--chalk3);font-size:15px;margin:6px 0}
.ctx-sep{display:flex;align-items:center;gap:10px;margin:10px 0 6px;color:var(--chalk3);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ctx-sep::before,.ctx-sep::after{content:'';flex:1;height:1px;background:var(--rule)}
.ctx-sep span{flex-shrink:0;text-align:center;padding:0 2px}
.ctx-leg{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11px;line-height:1.85;color:var(--chalk3)}
.ctx-leg i{display:inline-block;width:3px;height:12px;margin-right:7px;vertical-align:-2px;border-radius:1px}
.ctx-leg i.life{background:var(--ctx-life)}
.ctx-leg i.fr{background:var(--hist-fr)}
.ctx-leg i.reg{background:var(--hist-reg)}
.ctx-leg i.loc{background:var(--hist-loc)}

/* tree detail card */
.tree-card{
  position:absolute;z-index:30;pointer-events:auto;display:none;
  background:var(--ink1);border:1px solid var(--rule2);border-radius:6px;
  box-shadow:var(--shadow);overflow:auto;
  width:min(340px,calc(100% - 20px));max-height:min(440px,calc(100% - 88px));
  top:56px;right:10px;padding:8px 14px 14px;
}
.tree-card.on{display:block}
.tree-card .x{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:13px;color:var(--chalk3);padding:6px 8px;z-index:1}
@media(max-width:759px){
  .tree-card{top:92px;left:10px;right:10px;width:auto;max-height:min(360px,calc(100% - 180px))}
}

/* ---------- stats ---------- */
.wrap{max-width:940px;margin:0 auto;padding:22px 18px 90px}
.lede{font-size:20px;line-height:1.55;color:var(--chalk2);max-width:62ch;margin:0 0 26px}
.lede b{color:var(--chalk);font-weight:600}

.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-bottom:34px}
.key{background:var(--ink);padding:14px 14px 16px}
.key b{display:block;font-family:var(--mono);font-size:27px;font-weight:500;color:var(--chalk);letter-spacing:-.02em}
.key span{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--chalk3);margin-top:4px}
.key i{display:block;font-style:italic;font-size:15px;color:var(--chalk2);margin-top:5px;line-height:1.35}

h2{font-size:14px;font-family:var(--mono);font-weight:500;letter-spacing:.15em;text-transform:uppercase;
  color:var(--chalk3);margin:44px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
h2:first-of-type{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:20px}
.card{background:var(--ink1);border:1px solid var(--rule);padding:16px 16px 18px}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 3px;font-size:20px;font-weight:600;letter-spacing:.005em}
.card p{margin:0 0 14px;font-size:16px;line-height:1.5;color:var(--chalk2);font-style:italic}
.card p.note{font-style:normal;font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--chalk3);margin:12px 0 0}
.card svg{display:block;width:100%;height:auto;overflow:visible}

.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl td{padding:5px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
.tbl td.n{font-family:var(--mono);font-size:13px;color:var(--chalk3);text-align:right;width:34px;white-space:nowrap}
.tbl td.e{font-family:var(--mono);font-size:13px;color:var(--chalk3);text-align:right}
.tbl tr:last-child td{border-bottom:none}
.tbl .barcell{width:38%;padding-left:10px}
.tbl .bar-i{height:7px;background:var(--woad);border-radius:1px;display:block}

.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--chalk3)}

/* the fan repaints wholesale on every zoom step; hinting the text renderer
   for speed over kerning fidelity is worth it at these sizes */
#fan-labels{text-rendering:optimizeSpeed}

/* map extras */
.map-wrap{position:absolute;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
.map-wrap > svg{position:absolute;inset:0}
.map-cards{
  position:absolute;inset:0;pointer-events:none;overflow:visible;
  transform-origin:0 0;user-select:none;-webkit-user-select:none;
  --map-inv:1;
}
.pcard{
  position:absolute;pointer-events:auto;cursor:pointer;
  width:210px;padding:8px 10px 9px;
  background:var(--pcard-bg);border:1px solid var(--pcard-border);
  border-left:3px solid var(--woad);border-radius:4px;
  box-shadow:var(--shadow);
  /* counteract map zoom so on-screen type matches the events timeline */
  transform:translate(-50%,-100%) scale(calc(var(--ps,1) * var(--map-inv,1)));
  filter:grayscale(var(--pg,0));opacity:var(--po,1);
  transition:filter .4s,opacity .5s,transform .35s,box-shadow .15s;
  font-size:15px;line-height:1.35;color:var(--chalk);
}
.pcard.f{border-left-color:var(--madder)}
.pcard:hover,.pcard.sel{box-shadow:0 6px 22px rgba(0,0,0,.35);z-index:5}
.pcard.sel{border-color:var(--woad)}
.pcard.dim{opacity:.28!important;filter:saturate(.35);pointer-events:none}
.pcard.dim.sel{opacity:1!important;filter:none;pointer-events:auto}
.pcard .pn{font-weight:600;font-size:15px;line-height:1.25;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.pcard .pn em{font-style:italic;font-weight:400;color:var(--chalk2)}
.pcard .py{font-family:var(--mono);font-size:15px;color:var(--chalk3);margin-top:2px;letter-spacing:.04em;white-space:normal;overflow-wrap:anywhere}
.pcard .pp{font-size:15px;color:var(--chalk2);font-style:italic;margin-top:1px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.pcard .pd{font-family:var(--mono);font-size:15px;color:var(--chalk3);margin-top:4px;line-height:1.5;white-space:normal;overflow-wrap:anywhere}
.pcard .pd span{display:block}
/* a card whose subject has died: the ink goes out of it and a headstone
   takes the place the accent bar had, so the stack reads at a glance */
.pcard.dead{border-left-color:var(--chalk3);opacity:.82}
.pcard.dead .pn{color:var(--chalk2);font-weight:500}
.pcard.dead .py{color:var(--chalk3)}
.pcard .pdead{display:inline-block;width:11px;height:11px;margin-right:5px;
  vertical-align:-1px;fill:var(--chalk3)}

/* one stack per place: families side by side, generations running downward */
.mstack{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;
  will-change:transform;z-index:2}
.mstack:hover{z-index:8}
.mstack.hassel{z-index:6}
.mstack.dragging{z-index:9}
.mstack-box{display:flex;flex-direction:column;align-items:stretch;gap:6px;
  padding:5px 6px 6px;border-radius:8px;border:1px solid transparent}
/* nearly opaque: where the map runs out of room and stacks do overlap, the
   one in front still has to be readable */
.mstack.grouped .mstack-box{
  background:color-mix(in srgb,var(--pcard-bg) 93%,transparent);
  border-color:var(--pcard-border);box-shadow:var(--shadow)}
.mstack-head{pointer-events:auto;cursor:grab;touch-action:none;
  display:flex;justify-content:space-between;gap:12px;padding:1px 2px 4px;
  font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--chalk2);white-space:nowrap;border-bottom:1px solid var(--rule)}
.mstack-head .dep{color:var(--chalk3);letter-spacing:.04em}
.mstack.dragging .mstack-head{cursor:grabbing}
.mstack.pinned .mstack-head{color:var(--woad)}
.mstack-fams{display:flex;flex-flow:row wrap;align-items:flex-start;gap:9px;
  max-width:429px}
.mfam{display:flex;flex-direction:column;width:210px;flex:none}
.mrow{overflow:hidden;flex:none}
.mfam .pcard{position:static;transform:none;width:auto;box-shadow:none;
  transition:filter .4s,box-shadow .15s,border-color .2s}
.mfam .pcard.sel{box-shadow:0 6px 22px rgba(0,0,0,.35)}
/* husband over wife: their edges meet so the rings sit inside one block */
.mfam .pcard.mtop{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0}
.mfam .pcard.mbot{border-top-left-radius:0;border-top-right-radius:0;border-top:0}
.mrings{display:flex;align-items:center;justify-content:center;pointer-events:auto;
  height:22px;background:var(--pcard-bg);
  border-left:1px solid var(--pcard-border);border-right:1px solid var(--pcard-border)}
.mrings svg{display:block;position:static;inset:auto;width:44px;height:20px;flex:none}
/* generation bar — kept even after everyone below it has gone */
.msep{pointer-events:auto;position:relative;height:11px;margin:5px 0 5px}
.msep::before{content:'';position:absolute;left:0;right:0;top:5px;height:1px;
  background:linear-gradient(90deg,transparent,var(--chalk3) 14%,var(--chalk3) 86%,transparent);
  opacity:.65}
.msep::after{content:'';position:absolute;left:50%;top:2px;width:7px;height:7px;
  margin-left:-3.5px;transform:rotate(45deg);
  border:1px solid var(--chalk3);background:var(--pcard-bg);opacity:.75}
#map-callouts{pointer-events:none}
#map-callouts line,#map-callouts path{vector-effect:non-scaling-stroke}

.ticker-wrap{
  display:none;flex-direction:column;max-width:min(560px,38vw);
  background:rgba(21,28,36,.9);border:1px solid var(--rule);border-radius:4px;
}
html[data-theme="light"] .ticker-wrap{background:rgba(240,237,228,.92)}
.ticker-wrap.on{display:flex}
.ticker-wrap .panel-bar{pointer-events:auto;padding:5px 8px 4px}
.life-ticker{
  display:flex;flex-direction:column;gap:2px;padding:0 4px 4px;
  pointer-events:none;
}
.life-ticker button{
  pointer-events:auto;text-align:left;display:block;
  font-family:var(--mono);font-size:11.5px;line-height:1.35;
  color:var(--chalk2);background:rgba(21,28,36,.9);
  border:1px solid var(--rule);border-left:2px solid var(--chalk3);
  border-radius:3px;padding:3px 7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
html[data-theme="light"] .life-ticker button{background:rgba(240,237,228,.92)}
.life-ticker button:hover{color:var(--chalk);border-color:var(--woad)}
.life-ticker button b{font-weight:600;color:var(--chalk)}
.life-ticker button .ty{color:var(--chalk3);margin-right:5px}
.life-ticker button.ev-wed,.life-ticker button.ev-kid{border-left-color:#C9A44E}
.life-ticker button.ev-born{border-left-color:var(--verd)}
.life-ticker button.ev-died{border-left-color:var(--madder)}
.life-ticker button.ev-move{border-left-color:var(--woad)}

/* The transport stands beside the scale rather than under it: the thing it
   moves runs down the panel, so the handle that moves it should too. */
.tl-body{display:flex;flex:1;min-height:0}
.tl-player{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 8px;border-right:1px solid var(--rule);
}
.tl-row{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.tl-row button{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;padding:5px 9px;border:1px solid var(--rule2);
  border-radius:3px;color:var(--chalk2);min-width:40px;line-height:1;
}
.tl-row button:hover{color:var(--chalk);border-color:var(--woad)}
.tl-speed{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:13px;color:var(--chalk3);text-align:center}
.tl-speed select{font-family:var(--mono);font-size:13px;background:var(--ink2);color:var(--chalk);border:1px solid var(--rule);border-radius:3px;padding:3px 4px;max-width:100%}
.tl-player input[type=range]{
  writing-mode:vertical-lr;-webkit-appearance:slider-vertical;appearance:slider-vertical;
  flex:1;min-height:80px;width:22px;accent-color:var(--woad);margin:0;
}

/* The front door to the map. It sits over the middle of the map on the way in
   and gets out of the way for good the moment it is answered either way. */
.map-invite{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:34;
  width:min(400px,calc(100% - 40px));padding:20px 22px 18px;
  background:var(--ink1);border:1px solid var(--rule);border-radius:8px;
  box-shadow:var(--shadow);text-align:left;
}
.map-invite[hidden]{display:none}
.map-invite .x{
  position:absolute;top:6px;right:8px;width:32px;height:32px;line-height:1;
  color:var(--chalk3);font-size:15px;
}
.map-invite .x:hover{color:var(--chalk)}
.mi-t{font-family:var(--serif);font-size:21px;color:var(--chalk);margin-right:28px}
.mi-p{margin:8px 0 14px;font-size:15px;line-height:1.5;color:var(--chalk2)}
.mi-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mi-go{
  font-family:var(--mono);font-size:14px;padding:10px 16px;border-radius:4px;
  background:var(--woad);color:var(--ink0);font-weight:600;min-height:42px;
}
.mi-go:hover{filter:brightness(1.08)}
.mi-no{
  font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:4px;
  border:1px solid var(--rule2);color:var(--chalk3);min-height:42px;
}
.mi-no:hover{color:var(--chalk2);border-color:var(--woad)}

.tl-chart{
  position:absolute;top:10px;right:10px;left:auto;bottom:auto;z-index:24;
  width:min(430px,calc(100% - 20px));max-height:calc(100% - 20px);
  background:var(--ink1);border:1px solid var(--rule);border-radius:6px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
}
.tl-chart-bar{
  display:flex;justify-content:space-between;align-items:center;flex:none;
  padding:7px 10px 5px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk3);
}
.hist-viewport{
  position:relative;flex:1;height:198px;overflow:hidden;
  mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 90%,transparent 100%);
  --hist-scale:62px;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
}
.hist-viewport.grabbing{cursor:grabbing}
.hist-overlay{
  position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;
}
.hist-now-wrap{
  position:absolute;top:50%;left:var(--hist-scale);right:8px;z-index:4;pointer-events:none;
  transform:translateY(-50%);display:flex;align-items:center;gap:6px;
}
.hist-now{
  flex:1;height:1px;background:var(--woad);opacity:.7;
}
.hist-now-yr{
  flex:none;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--woad);line-height:1;
}
/* The year the map is standing on. Folded away, the title bar is all that is
   left of the stream, so the year rides in it — on a phone it stays there
   whether the stream is open or shut, since the bar is never far from a thumb
   and the reading is the one thing worth keeping in sight. */
.tl-bar-yr{
  display:none;flex:1;text-align:right;
  font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em;
  color:var(--woad);font-variant-numeric:tabular-nums;
}
.tl-chart.folded .tl-bar-yr{display:block}
.hist-stream{
  position:absolute;left:var(--hist-scale);right:0;top:0;height:100%;z-index:3;
}
.hist-ev{
  position:absolute;left:26px;right:8px;padding:4px 8px 4px 9px;
  font-family:var(--mono);font-size:13px;line-height:1.4;color:var(--chalk2);
  border-left:2px solid var(--hist-fr);
  transition:top .22s cubic-bezier(.25,.8,.35,1),opacity .16s linear;pointer-events:none;
  min-height:22px;
}
.hist-ev.reg{border-left-color:var(--hist-reg)}
.hist-ev.loc{border-left-color:var(--hist-loc)}
.hist-ev.on{color:var(--chalk);opacity:1!important;z-index:2}
.hist-ev.warp{transition:none!important}
.hist-line{display:block;white-space:normal;overflow-wrap:anywhere;word-break:break-word}

@media(min-width:760px){
  :root{--bar:58px}
  .sheet{left:auto;right:16px;bottom:16px;top:auto;width:360px;max-height:calc(100dvh - var(--bar) - var(--tabs) - 48px);
    border-radius:6px;transform:translateY(calc(100% + 24px))}
  .sheet.on{transform:translateY(0)}
  .grab{display:none}
  .legend{max-width:300px;bottom:16px}
  .tl-chart{top:10px;right:10px;width:min(430px,40%);height:calc(100% - 20px)}
  .hist-viewport{height:auto;flex:1}
  .pcard{width:200px;font-size:15px}
}
@media(max-width:420px){
  .search input{width:104px}
  .chipset button{padding:7px 7px;font-size:11px}
}

/* ---------- phones ----------
   The desktop map lays three floating panels over the chart, which works at
   1700px and buries it at 390px. On a phone the panels dock: the chips scroll
   along the top and the player sits on the bottom edge. They fold by the same
   title bars as on the desktop, and all three start folded. */
/* a finger needs 44px whatever the screen is wide, so this keys off the
   pointer rather than the viewport — tablets get it too */
@media(pointer:coarse){
  .chipset button{padding:11px 12px;font-size:12px;min-height:44px}
  .tabs button{min-height:48px}
  .lang button{min-width:44px;min-height:38px;font-size:13px}
  .theme-btn{min-width:44px;min-height:38px;font-size:15px}
  .search input{min-height:40px;font-size:15px}
  .zoomer button{min-width:46px;min-height:46px;font-size:15px}
  .tl-player button{min-height:44px;min-width:52px;font-size:13px}
  .tl-player select{min-height:40px;font-size:14px}
  #sl{height:40px}
  .sheet .d-rows button{min-height:40px}
}
@media(max-width:759px){
  /* the strapline is one line or it is noise */
  .brand b{font-size:18px}
  .brand span{font-size:10px;white-space:nowrap}
  /* chips: one scrolling row, above the docked panels */
  .tools{z-index:30}
  .tools-map{right:10px}
  .tools-map .chipset{flex-wrap:nowrap;overflow-x:auto;max-width:100%;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tools-map .chipset::-webkit-scrollbar{display:none}

  /* the events panel docks to the bottom edge, stream folded away */
  .tl-chart{top:auto;bottom:0;left:0;right:0;width:auto;max-height:none;
    border-radius:10px 10px 0 0;border-bottom:0;z-index:24}
  /* on a phone the panel is a dock, so the transport goes back under the
     stream and lies flat across the full width */
  /* the dock is as tall as its contents, so the body must not try to fill a
     height nobody has set — flex:1 here collapses the folded-out stream */
  .tl-body{flex-direction:column-reverse;flex:none}
  .tl-player{flex-direction:column;align-items:stretch;width:auto;
    border-right:0;border-top:1px solid var(--rule);padding:8px 10px 7px;gap:6px}
  .tl-row{flex-direction:row;align-items:center;gap:8px}
  .tl-speed{flex-direction:row;margin-left:auto}
  .tl-player input[type=range]{writing-mode:horizontal-tb;-webkit-appearance:auto;
    appearance:auto;width:100%;height:auto;min-height:0}
  /* the dock keeps its transport whatever happens — only the stream folds,
     because a phone that cannot press play has lost the point of the map */
  .tl-chart.folded .tl-body{display:flex}
  .tl-chart.folded .hist-viewport{display:none}
  .tl-chart:not(.folded) .hist-viewport{height:var(--tl-stream-h,34vh);flex:none}
  /* folded or not, the year stays in the bar and stays big */
  .tl-bar-yr{display:block;font-size:17px}
  .panel-bar{min-height:44px}
  /* drag the header to resize; caret centered — up when shut, down when open */
  .tl-chart-bar{
    position:relative;touch-action:none;cursor:ns-resize;
  }
  .tl-chart-bar .tl-caret{
    position:absolute;left:50%;top:50%;margin:0;
    border:6px solid transparent;border-top-color:currentColor;
    transform:translate(-50%,-35%);opacity:.8;
  }
  .tl-chart.folded .tl-chart-bar .tl-caret{
    border-top-color:transparent;border-bottom-color:currentColor;
    transform:translate(-50%,-65%);
  }
  /* slightly smaller transport — still above 36px touch targets */
  .tl-player{padding:6px 10px 5px;gap:5px}
  .tl-player button{min-height:36px;min-width:44px;font-size:12px;padding:4px 8px}
  .tl-player select{min-height:34px;font-size:13px;padding:2px 4px}
  .tl-row{gap:6px}
  #sl{height:32px}
  .tl-speed{font-size:12px;gap:2px}

  /* the legend sits above the dock; folded, a compact info chip bottom-left */
  .legend-wrap{left:10px;right:10px;max-width:none;z-index:25;
    bottom:calc(var(--tl-dock,116px) + 10px)}
  #stage-tree .legend-wrap{bottom:14px}
  #stage-map .legend-wrap.folded{right:auto;width:auto;min-width:0}
  #stage-map .legend-wrap.folded .panel-bar{
    min-height:0;width:32px;height:32px;padding:0;justify-content:center;gap:0;
    letter-spacing:0;text-transform:none;
  }
  #stage-map .legend-wrap.folded .pb-lab,
  #stage-map .legend-wrap.folded .tl-caret{display:none}
  #stage-map .legend-wrap.folded .pb-info{display:flex}
  .ticker-wrap{max-width:none;width:100%;align-self:stretch}

  /* the detail sheet has to clear the docked player */
  .sheet{z-index:40}

  /* cards: a 210px column is half a phone screen */
  .mfam{width:150px}
  .mstack-fams{max-width:150px}
  .pcard{width:150px}
  .mfam .pcard{width:auto;padding:6px 8px 7px}
  .pcard .pn{font-size:13px}
  .pcard .py,.pcard .pp{font-size:12px}
  .mstack-head{font-size:10px}
  .mrings{height:18px}
  .mrings svg{width:34px;height:16px}
}
</style>
<script>
(function(){
  var t = localStorage.getItem('boillet-theme');
  document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
})();
</script>
</head>
<body>

<header class="bar">
  <div class="brand"><b id="ttl">Ascendance Boillet</b><span id="sub">283 ancêtres · 1618–1992</span></div>
  <div class="lang" role="group">
    <button id="fr" aria-pressed="true">FR</button><button id="en" aria-pressed="false">EN</button>
  </div>
  <button class="theme-btn" id="theme" title="Mode clair" aria-label="Mode clair">☀</button>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true"  data-view="stats" id="t-stats">Chiffres</button>
  <button role="tab" aria-selected="false" data-view="map"  id="t-map">Carte</button>
  <button role="tab" aria-selected="false" data-view="tree" id="t-tree">Arbre</button>
</nav>

<main>
  <section class="view" id="v-tree">
    <div class="stage" id="stage-tree">
      <div class="tools">
        <div class="search">
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Chercher…" aria-label="Chercher">
          <div class="results" id="qr"></div>
        </div>
        <div class="chipset" id="treeview"></div>
        <div class="chipset" id="classic-depth" style="display:none"></div>
        <div class="chipset" id="colorby"></div>
      </div>
      <svg id="fan" role="img" aria-label="Éventail généalogique"></svg>
      <svg id="timeline" role="img" aria-label="Chronologie généalogique" style="display:none"></svg>
      <div class="classic-wrap" id="classic-wrap">
        <div class="classic-scroller" id="classic-scroller">
          <div class="classic-ruler" id="classic-ruler"></div>
          <div class="classic-zoom" id="classic-zoom"><div id="classic-tree"></div></div>
        </div>
      </div>
      <div class="legend-wrap" id="lgw-tree">

  timeline.style.display = v === 'timeline' ? '' : 'none';
  document.getElementById('classic-wrap').classList.toggle('on', v === 'classic');
  document.getElementById('classic-depth').style.display = v === 'classic' ? '' : 'none';
  document.querySelectorAll('#treeview button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tv === v));
  if (VIEW === 'tree') {
    drawTree();
    drawLegend();
    if (v === 'fan' || v === 'timeline') requestAnimationFrame(fitLabels);
    if (v === 'classic') {
      if (SEL != null) markSel();
      classicFocusRoot(false);
    }
  }
}

function drawTreeViewChips() {
  const tv = document.getElementById('treeview');
  if (!tv) return;
  tv.innerHTML = '';
  [['fan', 'treeFan'], ['timeline', 'treeTimeline'], ['classic', 'treeClassic']].forEach(([v, k]) => {
    const b = document.createElement('button');
    b.textContent = t(k);
    b.dataset.tv = v;
    b.setAttribute('aria-pressed', TREE_VIEW === v);
    b.onclick = () => setTreeView(v);
    tv.appendChild(b);
  });
}

function drawFan() {
  fanG.textContent = '';
  const rings = el('g', {});
  for (let g = 2; g <= 12; g++)
    rings.appendChild(el('circle', { cx:0, cy:0, r:rout(g), fill:'none', stroke:'#1B242E', 'stroke-width':.6 }));
  fanG.appendChild(rings);

  const paths = el('g', {}), labs = el('g', { id:'fan-labels', 'pointer-events':'none' }), defs = el('defs', {});
  fanG.appendChild(defs); fanG.appendChild(paths); fanG.appendChild(labs);
  PENDING = [];
  NODES.forEach(n => {
    const p = get(n.id), c = shade(colOf(p), (n.g - 6.5) * 0.024);
    const d = wedge(n.a0, n.a1, rin(n.g) + (n.g === 1 ? 0 : 1.2), rout(n.g) - 1.2);
    const path = el('path', { d, fill:c, stroke:'#0F141A', 'stroke-width':.7, 'data-id':n.id });
    path.style.transition = 'fill .25s, opacity .25s';
    if (c === NONE) path.setAttribute('fill-opacity', .8);
    path.style.cursor = 'pointer';
    path.addEventListener('pointerenter', () => { path.setAttribute('stroke', '#E8E2D5'); path.setAttribute('stroke-width', 1.4); });
    path.addEventListener('pointerleave', () => { if (SEL !== n.id) { path.setAttribute('stroke', '#0F141A'); path.setAttribute('stroke-width', .7); } });
    paths.appendChild(path);

    /* label */
    const mid = (n.a0 + n.a1) / 2, arc = (n.a1 - n.a0) * D2R;
    const r0 = rin(n.g), r1 = rout(n.g), rm = (r0 + r1)/2;
    /* where this wedge's label sits, so the zoom can tell at a glance whether
       it is worth painting — see fanLabelLod */
    const [lx, ly] = pt(mid, rm);
    const lrad = Math.max(arc * rm, r1 - r0) / 2 + 4;
    const room = arc * rm, radial = (r1 - r0) - (n.g === 1 ? 0 : 12);
    const ink = lum(c) > .55 ? '#0F141A' : FAN_LABEL_INK;
    const gv = firstGiven(p);
    const nm = p.n + (gv ? ' ' + gv : '');
    const ys = lifeSpan(p);

    if (n.g === 1) {
      const g1 = el('g', { 'data-id': n.id });
      g1.appendChild(Object.assign(el('text', { x:0, y:-6, 'text-anchor':'middle', fill:ink,
        'font-family':'EB Garamond, serif', 'font-size':17, 'font-weight':600 }), { textContent:p.n }));
      g1.appendChild(Object.assign(el('text', { x:0, y:11, 'text-anchor':'middle', fill:ink,
        'font-family':'IBM Plex Mono, monospace', 'font-size':11.5 }), { textContent:firstGiven(p) }));
      g1.appendChild(Object.assign(el('text', { x:0, y:25, 'text-anchor':'middle', fill:ink, opacity:.75,
        'font-family':'IBM Plex Mono, monospace', 'font-size':10.5 }), { textContent:ys }));
      g1.__lod = { fs: 17, x: 0, y: 0, rad: rout(1) + 6 };
      labs.appendChild(g1); return;
    }
    /* Wedge wider than it is deep -> run the label along the ring, where the
       space actually is. Otherwise run it along the radius. */
    if (room > radial * 1.15) {
      const rev = mid > 90 && mid < 270, u = rev ? -1 : 1;
      const large = (n.a1 - n.a0) > 180 ? 1 : 0;
      const arcId = rr => {
        const A0 = rev ? n.a1 : n.a0, A1 = rev ? n.a0 : n.a1;
        const [ax, ay] = pt(A0, rr), [bx, by] = pt(A1, rr);
        const id = 'lp' + n.id + '_' + Math.round(rr * 10);
        defs.appendChild(el('path', { id, fill:'none',
          d:`M ${ax.toFixed(2)} ${ay.toFixed(2)} A ${rr.toFixed(2)} ${rr.toFixed(2)} 0 ${large} ${rev?0:1} ${bx.toFixed(2)} ${by.toFixed(2)}` }));
        return id;
      };
      const curve = (rr, txt, size, op, fam, vars) => {
        const te = el('text', { fill:ink, 'font-family':fam, 'font-size':size.toFixed(2), opacity:op, 'data-id': n.id });
        const tp = document.createElementNS(SVGNS, 'textPath');
        tp.setAttribute('href', '#' + arcId(rr));
        tp.setAttribute('startOffset', '50%');
        tp.setAttribute('text-anchor', 'middle');
        tp.textContent = txt;
        te.__lod = { fs: size, x: lx, y: ly, rad: lrad };
        te.appendChild(tp); labs.appendChild(te);
        PENDING.push({ node:te, write:tp, max: arc * rr * 0.93, vars });
      };
      const twoT = radial > 24 && ys;
      const fsT = twoT ? Math.min(radial * 0.34, 13) : Math.min(radial * 0.46, 15);
      if (fsT < 1.1) return;
      if (twoT) {
        curve(rm + u*fsT*0.10, nm, fsT, 1, 'EB Garamond, serif', [nm, p.n]);
        curve(rm - u*fsT*0.80, ys, fsT*0.78, .72, 'IBM Plex Mono, monospace', [ys]);
      } else {
        curve(rm - u*fsT*0.35, nm, fsT, 1, 'EB Garamond, serif', [nm, p.n]);
      }
      return;
    }
    let fs = Math.min(room * 0.60, 14);
    const two = room > fs * 2.5 && ys;
    if (two) fs = Math.min(room * 0.34, 13);
    /* the ring depth caps the string length: size so the surname fits outright
       (caps in a serif run ~0.62em per glyph) */
    fs = Math.min(fs, radial / Math.max(3, p.n.length * 0.62));
    if (fs < 1.1) return;
    const flip = mid > 180;
    const gl = el('g', { 'data-id': n.id, transform: flip
      ? `rotate(${mid + 90}) translate(${-(r1 - 6)} 0)`
      : `rotate(${mid - 90}) translate(${r0 + 6} 0)` });
    const anch = flip ? 'end' : 'start';
    const l1 = el('text', { x:0, y: two ? -fs*0.15 : fs*0.35, 'text-anchor':anch, fill:ink,
      'font-family':'EB Garamond, serif', 'font-size':fs, 'font-weight':500 });
    l1.textContent = nm; gl.appendChild(l1);
    PENDING.push({ node:l1, max:radial, vars:[nm, p.n] });
    if (two) {
      const l2 = el('text', { x:0, y: fs*1.05, 'text-anchor':anch, fill:ink, opacity:.72,
        'font-family':'IBM Plex Mono, monospace', 'font-size':fs*0.78 });
      l2.textContent = ys; gl.appendChild(l2);
      PENDING.push({ node:l2, max:radial, vars:[ys] });
    }
    gl.__lod = { fs, x: lx, y: ly, rad: lrad };
    labs.appendChild(gl);
  });

  const ring = el('circle', { cx:0, cy:0, r:0, fill:'none', stroke:'#E8E2D5', 'stroke-width':2,
    'pointer-events':'none', id:'selring', opacity:0 });
  fanG.appendChild(ring);
  fitLabels();
  if (SEL) markSel();
}

/* ══════════ timeline — the pedigree as a tree lying on its side ══════════ */
/* Rows come from an in-order walk of the Sosa tree: a person's paternal branch
   sits above them, the maternal branch below, and everyone gets a row of their
   own. Each subtree therefore owns one unbroken block of rows, which is what
   keeps the connectors from crossing. The year axis puts the père Boillet —
   the youngest — hard against the right edge, so the tree terminates on him. */
const TL = {
  x0: YMIN - 14, x1: YMAX + 8,
  ml: 60, mt: 46, mb: 34, mr: 196,
  rh: 12, vgap: 6, px: 2.55,
  genGap: 32, openSpan: 70
};
const TL_PITCH = TL.rh + TL.vgap;
const TL_BLOCK = 46;   /* rows between repeats of the year scale */
const timeline = document.getElementById('timeline');
const tlG = el('g', {});
timeline.appendChild(tlG);
const zpTimeline = ZoomPan(timeline, tlG, 0.5, 40, null, (cx, cy) => tapSelectInSvg(timeline, cx, cy));
let TL_ROW = {}, TL_SPAN = {}, TL_IDS = [], TL_RULES = [], TL_W = 0, TL_H = 0, tlFitted = false;

function tlYearX(y) { return TL.ml + (y - TL.x0) * TL.px; }

function tlInk() {
  return THEME === 'light'
    ? { grid:'#DCD6C7', gridC:'#C2BAA7', axis:'#6B7280', rail:'#6C7885', twig:'#A79F8D',
        union:'#A8822F', name:'#333B45', faint:'#7A8290', edge:'#F7F5EF', band:'#EEEAE0',
        join:'#2C333C', sel:'#1A1F26' }
    : { grid:'#1E2831', gridC:'#2E3B49', axis:'#6E7885', rail:'#93A2B3', twig:'#4A5563',
        union:'#C9A44E', name:'#C8D0D9', faint:'#828B97', edge:'#0F141A', band:'#141B23',
        join:'#E2E7EE', sel:'#E8E2D5' };
}

function tlLayoutRows() {
  TL_ROW = {};
  TL_IDS = [];
  TL_RULES = [TL.mt - 16];
  let n = 0, y = TL.mt;
  (function walk(id) {
    if (!has(id)) return;
    walk(id * 2);
    /* the chart runs many screens deep, so leave gutters for a repeated scale */
    if (n && n % TL_BLOCK === 0) { TL_RULES.push(y + 15); y += 28; }
    TL_ROW[id] = { cy: y + TL.rh / 2, yTop: y, row: n++ };
    TL_IDS.push(id);
    y += TL_PITCH;
    walk(id * 2 + 1);
  })(1);
  TL_RULES.push(y + 18);
  return y + TL.mb;
}

/* A third of the tree has no birth record, and a person with no position at all
   would tear a hole in the shape. Fall back to their marriage or death, then to
   a 32-year step from the nearest relative who does have a year. Anything
   estimated is drawn hollow so it never passes for a documented life. */
function tlEstimateBirths() {
  const est = {};
  TL_IDS.forEach(id => {
    const p = get(id);
    let b = lifeStart(p);
    if (b == null) {
      const uy = yr(p.u), dy = yr(p.d);
      if (uy) b = uy - 26;
      else if (dy) b = dy - 58;
    }
    if (b != null) est[id] = b;
  });
  const bySosa = TL_IDS.slice().sort((a, b) => a - b);
  bySosa.forEach(id => {
    if (est[id] != null) return;
    const kid = id >> 1;
    if (kid >= 1 && est[kid] != null) est[id] = est[kid] - TL.genGap;
  });
  bySosa.reverse().forEach(id => {
    if (est[id] != null) return;
    const seen = [id * 2, id * 2 + 1].filter(has).map(p => est[p]).filter(v => v != null);
    if (seen.length) est[id] = Math.round(seen.reduce((s, v) => s + v, 0) / seen.length) + TL.genGap;
  });
  TL_IDS.forEach(id => { if (est[id] == null) est[id] = YMIN; });
  return est;
}

function tlComputeSpans() {
  const est = tlEstimateBirths();
  TL_SPAN = {};
  TL_IDS.forEach(id => {
    const p = get(id);
    const b = lifeStart(p), d = lifeEnd(p);
    const birth = b != null ? b : est[id];
    const end = Math.max(birth, d != null ? d : Math.min(YMAX, birth + TL.openSpan));
    TL_SPAN[id] = {
      birth, end, x0: tlYearX(birth), x1: tlYearX(end),
      solidStart: b != null, solidEnd: d != null
    };
  });
}

/* One vertical per couple, dropped at the year their child was born and running
   from the father's row to the mother's; the child's row lies between the two,
   so the line meets all three life-lines at once. */
function tlDrawLinks(g, joins, ink) {
  TL_IDS.forEach(id => {
    const par = [id * 2, id * 2 + 1].filter(has);
    if (!par.length) return;
    const x = TL_SPAN[id].x0, gen = get(id).G;
    const ys = par.map(pid => TL_ROW[pid].cy).concat(TL_ROW[id].cy);
    g.appendChild(el('line', {
      x1: x, y1: Math.min(...ys), x2: x, y2: Math.max(...ys), stroke: ink.rail,
      'stroke-width': Math.max(0.9, 2.1 - (gen - 1) * 0.1),
      opacity: Math.max(0.55, 0.95 - (gen - 1) * 0.04), 'stroke-linecap': 'round'
    }));
    /* the bars would otherwise swallow the junctions, so pin each one */
    [id].concat(par).forEach(pid => {
      joins.appendChild(el('circle', {
        cx: x, cy: TL_ROW[pid].cy, r: pid === id ? 2.3 : 1.8,
        fill: ink.join, opacity: 0.95, 'pointer-events': 'none'
      }));
    });
    par.forEach(pid => {
      const ps = TL_SPAN[pid];
      if (ps.x0 <= x + 0.5 && ps.x1 >= x - 0.5) return;
      const from = ps.x1 < x ? ps.x1 : ps.x0;
      g.appendChild(el('line', {
        x1: Math.min(from, x), y1: TL_ROW[pid].cy, x2: Math.max(from, x), y2: TL_ROW[pid].cy,
        stroke: ink.twig, 'stroke-width': 0.8, opacity: 0.75, 'stroke-dasharray': '2 2.5'
      }));
    });
  });
}

function tlTextW(text, fs) { return Math.max(8, text.length * fs * 0.54); }

/* With a row per person a name only has to clear that row's own bar: it goes
   inside when the life is long enough to hold it, otherwise just past the end. */
function tlPlaceName(labels, id, ink) {
  const p = get(id), sp = TL_SPAN[id], row = TL_ROW[id];
  const gv = firstGiven(p);
  const full = p.n + (gv ? ' ' + gv : '');
  const est = !sp.solidStart && !sp.solidEnd;
  const years = (sp.solidStart ? sp.birth : '?') + '–' + (sp.solidEnd ? sp.end : '?');
  const fs = 9.8, barW = sp.x1 - sp.x0;
  let x, anchor, max, vars, inside = false;
  if (barW > tlTextW(full, fs) + 12) {
    x = sp.x0 + 7; anchor = 'start'; max = barW - 13; inside = true;
    vars = [full, p.n];
  } else if (sp.x1 + 7 + tlTextW(full, fs) < TL_W - 4) {
    x = sp.x1 + 7; anchor = 'start'; max = TL_W - 4 - x;
    vars = [full + '  ' + years, full, p.n];
  } else {
    x = sp.x0 - 7; anchor = 'end'; max = x - TL.ml - 2;
    vars = [full, p.n];
  }
  const bar = shade(colOf(p), (p.G - 6.5) * 0.024);
  const rest = inside && !est ? (lum(bar) > 0.55 ? '#0F141A' : '#F2EEE4') : est ? ink.faint : ink.name;
  const tx = el('text', {
    x, y: row.cy + fs * 0.35, 'text-anchor': anchor,
    fill: SEL === id ? ink.sel : rest,
    'font-family': 'EB Garamond, serif', 'font-size': fs, 'font-weight': 500,
    'font-style': est ? 'italic' : 'normal', class: 'tl-name', 'data-id': id
  });
  tx.dataset.rest = rest;
  tx.textContent = vars[vars.length - 1];
  labels.appendChild(tx);
  PENDING.push({ node: tx, max, vars });
}

function drawTimeline() {
  tlG.textContent = '';
  PENDING = [];
  const ink = tlInk();
  TL_H = tlLayoutRows();
  TL_W = TL.ml + (TL.x1 - TL.x0) * TL.px + TL.mr;
  tlComputeSpans();
  timeline.setAttribute('viewBox', `0 0 ${TL_W} ${TL_H}`);

  const bands = el('g', { 'pointer-events': 'none' });
  TL_IDS.forEach(id => {
    const r = TL_ROW[id];
    if (r.row % 2) return;
    bands.appendChild(el('rect', {
      x: TL.ml - 8, y: r.yTop - TL.vgap / 2, width: TL_W - TL.ml + 6, height: TL_PITCH, fill: ink.band
    }));
  });
  tlG.appendChild(bands);

  const grid = el('g', { 'pointer-events': 'none' });
  const gTop = TL.mt - 12, gBot = TL_H - TL.mb + 8;
  for (let y = Math.ceil(TL.x0 / 10) * 10; y <= TL.x1; y += 10) {
    const century = y % 100 === 0;
    grid.appendChild(el('line', {
      x1: tlYearX(y), y1: gTop, x2: tlYearX(y), y2: gBot,
      stroke: century ? ink.gridC : ink.grid, 'stroke-width': century ? 0.9 : 0.5
    }));
  }
  TL_RULES.forEach(ly => {
    for (let y = Math.ceil(TL.x0 / 50) * 50; y <= TL.x1; y += 50) {
      const tx = el('text', {
        x: tlYearX(y), y: ly, 'text-anchor': 'middle', fill: ink.axis,
        'font-family': 'IBM Plex Mono, monospace', 'font-size': 11
      });
      tx.textContent = y;
      grid.appendChild(tx);
    }
  });
  tlG.appendChild(grid);

  const links = el('g', { 'pointer-events': 'none' });
  const bars = el('g', {});
  const joins = el('g', { 'pointer-events': 'none' });
  const labels = el('g', { 'pointer-events': 'none' });
  tlG.appendChild(links);
  tlG.appendChild(bars);
  tlG.appendChild(joins);
  tlG.appendChild(labels);

  /* Spouses sit at opposite ends of a branch, so drawing the marriage as one
     line would stripe the whole chart. A tick on each of their rows says the
     same thing — the birth rail already shows which two they are. */
  TL_IDS.forEach(id => {
    const uy = yr(get(id).u);
    if (!uy) return;
    const x = tlYearX(uy), row = TL_ROW[id];
    joins.appendChild(el('line', {
      x1: x, y1: row.yTop - 2.5, x2: x, y2: row.yTop + TL.rh + 2.5,
      stroke: ink.union, 'stroke-width': 1.5, opacity: 0.9
    }));
  });

  tlDrawLinks(links, joins, ink);

  TL_IDS.forEach(id => {
    const p = get(id), sp = TL_SPAN[id], row = TL_ROW[id];
    const c = shade(colOf(p), (p.G - 6.5) * 0.024);
    const firm = sp.solidStart && sp.solidEnd;
    const ghost = !sp.solidStart && !sp.solidEnd;
    const rest = ghost ? c : ink.edge, restW = ghost ? 0.9 : 0.6;
    const rect = el('rect', {
      x: sp.x0, y: row.yTop + 1, width: Math.max(3, sp.x1 - sp.x0), height: TL.rh - 2,
      rx: 1.5, fill: ghost ? 'transparent' : c, stroke: rest, 'stroke-width': restW,
      opacity: firm ? 1 : ghost ? 0.5 : 0.7, 'data-id': id
    });
    if (!firm) rect.setAttribute('stroke-dasharray', '3 2.5');
    rect.dataset.rest = rest;
    rect.dataset.restw = restW;
    rect.style.cursor = 'pointer';
    rect.addEventListener('pointerenter', () => rect.setAttribute('stroke', ink.sel));
    rect.addEventListener('pointerleave', () => {
      if (SEL !== id) { rect.setAttribute('stroke', rest); rect.setAttribute('stroke-width', restW); }
    });
    bars.appendChild(rect);
  });

  TL_IDS.forEach(id => tlPlaceName(labels, id, ink));

  /* the ring marks where the whole tree terminates */
  if (TL_ROW[1]) {
    labels.appendChild(el('circle', {
      cx: TL_SPAN[1].x0, cy: TL_ROW[1].cy, r: 5, fill: 'none',
      stroke: ink.sel, 'stroke-width': 1.2, opacity: 0.9
    }));
  }

  if (SEL) markSel();
  requestAnimationFrame(() => {
    fitLabels();
    if (!tlFitted && timeline.getBoundingClientRect().width) { tlFitted = true; tlFitWidth(); }
  });
}

/* Fitting all 283 rows on screen would make every name unreadable, so "fit"
   means the full sweep of years at a legible size, parked on the end of the
   tree — the père Boillet and the generations closest to him. */
function tlFitWidth() {
  const r = timeline.getBoundingClientRect();
  if (!r.width || !TL_W || !TL_ROW[1]) return;
  const base = Math.min(r.width / TL_W, r.height / TL_H);
  const k = (r.width / TL_W) / base * 0.98;
  const visible = r.height / (base * k);
  zpTimeline.focus(TL_W / 2, Math.max(visible / 2, TL_H - visible / 2), k);
}
zpTimeline.reset = tlFitWidth;

/* ══════════ classic branch tree (index.html layout) ══════════ */
const classicWrap = document.getElementById('classic-wrap');
const classicScroller = document.getElementById('classic-scroller');
const classicZoom = document.getElementById('classic-zoom');
const classicTree = document.getElementById('classic-tree');
const classicRuler = document.getElementById('classic-ruler');
const GEN_RANGE = ['1930s','1900s','1870s','1840s','1810s','1780s','1750s','1720s','1690s','1660s','1620s'];
const hasParents = id => has(id * 2) || has(id * 2 + 1);
const CLASSIC_EXPAND_ALL = 13;
let classicOpen = new Set();
ALL.forEach(p => { if (p.G < CLASSIC_EXPAND_ALL && hasParents(p.id)) classicOpen.add(p.id); });
let classicZoomK = 1;

function classicFocusRoot(smooth) {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const el = classicTree.querySelector('.person-card[data-id="1"]');
      if (!el) return;
      const sr = classicScroller.getBoundingClientRect();
      const er = el.getBoundingClientRect();
      const padL = 16;
      classicScroller.scrollTo({
        left: Math.max(0, classicScroller.scrollLeft + (er.left - sr.left) - padL),
        top: Math.max(0, classicScroller.scrollTop + (er.top + er.height / 2 - sr.top) - sr.height / 2),
        behavior: smooth ? 'smooth' : 'auto'
      });
    });
  });
}

const zpClassic = {
  zoom(f) { setClassicZoom(classicZoomK * f); },
  reset() {
    setClassicZoom(1);
    classicExpandTo(CLASSIC_EXPAND_ALL);
    classicFocusRoot(false);
  }
};

function setClassicZoom(z, anchor) {
  z = Math.min(2.2, Math.max(0.35, z));
  if (anchor) {
    const rx = (anchor.x + classicScroller.scrollLeft) / classicZoomK;
    const ry = (anchor.y + classicScroller.scrollTop) / classicZoomK;
    classicZoomK = z;
    classicZoom.style.transform = 'scale(' + z + ')';
    classicRulerDraw();
    classicPaintRails();
    classicScroller.scrollLeft = rx * z - anchor.x;
    classicScroller.scrollTop = ry * z - anchor.y;
  } else {
    classicZoomK = z;
    classicZoom.style.transform = 'scale(' + z + ')';
    classicRulerDraw();
    classicPaintRails();
  }
}

(function initClassicZoom() {
  let d0 = 0, z0 = 1;
  classicScroller.addEventListener('touchstart', e => {
    if (e.touches.length === 2) d0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), z0 = classicZoomK;
  }, { passive: true });
  classicScroller.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && d0) {
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const r = classicScroller.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
      setClassicZoom(z0 * d / d0, { x: mx, y: my });
    }
  }, { passive: false });
  /* The wheel zooms, as it does on the fan, the timeline and the map — this is
     a drawing you move around, not a document you scroll. Panning is the drag
     the view already has; shift+wheel still scrolls sideways for a mouse that
     has no second axis. */
  classicScroller.addEventListener('wheel', e => {
    if (e.shiftKey && !e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = classicScroller.getBoundingClientRect();
    const step = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016));
    setClassicZoom(classicZoomK * step, { x: e.clientX - r.left, y: e.clientY - r.top });
  }, { passive: false });
})();

(function initClassicPan() {
  const TAP_SLACK = 10;
  let active = false, dragging = false, moved = 0;
  let lastX = 0, lastY = 0, startX = 0, startY = 0, pid = null;

  classicScroller.addEventListener('selectstart', e => { if (dragging) e.preventDefault(); });

  classicScroller.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' || e.button !== 0) return;
    // Track only — no pointer capture yet, so click/dblclick still reach cards.
    active = true;
    dragging = false;
    moved = 0;
    startX = lastX = e.clientX;
    startY = lastY = e.clientY;
    pid = e.pointerId;
  });

  classicScroller.addEventListener('pointermove', e => {
    if (!active || e.pointerId !== pid) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (!dragging) {
      moved = Math.hypot(e.clientX - startX, e.clientY - startY);
      if (moved <= TAP_SLACK) return;
      dragging = true;
      classicScroller.classList.add('drag');
      lastX = e.clientX;
      lastY = e.clientY;
      try { classicScroller.setPointerCapture(e.pointerId); } catch (_) {}
      return;
    }
    e.preventDefault();
    classicScroller.scrollLeft -= dx;
    classicScroller.scrollTop -= dy;
    lastX = e.clientX;
    lastY = e.clientY;
  }, { passive: false });

  const up = e => {
    if (!active || e.pointerId !== pid) return;
    const wasDragging = dragging;
    if (classicScroller.hasPointerCapture(e.pointerId)) {
      try { classicScroller.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    active = false;
    dragging = false;
    pid = null;
    classicScroller.classList.remove('drag');
    if (wasDragging) {
      // Swallow only the click that follows a drag; taps/dblclicks stay intact.
      const block = ev => {
        ev.stopPropagation();
        ev.preventDefault();
        classicScroller.removeEventListener('click', block, true);
      };
      classicScroller.addEventListener('click', block, true);
      setTimeout(() => classicScroller.removeEventListener('click', block, true), 400);
    }
  };
  classicScroller.addEventListener('pointerup', up);
  classicScroller.addEventListener('pointercancel', up);
})();

let PENDING = [];
const FAN_LABEL_INK = '#E8E2D5';
/* Labels are about seventy percent of what the fan costs to paint, and at any
   given zoom most of them are either too small to read or off the screen
   altogether. Culling those two groups is what makes zooming smooth: the
   wedges alone repaint in a quarter of the time the full chart does. */
const FAN_MIN_LABEL_PX = 5.5;
/* mid-gesture the threshold rises: a name sliding past under your fingers
   cannot be read anyway, and dropping the small ones is what buys the frame
   rate. They all come back the moment the zoom settles. */
const FAN_BUSY_LABEL_PX = 13;
let FAN_LABELS = [], fanRect = null, fanLodPend = 0, fanBusy = false, fanIdle = 0;
let fanLabs = null, fanLabsHidden = false;

function collectFanLabels() {
  FAN_LABELS = [];
  fanLabs = null; fanLabsHidden = false;
  if (!fanG) return;
  fanG.querySelectorAll('#fan-labels > *').forEach(n => {
    if (n.__lod) FAN_LABELS.push({ node: n, ...n.__lod, on: true });
  });
}

function measureFan() { fanRect = fan.getBoundingClientRect(); }

function reattachFanLabels() {
  if (fanLabs && fanLabsHidden) { fanG.appendChild(fanLabs); fanLabsHidden = false; }
}

function showAllFanLabels() {
  reattachFanLabels();
  FAN_LABELS.forEach(L => { if (!L.on) { L.on = true; L.node.style.display = ''; } });
}

function fanLabelLod() {
  if (TREE_VIEW !== 'fan' || !FAN_LABELS.length) return;
  /* While the zoom is actually moving, lift the whole label layer out of the
     document. Every transform on the fan costs a full SVG layout pass, and
     with three hundred odd names — a hundred and sixty of them laid along
     arcs — that pass runs about 46ms. Detaching them takes it to under one.
     display:none is not enough: Chrome still lays out SVG text it is not
     going to draw. The labels go back the moment the gesture settles, so at
     rest nothing is lost. */
  const labs = fanLabs || (fanLabs = fanG.querySelector('#fan-labels'));
  if (labs && fanLabsHidden !== fanBusy) {
    fanLabsHidden = fanBusy;
    if (fanBusy) labs.remove(); else fanG.appendChild(labs);
  }
  if (fanBusy) return;
  if (!fanRect || !fanRect.width) measureFan();
  if (!fanRect || !fanRect.width) return;
  const vb = (RMAX + 4) * 2;
  const base = Math.min(fanRect.width, fanRect.height) / vb;
  const k = zpTree.k, s = base * k;
  /* the visible window, expressed back in the fan's own coordinates */
  const hx = fanRect.width / (2 * base), hy = fanRect.height / (2 * base);
  const x0 = (-hx - zpTree.x) / k, x1 = (hx - zpTree.x) / k;
  const y0 = (-hy - zpTree.y) / k, y1 = (hy - zpTree.y) / k;
  const minPx = fanBusy ? FAN_BUSY_LABEL_PX : FAN_MIN_LABEL_PX;
  for (const L of FAN_LABELS) {
    const show = L.fs * s >= minPx &&
      L.x + L.rad >= x0 && L.x - L.rad <= x1 &&
      L.y + L.rad >= y0 && L.y - L.rad <= y1;
    if (L.on !== show) { L.on = show; L.node.style.display = show ? '' : 'none'; }
  }
}

function scheduleFanLod() {
  fanBusy = true;
  clearTimeout(fanIdle);
  fanIdle = setTimeout(() => {
    fanBusy = false;
    fanLabelLod();
    /* the labels missed any selection change while they were detached */
    if (SEL != null) markSel();
  }, 140);
  if (fanLodPend) return;
  fanLodPend = requestAnimationFrame(() => { fanLodPend = 0; fanLabelLod(); });
}

function fitLabels() {
  /* measuring needs every label present, so undo any culling first */
  if (TREE_VIEW === 'fan') showAllFanLabels();
  if (!PENDING.length) {
    /* nothing to re-fit, but a resize still changes what is worth drawing */
    if (TREE_VIEW === 'fan') { measureFan(); fanLabelLod(); }
    return;
  }
  const host = TREE_VIEW === 'timeline' ? timeline : fan;
  if (!host.getBoundingClientRect().width) return;
  PENDING.forEach(({ node, write, max, vars }) => {
    const w = write || node;
    const fs0 = +node.getAttribute('font-size');
    let ok = false;
    // try each variant at full size, then at up to 26% smaller, before truncating
    outer: for (const v of vars) {
      w.textContent = v;
      for (let f = fs0; f >= fs0*0.55; f *= 0.92) {
        node.setAttribute('font-size', f.toFixed(2));
        if (node.getComputedTextLength() <= max) { ok = true; break outer; }
      }
      node.setAttribute('font-size', fs0);
    }
    if (!ok) {
      node.setAttribute('font-size', (fs0*0.55).toFixed(2));
      let s = vars[vars.length-1];
      while (s.length > 2) {
        s = s.slice(0, -1); w.textContent = s + '…';
        if (node.getComputedTextLength() <= max) { ok = true; break; }
      }
      if (!ok) w.textContent = '';
    }
  });
  PENDING = [];
  if (TREE_VIEW === 'fan') {
    collectFanLabels();
    measureFan();
    fanLabelLod();
  }
}

function chain(id) { const c = []; while (id >= 1) { if (has(id)) c.push(id); id = Math.floor(id/2); } return c.reverse(); }

function lineageOf(sel) {
  if (!sel) return null;
  const s = new Set(chain(sel));
  ALL.forEach(p => {
    if (s.has(p.id)) return;
    let x = p.id;
    while (x >= 2) {
      x >>= 1;
      if (x === sel) { s.add(p.id); break; }
    }
  });
  return s;
}

function lineagePlaceCounts(selPath) {
  const out = new Map();
  if (!selPath) return out;
  selPath.forEach(id => {
    const p = get(id);
    [['b', p.bp, yr(p.b)], ['u', p.up, yr(p.u)], ['d', p.dp, yr(p.d)]].forEach(([type, pl, y]) => {
      if (!pl || pl[2] == null || !mapLayers[type]) return;
      if (y && y > mapTime) return;
      const pk = pl[2].toFixed(4) + ',' + pl[3].toFixed(4);
      const e = out.get(pk) || { count: 0, ys: [], la: pl[2], lo: pl[3] };
      e.count++;
      if (y) e.ys.push(y);
      out.set(pk, e);
    });
  });
  out.forEach(e => {
    e.ys.sort((a, b) => a - b);
    e.med = e.ys.length ? e.ys[Math.floor(e.ys.length / 2)] : null;
  });
  return out;
}

function rampCss(stops) {
  const a = stops[0][0], b = stops[stops.length-1][0];
  return 'linear-gradient(90deg,' + stops.map(s => `${s[1]} ${((s[0]-a)/(b-a)*100).toFixed(0)}%`).join(',') + ')';
}
function geoMapDot(ctx, lat, lon, W, H, opts) {
  opts = opts || {};
  const g = geoNorm(lat, lon);
  const gx = g.x * W, gy = (1 - g.y) * H;
  const dotCol = geoColor(lat, lon);
  const fill = opts.fill || (lum(dotCol) > 0.55 ? '#1A1F26' : '#F7F5EF');
  const stroke = opts.stroke != null ? opts.stroke : (fill === '#F7F5EF' ? '#1A1F26' : '#F7F5EF');
  const r = opts.r || 3.5;
  ctx.beginPath();
  ctx.arc(gx, gy, r, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
  if (opts.stroke !== false) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = opts.lineWidth || 1.1;
    ctx.stroke();
  }
  if (opts.label) {
    ctx.font = opts.font || '600 8px "IBM Plex Mono", monospace';
    ctx.fillStyle = opts.labelFill || fill;
    ctx.fillText(opts.label, Math.min(W - 2, gx + r + 2), Math.max(9, gy - 2));
  }
}
function geoLegendHtml() {
  const W = 112, H = 112;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const nx = (x + 0.5) / W;
      const ny = 1 - (y + 0.5) / H;
      const lat = GEO.la0 + ny * (GEO.la1 - GEO.la0);
      const lon = GEO.lo0 + nx * (GEO.lo1 - GEO.lo0);
      const rgb = hex2rgb(geoColor(lat, lon));
      const i = (y * W + x) * 4;
      d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  geoMapDot(ctx, GISORS[0], GISORS[1], W, H, { label: 'Gisors' });
  if (SEL != null) {
    const pl = personGeoPlace(get(SEL));
    if (pl) geoMapDot(ctx, pl[2], pl[3], W, H, { r: 4.5, fill: '#6E9CBF', stroke: '#F7F5EF', lineWidth: 1.5 });
  }
  return `<div class="geo-map">` +
    `<img src="${c.toDataURL()}" width="${W}" height="${H}" alt="">` +
    `<div class="geo-corners">` +
    `<span class="nw">${t('geoNW')}</span><span class="ne">${t('geoNE')}</span>` +
    `<span class="sw">${t('geoSW')}</span><span class="se">${t('geoSE')}</span>` +
    `</div></div>`;
}
function drawLegend() {
  let h = `<div class="t">${t('colour')} · ${t(MODE_TITLE[MODE])}</div>`;
  if (MODE === 'era') {
    h += `<div class="ramp" style="background:${rampCss(ERA)}"></div><div class="rl"><span>1600</span><span>1970</span></div>`;
  } else if (MODE === 'life') {
    h += `<div class="ramp" style="background:${rampCss(LIFE)}"></div><div class="rl"><span>15</span><span>97 ${L === 'fr' ? 'ans' : 'yrs'}</span></div>`;
    h += `<div style="margin-top:3px">${swatch(NONE, t('unknown'))}</div>`;
  } else if (MODE === 'trade') {
    const seen = {}; ALL.forEach(p => { if (p.c) seen[p.c] = (seen[p.c]||0)+1; });
    Object.keys(seen).sort((a,b) => seen[b]-seen[a]).forEach(c => h += swatch(CATC[c], CATN[L][c] + ' · ' + seen[c]));
    h += swatch(NONE, t('unknown'));
  } else if (MODE === 'gender') {
    h += swatch(GENDC.M, t('male'));
    h += swatch(GENDC.F, t('female'));
    h += swatch(NONE, t('unknown'));
  } else if (MODE === 'region') {
    h += geoLegendHtml();
    h += `<div style="margin-top:3px;color:var(--chalk3);font-size:14px;line-height:1.4">${t('region')}: ${L === 'fr' ? 'naissance, union, décès' : 'birth, marriage, death'}</div>`;
    h += `<div style="color:var(--chalk3);font-size:14px">${GEO.lo0.toFixed(1)}°–${GEO.lo1.toFixed(1)} · ${GEO.la0.toFixed(1)}°–${GEO.la1.toFixed(1)}°</div>`;
    h += `<div style="margin-top:3px">${swatch(NONE, t('unknown'))}</div>`;
  }
  h += `<div style="margin-top:6px;color:var(--chalk3);font-size:14px;line-height:1.45">${t(TREE_VIEW === 'fan' ? 'noWedge' : TREE_VIEW === 'timeline' ? 'tlHint' : 'classicHint')}</div>`;
  lgTree.innerHTML = h;
}

function syncMapOverlay(S) {
  if (mapLiving && zpMap && zpMap.k !== livingK) updateLivingLayer();
  const r = mapSvg.getBoundingClientRect();
  const sx = r.width / (MW + 16), sy = r.height / (MH + 16);

  const ox = (r.width - (MW + 16) * s) / 2, oy = (r.height - (MH + 16) * s) / 2;
  const mapScale = S.k * s;
  mapCardsEl.style.transform = `translate(${ox + 8*s + S.x*s}px,${oy + 8*s + S.y*s}px) scale(${mapScale})`;

     room the stacks have between them, so the field has to settle again */
  if (Math.abs(S.k - cardZoomK) > 1e-6) {
    cardZoomK = S.k;

      cardResolve = requestAnimationFrame(() => { cardResolve = 0; renderPersonCards(); });

}

  for (const n of tapTargets(mapSvg, cx, cy)) {
    const id = n.getAttribute && n.getAttribute('data-id');
    if (id) { select(+id); return; }
    const pk = n.getAttribute && n.getAttribute('data-place-key');
    if (pk && PLACE_KEY[pk]) {
      const pl = PLACE_KEY[pk];
      const ev = pl.ev.filter(e => mapLayers[e.type] && (!e.y || e.y <= mapTime));
      if (ev.length) showPlace(pl, ev);
      return;
