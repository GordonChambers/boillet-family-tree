<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Ascendance de Frédéric Boillet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEDE5;--paper-2:#E4E1D6;--ink:#1D2B48;--ink-soft:#5C6880;
  --oxblood:#9B3138;--verdigris:#4C6B5C;--gold:#A9852F;--line:#B9B4A4;
  --card:212px;--z:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:"EB Garamond","Iowan Old Style",Palatino,Georgia,serif;font-size:16px;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;
  -webkit-text-size-adjust:100%;
}
.lbl{font-family:"Archivo Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.13em;font-size:10.5px;font-weight:600;color:var(--ink-soft)}

/* ── masthead ── */
header{border-bottom:1px solid var(--ink);padding:11px 16px 10px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;background:var(--paper);position:relative;z-index:60;flex:none}
h1{font-size:25px;font-weight:600;margin:0;line-height:1;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:400;color:var(--ink-soft)}
.sub{margin:5px 0 0}
.tools{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.field{position:relative}
input[type=search]{font-family:"Archivo Narrow",Arial,sans-serif;font-size:13px;padding:7px 10px 7px 26px;width:200px;border:1px solid var(--line);background:#F7F5EF;color:var(--ink);border-radius:0}
input[type=search]:focus{outline:2px solid var(--verdigris);outline-offset:1px}
.field::before{content:"⌕";position:absolute;left:8px;top:4px;font-size:15px;color:var(--ink-soft)}
button{font-family:"Archivo Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;font-weight:600;padding:8px 10px;background:transparent;color:var(--ink);border:1px solid var(--line);cursor:pointer;border-radius:0;white-space:nowrap}
button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--verdigris);outline-offset:1px}
.grp{display:flex}
.grp button{border-right:0}
.grp button:last-child{border-right:1px solid var(--line)}
.grp button:hover,.grp button.on{border-right:1px solid var(--ink)}
#lang{font-weight:700}

#results{position:absolute;top:100%;left:0;width:320px;max-height:340px;overflow:auto;background:#F7F5EF;border:1px solid var(--ink);z-index:70;display:none;box-shadow:3px 3px 0 rgba(29,43,72,.13)}
#results div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--paper-2);font-size:15px}
#results div:hover{background:var(--paper-2)}
#results .n{font-family:"Archivo Narrow",Arial,sans-serif;font-size:10px;color:var(--ink-soft);letter-spacing:.1em}

/* ── layout ── */
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
#scroller{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#ruler{position:sticky;top:0;height:24px;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);width:100%}
#ruler .tick{position:absolute;top:0;height:24px;padding-left:7px;border-left:1px solid var(--line);display:flex;align-items:center;gap:5px;white-space:nowrap}
#ruler b{font-family:"Archivo Narrow",Arial,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.12em}
#ruler span{font-family:"Archivo Narrow",Arial,sans-serif;font-size:10px;color:var(--ink-soft)}
#zoomwrap{padding:16px 60px 80px 20px;transform-origin:0 0;width:max-content}

/* ── zoom bar ── */
#zoombar{position:absolute;right:12px;bottom:12px;z-index:30;display:flex;gap:5px;align-items:center;background:rgba(239,237,229,.94);border:1px solid var(--line);padding:5px 7px;backdrop-filter:blur(3px)}
#zoombar button{padding:5px 8px;min-width:30px;font-size:12px}
#zval{font-family:"Archivo Narrow",Arial,sans-serif;font-size:10.5px;letter-spacing:.08em;color:var(--ink-soft);min-width:38px;text-align:center}

/* ── branches ── */
.branch{display:flex;align-items:center;position:relative}
.kids{position:relative;display:flex;flex-direction:column;justify-content:center;margin-left:17px;padding-left:17px;border-left:1px solid var(--line)}
.kids>.branch::before{content:"";position:absolute;left:-17px;top:50%;width:17px;height:1px;background:var(--line)}
.stub{position:absolute;right:-17px;top:50%;width:17px;height:1px;background:var(--line)}
.mask{position:absolute;left:-18px;width:3px;background:var(--paper);z-index:2}
.mask.t{top:-5000px;height:calc(5000px + 50%)}
.mask.b{bottom:-5000px;height:calc(5000px + 50%)}

/* ── cards ── */
.person{width:var(--card);position:relative;background:#F7F5EF;border:1px solid var(--line);border-left:3px solid var(--ink);padding:7px 24px 7px 9px;margin:3px 0;cursor:pointer;text-align:left;display:block;font-family:inherit;letter-spacing:0;text-transform:none;transition:border-color .12s,background .12s}
.person.f{border-left-color:var(--oxblood)}
.person.unknown{border-left-color:var(--line);background:var(--paper-2);opacity:.7}
.person:hover{background:#fff;border-color:var(--ink)}
.person.sel{background:#fff;border-color:var(--ink);box-shadow:3px 3px 0 rgba(29,43,72,.18)}
.person .sosa{font-family:"Archivo Narrow",Arial,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.11em;color:var(--ink-soft);display:block;line-height:1.4}
.person .nm{font-size:16px;line-height:1.16;display:block;margin-top:1px}
.person .nm b{font-weight:600;letter-spacing:.02em}
.person.f .nm b{color:var(--oxblood)}
.person .yr{font-family:"Archivo Narrow",Arial,sans-serif;font-size:11px;color:var(--ink-soft);letter-spacing:.05em;display:block;margin-top:2px}
.person .pl{font-size:13px;font-style:italic;color:var(--ink-soft);display:block;line-height:1.2;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle{position:absolute;right:0;top:0;bottom:0;width:20px;border:0;border-left:1px solid var(--paper-2);background:transparent;padding:0;font-family:"Archivo Narrow",Arial,sans-serif;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer}
.toggle:hover{background:var(--ink);color:var(--paper)}
.branch.new>.person{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
.flash{animation:fl 1.1s ease-out}
@keyframes fl{0%,55%{background:#F5E9A8}100%{background:#fff}}

/* ── side panel ── */
#side{width:352px;flex:none;border-left:1px solid var(--ink);background:#F2F0E8;display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--ink);flex:none;background:var(--paper)}
#tabs button{flex:1;border:0;border-right:1px solid var(--line);padding:9px 4px;font-size:10px}
#tabs button:last-child{border-right:0}
#panel{flex:1;overflow:auto;padding:16px 18px 44px;-webkit-overflow-scrolling:touch}
#panel.lined{background:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(29,43,72,.09) 27px 28px),#F2F0E8}
.eyebrow{border-bottom:1px solid var(--ink);padding-bottom:5px;margin-bottom:12px;display:block}
h2{font-size:23px;line-height:1.08;margin:0 0 2px;font-weight:600}
h2 span{display:block;font-size:15px;font-weight:400;font-style:italic;color:var(--ink-soft)}
.row{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:6px 0;border-bottom:1px dotted var(--line);align-items:baseline}
.row p{margin:0;font-size:16px;line-height:1.32}
.row p i{font-style:italic;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px}
.chip{font-family:"Archivo Narrow",Arial,sans-serif;font-size:10px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--line);padding:4px 7px;background:#F7F5EF;color:var(--ink-soft)}
.chip b{color:var(--ink);font-weight:600}
.chip.zod{border-color:var(--gold);color:var(--gold)}
.rel{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.rel a{font-family:"Archivo Narrow",Arial,sans-serif;font-size:12px;letter-spacing:.04em;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#F7F5EF;padding:6px 9px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.rel a:hover{border-color:var(--ink);background:#fff}
.rel a u{text-decoration:none;color:var(--ink-soft)}
.empty{font-style:italic;color:var(--ink-soft);font-size:15px}

/* ── stats ── */
.sect{margin:0 0 22px}
.sect>.lbl{display:block;border-bottom:1px solid var(--ink);padding-bottom:4px;margin-bottom:9px}
.big{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.stat{flex:1 1 78px;border:1px solid var(--line);background:#F7F5EF;padding:7px 8px}
.stat b{display:block;font-size:23px;line-height:1.05;font-weight:600}
.stat u{text-decoration:none;font-family:"Archivo Narrow",Arial,sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.bar{display:grid;grid-template-columns:58px 1fr 40px;gap:6px;align-items:center;margin:2.5px 0;font-family:"Archivo Narrow",Arial,sans-serif;font-size:10px;color:var(--ink-soft);letter-spacing:.05em}
.bar u{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:8px;background:var(--paper-2);position:relative;cursor:default}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--verdigris)}
.bar .tr i.o{background:var(--oxblood)}
.bar .tr i.g{background:var(--gold)}
.bar u:last-child{text-align:right;color:var(--ink)}
.hist{display:flex;align-items:flex-end;gap:2px;height:88px;border-bottom:1px solid var(--ink);margin-bottom:4px}
.hist>div{flex:1;background:var(--verdigris);min-height:1px;position:relative}
.hist>div:hover{background:var(--ink)}
.hticks{display:flex;justify-content:space-between;font-family:"Archivo Narrow",Arial,sans-serif;font-size:9px;color:var(--ink-soft);letter-spacing:.06em}
.zwheel{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.zc{border:1px solid var(--line);background:#F7F5EF;padding:5px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.zc em{font-style:normal;font-size:15px}
.zc s{text-decoration:none;font-family:"Archivo Narrow",Arial,sans-serif;font-size:9.5px;letter-spacing:.07em;color:var(--ink-soft);flex:1}
.zc b{font-family:"Archivo Narrow",Arial,sans-serif;font-size:11px}
.note{font-size:13.5px;font-style:italic;color:var(--ink-soft);line-height:1.35;margin:8px 0 0}

/* ── map ── */
#mapwrap{position:relative}
svg.map{width:100%;height:auto;display:block;background:#F7F5EF;border:1px solid var(--line)}
svg.map path.rv{fill:none;stroke:#8FA8B8;stroke-width:1.1}
svg.map circle{cursor:pointer;stroke:rgba(29,43,72,.55);stroke-width:.5}
svg.map circle:hover{stroke:var(--ink);stroke-width:1.4}
svg.map text.pl{font-family:"Archivo Narrow",Arial,sans-serif;font-size:5px;fill:var(--ink-soft);letter-spacing:.04em;pointer-events:none}
.legend{display:flex;align-items:center;gap:6px;margin-top:7px;font-family:"Archivo Narrow",Arial,sans-serif;font-size:9.5px;letter-spacing:.07em;color:var(--ink-soft)}
.ramp{flex:1;height:9px;background:linear-gradient(90deg,#3B4E6E,#4C6B5C,#A9852F,#9B3138)}
#tip{position:fixed;z-index:90;background:var(--ink);color:var(--paper);font-family:"Archivo Narrow",Arial,sans-serif;font-size:11px;letter-spacing:.05em;padding:5px 8px;pointer-events:none;display:none;max-width:220px;line-height:1.4}

/* ── mobile ── */
#mobtabs{display:none}
@media (max-width:900px){
  header{padding:9px 12px}
  h1{font-size:20px}
  .tools{margin-left:0;width:100%}
  .field{flex:1;min-width:140px}
  input[type=search]{width:100%}
  main{flex-direction:column}
  #side{width:auto;border-left:0;border-top:1px solid var(--ink);height:46%;flex:none}
  body.solo #stage{display:none}
  body.solo #side{height:auto;flex:1;border-top:0}
  body.tree #side{display:none}
  #mobtabs{display:flex;flex:none;border-bottom:1px solid var(--ink)}
  #mobtabs button{flex:1;border:0;border-right:1px solid var(--line);padding:10px 4px}
  #mobtabs button:last-child{border-right:0}
  #zoomwrap{padding:14px 30px 60px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const S={SUR:0,GIV:1,B:2,BP:3,M:4,MP:5,D:6,DP:7,OCC:8};
const gen = n => Math.floor(Math.log2(n)) + 1;
const has = n => !!P[n];
const hasParents = n => has(n*2) || has(n*2+1);
const isF = n => n !== 1 && n % 2 === 1;
const yr = s => { const m=String(s).match(/(1[5-9]\d\d|20\d\d)/); return m?+m[1]:null; };
const full = n => { const p=P[n]; return p ? (p[1] ? p[0]+", "+p[1] : p[0]) : "?"; };
const parseDM = s => { const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m?{d:+m[1],mo:+m[2],y:+m[3]}:null; };
const cleanPlace = s => s ? s.replace(/\s*\(\d+\)\s*$/,'') : "";
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ══════════ TREE STATE & DRAWING ══════════ */
const open = new Set();
let selected = 1, zoom = 1;
const treeEl = document.getElementById('tree');

function expandTo(g){
  open.clear();
  Object.keys(P).map(Number).forEach(n=>{ if(gen(n)<g && hasParents(n)) open.add(n); });
  draw();
}
function pathTo(n){ const p=[]; let c=n; while(c>1){ c=Math.floor(c/2); p.unshift(c);} return p; }

function card(n){
  const p=P[n], b=document.createElement('button');
  b.className='person'+(isF(n)?' f':'')+(p[0].startsWith('INCONNU')?' unknown':'');
  b.dataset.sosa=n;
  const by=yr(p[S.B]), dy=yr(p[S.D]);
  const dates=[by?(lang==='fr'?'n. ':'b. ')+by:"",dy?(lang==='fr'?'d. ':'d. ')+dy:""].filter(Boolean).join(" · ");
  b.innerHTML='<span class="sosa">'+n.toLocaleString(lang==='fr'?'fr-FR':'en-GB')+' · G'+gen(n)+'</span>'+
    '<span class="nm"><b>'+esc(p[0])+'</b>'+(p[1]?' '+esc(p[1]):'')+'</span>'+
    (dates?'<span class="yr">'+dates+'</span>':'')+
    (p[S.BP]?'<span class="pl">'+esc(p[S.BP])+'</span>':'');
  b.onclick=()=>select(n);
  if(hasParents(n)){
    const t=document.createElement('span');
    t.className='toggle'; t.setAttribute('role','button'); t.tabIndex=0;
    t.textContent=open.has(n)?'–':'+';
    const fire=e=>{ e.stopPropagation(); open.has(n)?open.delete(n):open.add(n); draw(); };
    t.onclick=fire; t.onkeydown=e=>{ if(e.key==='Enter'||e.key===' ') fire(e); };
    b.appendChild(t);
  }
  return b;
}

function branch(n,isNew){
  const wrap=document.createElement('div');
  wrap.className='branch'+(isNew?' new':'');
  const c=card(n); wrap.appendChild(c);
  if(open.has(n)&&hasParents(n)){
    const stub=document.createElement('span'); stub.className='stub'; c.appendChild(stub);
    const kids=document.createElement('div'); kids.className='kids';
    const list=[n*2,n*2+1].filter(has);
    list.forEach((k,i)=>{
      const kb=branch(k,isNew);
      if(i===0){const m=document.createElement('span');m.className='mask t';kb.appendChild(m);}
      if(i===list.length-1){const m=document.createElement('span');m.className='mask b';kb.appendChild(m);}
      kids.appendChild(kb);
    });
    wrap.appendChild(kids);
  }
  return wrap;
}

function draw(){ treeEl.innerHTML=''; treeEl.appendChild(branch(1,false)); markSelected(); ruler(); }

const RANGE=["1968","1930s","1900s","1870s","1840s","1810s","1780s","1750s","1720s","1690s","1660s","1620s"];
function ruler(){
  const r=document.getElementById('ruler'); r.innerHTML='';
  let maxG=1; treeEl.querySelectorAll('.person').forEach(p=>maxG=Math.max(maxG,gen(+p.dataset.sosa)));
  const pitch=246*zoom;
  for(let g=1;g<=maxG;g++){
    const t=document.createElement('div'); t.className='tick'; t.style.left=(g-1)*pitch+'px';
    t.innerHTML='<b>G'+g+'</b><span>'+(RANGE[g-1]||'')+'</span>'; r.appendChild(t);
  }
}

/* ══════════ ZOOM ══════════ */
const zwrap=document.getElementById('zoomwrap'), zval=document.getElementById('zval');
function setZoom(z,anchor){
  z=Math.min(2.2,Math.max(.35,z));
  if(anchor){
    const sc=document.getElementById('scroller');
    const rx=(anchor.x-sc.offsetLeft+sc.scrollLeft)/zoom, ry=(anchor.y-sc.offsetTop+sc.scrollTop)/zoom;
    zoom=z; applyZoom();
    sc.scrollLeft=rx*zoom-(anchor.x-sc.offsetLeft); sc.scrollTop=ry*zoom-(anchor.y-sc.offsetTop);
  } else { zoom=z; applyZoom(); }
}
function applyZoom(){ zwrap.style.transform='scale('+zoom+')'; zval.textContent=Math.round(zoom*100)+'%'; ruler(); }
document.getElementById('zi').onclick=()=>setZoom(zoom*1.25);
document.getElementById('zo').onclick=()=>setZoom(zoom/1.25);
document.getElementById('zr').onclick=()=>setZoom(1);
/* pinch zoom */
(function(){
  const sc=document.getElementById('scroller'); let d0=0,z0=1;
  sc.addEventListener('touchstart',e=>{
    if(e.touches.length===2){ d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); z0=zoom; }
  },{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&d0){
      e.preventDefault();
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      const mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;
      const r=sc.getBoundingClientRect();
      setZoom(z0*d/d0,{x:mx-r.left,y:my-r.top});
    }
  },{passive:false});
  sc.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.1:0.9),{x:e.clientX-sc.getBoundingClientRect().left,y:e.clientY-sc.getBoundingClientRect().top}); }
  },{passive:false});
})();

const ZOD=[["♑","Capricorne","Capricorn",1,19],["♒","Verseau","Aquarius",2,18],["♓","Poissons","Pisces",3,20],

["♎","Balance","Libra",10,22],["♏","Scorpion","Scorpio",11,21],["♐","Sagittaire","Sagittarius",12,21]];
function zodiac(d,mo){
  for(let i=0;i<12;i++){ const [s,fr,en,cutM,cutD]=ZOD[i];
    const prev=ZOD[(i+11)%12];
    if((mo===cutM&&d>=cutD)||(mo===prev[3]&&d<prev[4]&&cutM!==prev[3]&&mo===cutM)||false){}
  }
  const mTable=ZOD.map(z=>[z[3],z[4]]);
  for(let i=0;i<12;i++){ const ni=(i+1)%12;
    const [sm,sd]=[ZOD[ni][3],ZOD[ni][4]];
    const prevM=ZOD[i][3], prevD=ZOD[i][4];
  }
  // simple: sign i runs from its cut date until next sign's cut date
  const idx=(mo-1+11)%12; // will fix below
  for(let i=0;i<12;i++){
    const sM=ZOD[i][3], sD=ZOD[i][4];
    const e=ZOD[(i+1)%12];
    const after = (mo>sM)||(mo===sM&&d>=sD);
    const before = (mo<e[3])||(mo===e[3]&&d<e[4]);
    if(sM<e[3] ? (after&&before) : (after||before)) return ZOD[i];

function fiche(n){
  const p=P[n], el=document.getElementById('panel');
  const spouseS = n===1 ? null : (n%2?n-1:n+1);
  const child = n>1 ? Math.floor(n/2) : null;
  const place = t => t?' <i>'+T('at')+' '+esc(t)+'</i>':'';
  const link=(s,role)=>has(s)?'<a data-go="'+s+'"><span>'+role+'</span><u>'+esc(full(s))+'</u></a>':'';
  let rel=link(n*2,T('father'))+link(n*2+1,T('mother'));
  if(spouseS&&has(spouseS)) rel+=link(spouseS,T('spouse'));
  if(child) rel+=link(child,T('child'));
  /* chips: zodiac, lifespan */
  let chips='';
  const bd=parseDM(p[S.B]);
  if(bd){ const z=zodiac(bd.d,bd.mo); chips+='<span class="chip zod">'+z[0]+' '+(lang==='fr'?z[1]:z[2])+'</span>'; }
  const by=yr(p[S.B]), dy=yr(p[S.D]);
if(by&&dy&&dy>by){ const a=dy-by; chips+='<span class="chip"><b>'+a+'</b> '+(lang==='fr'?'ans':'yrs')+'</span>'; }
  const md=parseDM(p[S.M]), bdFull=parseDM(p[S.B]);
  if(md&&bdFull){ const am=md.y-bdFull.y; if(am>0&&am<80) chips+='<span class="chip">'+(lang==='fr'?'marié(e) à ':'married at ')+'<b>'+am+'</b></span>'; }

  el.className='lined';
  el.innerHTML=

    '<h2>'+esc(p[0])+'<span>'+esc(p[1]||'—')+'</span></h2>'+
    (chips?'<div class="chips">'+chips+'</div>':'')+
    '<div style="margin-top:12px">'+
      row(T('born'),(p[S.B]||T('dateUnknown'))+place(p[S.BP]))+
      row(T('married'),(p[S.M]||(p[S.MP]?T('dateUnknown'):''))+place(p[S.MP]))+

    coverage();
  el.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>goto(+a.dataset.go));
  el.scrollTop=0;
}

function coverage(){
  const counts={}; Object.keys(P).map(Number).forEach(n=>{ const g=gen(n); counts[g]=(counts[g]||0)+1; });
  let h='<div class="sect" style="margin-top:22px"><span class="lbl">'+T('coverage')+'</span>';
  for(let g=1;g<=12;g++){
    const k=counts[g]||0, tot=Math.pow(2,g-1), pc=Math.round(k/tot*100);
    h+='<div class="bar"><u>G'+g+'</u><span class="tr"><i style="width:'+Math.max(pc,1)+'%"></i></span><u>'+k+'/'+tot+'</u></div>';
  }
  return h+'</div>';
}

function select(n){ selected=n; markSelected(); if(curTab==='fiche') fiche(n); }

function goto(n){
  pathTo(n).forEach(a=>open.add(a));
  draw(); select(n);
  if(window.innerWidth<=900) setMobView('tree');
  const el=treeEl.querySelector('.person[data-sosa="'+n+'"]');
  if(el){
    el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
}

/* ══════════ STATS ══════════ */
const OCCLIST=Object.keys(L.fr.occCat);
function occCat(o){
  o=(o||'').toLowerCase();
  if(!o) return 'none';
  if(/cultivat|laboureur|berger|meunier|ménager|agricole|propriétaire|garde-moulin|meun/.test(o)) return 'farm';
  if(/chaufournier|verrier|galochier|maçon|charpentier|tonnelier|bûcheron|cordonnier|tabletier|boutonnier|dentellière|lingère|tanneur|plombier|couvreur|peigneur|charretier|terrassier/.test(o)) return 'craft';
  if(/marchand|colporteur|débitante|chasse-marée/.test(o)) return 'trade';
  if(/domestique|journalier|manouvrier|ouvrier|instituteur|clerc|maire|employé/.test(o)) return 'serv';
  return 'other';
}

function statsPanel(){
  const el=document.getElementById('panel'); el.className='';
  const ids=Object.keys(P).map(Number);
  const persons=ids.map(n=>({n,p:P[n]}));
  /* basics */
  const surSet=new Set(persons.map(x=>x.p[0]));
  const placeSet=new Set();
  persons.forEach(x=>[S.BP,S.MP,S.DP].forEach(k=>{ if(x.p[k]) placeSet.add(cleanPlace(x.p[k])); }));
  const maxGen=Math.max(...ids.map(gen));
  /* ages */
  const ages=persons.map(x=>{ const by=yr(x.p[S.B]),dy=yr(x.p[S.D]);
    return (by&&dy&&dy>by&&dy-by<120)?{n:x.n,age:dy-by,f:isF(x.n)}:null; }).filter(Boolean);
  const avg=Math.round(ages.reduce((s,a)=>s+a.age,0)/ages.length);
  const oldest=ages.reduce((m,a)=>a.age>m.age?a:m,{age:0});
  const young=ages.filter(a=>a.age<35).length, long=ages.filter(a=>a.age>=80).length;
  /* histogram by decade */
  const buckets=Array(11).fill(0);
  ages.forEach(a=>buckets[Math.min(10,Math.floor(a.age/10))]++);
  const bmax=Math.max(...buckets,1);
  /* occupations */
  const occ={}; persons.forEach(x=>{ const c=occCat(x.p[S.OCC]); occ[c]=(occ[c]||0)+1; });
  const omax=Math.max(...Object.values(occ),1);
  /* zodiac */
  const zc=Array(12).fill(0); let ztot=0;
  persons.forEach(x=>{ const bd=parseDM(x.p[S.B]); if(bd){ zc[ZOD.indexOf(zodiac(bd.d,bd.mo))]++; ztot++; } });
  const zmax=Math.max(...zc,1);
  /* places */
  const plc={};
  persons.forEach(x=>[S.BP,S.MP,S.DP].forEach(k=>{ const c=cleanPlace(x.p[k]); if(c) plc[c]=(plc[c]||0)+1; }));
  const topP=Object.entries(plc).sort((a,b)=>b[1]-a[1]).slice(0,10);
  /* surnames */
  const sn={}; persons.forEach(x=>{ const s=x.p[0].split(' (')[0]; if(!s.startsWith('INCONNU')) sn[s]=(sn[s]||0)+1; });
  const topS=Object.entries(sn).sort((a,b)=>b[1]-a[1]).slice(0,10);
  /* couple age gap proxy: not computable without both dates → marriage age spread instead */
  const mAges=persons.map(x=>{ const bd=parseDM(x.p[S.B]),md=parseDM(x.p[S.M]); return (bd&&md)?md.y-bd.y:null; }).filter(a=>a&&a>10&&a<70);
  const avgM=mAges.length?Math.round(mAges.reduce((s,a)=>s+a,0)/mAges.length):null;

  const bar=(lab,val,max,cls)=>'<div class="bar"><u title="'+esc(lab)+'">'+esc(lab)+'</u><span class="tr"><i class="'+(cls||'')+'" style="width:'+Math.max(Math.round(val/max*100),2)+'%"></i></span><u>'+val+'</u></div>';

  let h='<div class="sect"><span class="lbl">'+T('sOverview')+'</span><div class="big">'+
    '<div class="stat"><b>'+ids.length+'</b><u>'+T('ancestors')+'</u></div>'+
    '<div class="stat"><b>'+maxGen+'</b><u>'+T('gen')+'</u></div>'+
    '<div class="stat"><b>'+surSet.size+'</b><u>'+T('surnames')+'</u></div>'+
    '<div class="stat"><b>'+placeSet.size+'</b><u>'+T('places')+'</u></div>'+
    '<div class="stat"><b>'+avg+'</b><u>'+T('avgAge')+'</u></div>'+
    (avgM?'<div class="stat"><b>'+avgM+'</b><u>'+(lang==='fr'?'âge moyen au mariage':'mean age at marriage')+'</u></div>':'')+
  '</div>'+
  '<p class="note">'+T('kmNote')+'</p>'+
  (oldest.n?'<p class="note">'+T('oldest')+' : <b>'+esc(full(oldest.n))+'</b> ('+oldest.age+(lang==='fr'?' ans':' yrs')+')</p>':'')+
  '</div>';

  h+='<div class="sect"><span class="lbl">'+T('sAges')+' <i style="text-transform:none">'+T('sAges2')+'</i></span>'+
    '<div class="hist">'+buckets.map((b,i)=>'<div title="'+(i*10)+'–'+(i*10+9)+' : '+b+'" style="height:'+Math.round(b/bmax*100)+'%"></div>').join('')+'</div>'+
    '<div class="hticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100+</span></div>'+
    '<div style="margin-top:8px">'+bar(T('young'),young,ages.length,'o')+bar(T('long'),long,ages.length,'g')+'</div>'+
  '</div>';

  h+='<div class="sect"><span class="lbl">'+T('sOcc')+'</span>'+
    OCCLIST.map(c=>occ[c]?bar(T('occCat')[c],occ[c],omax,c==='none'?'':(c==='farm'?'g':'')):'').join('')+'</div>';

  h+='<div class="sect"><span class="lbl">'+T('sSigns')+'</span><div class="zwheel">'+
    ZOD.map((z,i)=>'<div class="zc"><em>'+z[0]+'</em><s>'+(lang==='fr'?z[1]:z[2])+'</s><b>'+zc[i]+'</b></div>').join('')+'</div>'+
    '<p class="note">'+ztot+' '+(lang==='fr'?'dates de naissance complètes connues':'complete birth dates known')+'.</p></div>';

  h+='<div class="sect"><span class="lbl">'+T('sPlaces')+'</span>'+
    topP.map(([k,v])=>bar(k,v,topP[0][1])).join('')+'</div>';

  h+='<div class="sect"><span class="lbl">'+T('sSurnames')+'</span>'+
    topS.map(([k,v])=>bar(k,v,topS[0][1],'o')).join('')+'</div>';

  el.innerHTML=h; el.scrollTop=0;
}

function yearColor(y){
  if(!y) return '#B9B4A4';
  const t=Math.min(1,Math.max(0,(y-1600)/(1968-1600)));
  /* blue (old) → green → gold → red (recent) */
  const stops=[[59,78,110],[76,107,92],[169,133,47],[155,49,56]];
  const seg=Math.min(2,Math.floor(t*3)), f=t*3-seg;
  const a=stops[seg],b=stops[seg+1];
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*f));
  return 'rgb('+c.join(',')+')';
}

function mapPanel(){
  const el=document.getElementById('panel'); el.className='';
  /* aggregate people per place */
  const agg={};
  Object.keys(P).map(Number).forEach(n=>{
    const p=P[n];
    [S.BP,S.MP,S.DP].forEach(k=>{
      const c=cleanPlace(p[k]); if(!c) return;
      if(!GEO[c]) return;
      if(!agg[c]) agg[c]={count:0,years:[],sosas:[]};
      agg[c].count++;
      agg[c].sosas.push(n);
      const y=yr(k===S.BP?p[S.B]:(k===S.MP?p[S.M]:p[S.D]));
      if(y) agg[c].years.push(y);
    });
  });
  /* projection: equirectangular around the region */
  const pts=Object.entries(agg);
  const lngs=pts.map(([k])=>GEO[k][0]), lats=pts.map(([k])=>GEO[k][1]);
  const minX=Math.min(...lngs)-.15, maxX=Math.max(...lngs)+.15;
  const minY=Math.min(...lats)-.12, maxY=Math.max(...lats)+.12;
  const W=320, H=Math.round(W*(maxY-minY)/((maxX-minX)*Math.cos(49.6*Math.PI/180)));
  const X=l=>(l-minX)/(maxX-minX)*W, Y=la=>H-(la-minY)/(maxY-minY)*H;
  const cmax=Math.max(...pts.map(([,v])=>v.count),1);

  let svg='<svg class="map" viewBox="0 0 '+W+' '+H+'" role="img">';
  /* graticule */
  for(let la=Math.ceil(minY*5)/5; la<=maxY; la+=0.5)
    svg+='<path class="rv" d="M0 '+Y(la).toFixed(1)+' H'+W+'" stroke="#DDD9CC" stroke-width=".4"/>';
  for(let lo=Math.ceil(minX*5)/5; lo<=maxX; lo+=0.5)
    svg+='<path class="rv" d="M'+X(lo).toFixed(1)+' 0 V'+H+'" stroke="#DDD9CC" stroke-width=".4"/>';
  /* rivers (decorative): Seine & Somme rough lines */
  svg+='<path class="rv" d="M'+X(0.9)+' '+Y(49.3)+' C '+X(1.1)+' '+Y(49.42)+' '+X(1.3)+' '+Y(49.43)+' '+X(1.6)+' '+Y(49.6)+'"/>';
  svg+='<path class="rv" d="M'+X(1.83)+' '+Y(50.1)+' C '+X(1.86)+' '+Y(50.06)+' '+X(1.9)+' '+Y(50.03)+' '+X(2.1)+' '+Y(50.0)+'"/>';
  pts.sort((a,b)=>b[1].count-a[1].count).forEach(([k,v])=>{
    const [lo,la]=GEO[k];
    const med=v.years.length?v.years.sort((a,b)=>a-b)[Math.floor(v.years.length/2)]:null;
    const r=2.2+Math.sqrt(v.count/cmax)*7;
    svg+='<circle cx="'+X(lo).toFixed(1)+'" cy="'+Y(la).toFixed(1)+'" r="'+r.toFixed(1)+
      '" fill="'+yearColor(med)+'" fill-opacity=".8" data-pl="'+esc(k)+'" data-c="'+v.count+'" data-y="'+(med||'')+'" data-go="'+v.sosas[0]+'"/>';
    if(v.count>=3) svg+='<text class="pl" x="'+(X(lo)+r+1.5).toFixed(1)+'" y="'+(Y(la)+1.8).toFixed(1)+'">'+esc(k)+'</text>';
  });
  svg+='</svg>';

  el.innerHTML='<div class="sect"><span class="lbl">'+(lang==='fr'?'Répartition géographique':'Geographic distribution')+'</span>'+
    '<div id="mapwrap">'+svg+'</div>'+
    '<div class="legend"><span>1618</span><span class="ramp"></span><span>1968</span></div>'+
    '<p class="note">'+T('mapNote')+'</p></div>';
  el.scrollTop=0;

  /* tooltip */
  const tip=document.getElementById('tip');
  el.querySelectorAll('circle[data-pl]').forEach(c=>{
    const show=e=>{
      tip.style.display='block';
      tip.textContent=c.dataset.pl+' · '+c.dataset.c+' '+(lang==='fr'?'personnes':'people')+(c.dataset.y?' · ~'+c.dataset.y:'');
      tip.style.left=Math.min(window.innerWidth-180,e.clientX+12)+'px';
      tip.style.top=(e.clientY+14)+'px';
    };
    c.addEventListener('mousemove',show);
    c.addEventListener('mouseleave',()=>tip.style.display='none');
    c.addEventListener('click',()=>{ tip.style.display='none'; goto(+c.dataset.go); });
  });
}

/* ══════════ TABS / MOBILE / I18N ══════════ */
let curTab='fiche';
function setTab(t){
  curTab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='fiche') fiche(selected);
  else if(t==='stats') statsPanel();
  else mapPanel();
  if(window.innerWidth<=900) setMobView('panel');
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function setMobView(v){
  document.body.classList.toggle('solo',v==='panel');
  document.body.classList.toggle('tree',v==='tree');
  document.querySelectorAll('#mobtabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
}
document.querySelectorAll('#mobtabs button').forEach(b=>b.onclick=()=>setMobView(b.dataset.view));

function applyLang(){
  document.documentElement.lang=lang;
  document.getElementById('title').innerHTML=T('title');
  document.getElementById('subtitle').textContent=Object.keys(P).length+' '+T('ancestors')+' · 12 '+T('gen')+' · '+(lang==='fr'?'Normandie, Picardie & Vexin':'Normandy, Picardy & the Vexin')+' · 1618–1968';
  q.placeholder=T('search');
  document.getElementById('lang').textContent=lang==='fr'?'EN':'FR';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  setTab(curTab);
  draw();
}
document.getElementById('lang').onclick=()=>{ lang=lang==='fr'?'en':'fr'; applyLang(); };
