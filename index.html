const MAP_LAYERS = ['b', 'u', 'd', 'mig'];
/* The ground came first: the coast, the Seine and the Bresle put the villages
   where they are. It shows unless it has been turned off. */
let mapTerrain = localStorage.getItem('boillet-terrain') !== '0';
let mapLiving = true;
/* Fourteen cards need more room than a phone has; the chip turns them on for
   anyone who wants them. Everywhere else they stay on by default. */
let mapShowCards = false;
let mapLayers = { b:false, u:false, d:false, mig:false };
let mapTime = YMAX, mapYearFloor = YMAX, playing = null, playSpeed = 1, lastFrame = 0;
const YRS_PER_SEC = 3;
const MIG_YRS = 4;
const smoothT = t => t * t * (3 - 2 * t);

/* living layer tuning — every span below is in map-years, never wall-clock,
   so scrubbing and pausing stay in step with the animation */
const EVENT_YRS = 6;
const DEATH_FADE = 3;
const BAND_YRS = 2;
const DEPART_YRS = 6;
const BIRTH_YRS = 1.2;
const TICKER_YRS = 12;
const TICKER_MAX = 7;
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let mapFitK = 0, livingLod = -1, livingK = -1;

function mapAllOn() { return !mapLiving && MAP_LAYERS.every(k => mapLayers[k]); }
function cardsVisible() {
  if (!mapLiving) return mapShowCards;
  return mapShowCards || SEL != null;
}

function personLifeVisual(p, year) {
  const by = yr(p.b);
  if (!by) return null;
  let age = year - by;
  if (p.b && p.b[3]) age = null;
  let scale = 1, gray = 0;
  if (age != null) {
    if (age < 18) scale = 0.55 + (age / 18) * 0.45;
    else {
      const end = effectiveDeath(p);
      const span = end != null ? Math.max(1, end - by - 18) : 50;
      gray = Math.min(0.85, (age - 18) / span);
    }
  }
  return { age, scale, gray, opacity: 1 };
}

function lerpPlace(a, b, t) {
  return [a[0], a[1], a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
}

function migControl(x0, y0, x1, y1) {
  return [(x0 + x1) / 2 - (y1 - y0) * 0.22, (y0 + y1) / 2 + (x1 - x0) * 0.22];
}

function quadAt(x0, y0, mx, my, x1, y1, t) {
  const u = 1 - t;
  return [u * u * x0 + 2 * u * t * mx + t * t * x1, u * u * y0 + 2 * u * t * my + t * t * y1];
}

function quadLen(x0, y0, mx, my, x1, y1) {
  let len = 0, px = x0, py = y0;
  for (let i = 1; i <= 24; i++) {
    const [x, y] = quadAt(x0, y0, mx, my, x1, y1, i / 24);
    len += Math.hypot(x - px, y - py);
    px = x; py = y;
  }
  return len;
}

const OFFSET_R0 = 10, OFFSET_STEP = 8, OFFSET_MAX = 28;

function placeSpotKey(pl) {
  return pl[0] + '|' + pl[1] + '|' + pl[2].toFixed(4) + '|' + pl[3].toFixed(4);
}

function buildDotOffsets(pairs) {
  const bySpot = new Map();
  pairs.forEach(({ id, pl }) => {
    if (!pl || pl[2] == null) return;
    const k = placeSpotKey(pl);
    if (!bySpot.has(k)) bySpot.set(k, []);
    bySpot.get(k).push(id);
  });
  const out = new Map();
  bySpot.forEach((ids, k) => {
    ids.sort((a, b) => a - b);
    ids.forEach((id, idx) => {
      const a = idx * 2.39996;
      const r = Math.min(OFFSET_MAX, OFFSET_R0 + idx * OFFSET_STEP);
      out.set(id + '|' + k, [Math.cos(a) * r, Math.sin(a) * r]);
    });
  });
  return out;
}

function dotOffset(id, pl, offMap) {
  if (!pl || pl[2] == null || !offMap) return [0, 0];
  return offMap.get(id + '|' + placeSpotKey(pl)) || [0, 0];
}

function mapXY(pl, id, offMap) {
  const [x, y] = prj(pl[2], pl[3]);
  const [ox, oy] = dotOffset(id, pl, offMap);
  return [x + ox, y + oy];
}

function livingMigState(p, time, offMap) {
  const uy = unionYear(p), up = unionPlace(p);
  if (!p.bp?.[2] || !up || !uy || time < uy) return null;
  const [x0, y0] = mapXY(p.bp, p.id, offMap);
  const [x1, y1] = mapXY(up, p.id, offMap);
  if (Math.hypot(x1 - x0, y1 - y0) <= 2) return null;
  const raw = Math.min(1, Math.max(0, (time - uy) / MIG_YRS));
  const [mx, my] = migControl(x0, y0, x1, y1);
  const col = ramp(ERA, yr(p.b) || uy) || colOf(p) || '#6E9CBF';
  return { x0, y0, x1, y1, mx, my, t: smoothT(raw), col };
}

function livingXY(p, time, offMap) {
  const by = yr(p.b);
  if (by && time < by) return null;
  const mig = livingMigState(p, time, offMap);
  if (mig) return quadAt(mig.x0, mig.y0, mig.mx, mig.my, mig.x1, mig.y1, mig.t);
  const uy = unionYear(p), up = unionPlace(p);
  if (uy && up && time >= uy) return mapXY(up, p.id, offMap);
  if (!p.bp?.[2]) return null;
  return mapXY(p.bp, p.id, offMap);
}

function personPlace(p, time) {
  const by = yr(p.b), uy = unionYear(p), up = unionPlace(p);
  if (by && time < by) return null;
  if (uy && up && time >= uy + MIG_YRS) return up;
  if (!p.bp || p.bp[2] == null) return (uy && up && time >= uy) ? up : null;
  if (uy && up && time >= uy) return lerpPlace(p.bp, up, livingMigState(p, time)?.t ?? 1);
  return p.bp;
}

function migCurve(g, x1, y1, x2, y2, col, op, w, prog) {
  const [mx, my] = migControl(x1, y1, x2, y2);
  const d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  const path = el('path', {
    d, fill: 'none', stroke: col, 'stroke-width': w || 1.1, opacity: op || 0.55, 'stroke-linecap': 'round'
  });
  if (prog != null && prog < 1) {
    const len = quadLen(x1, y1, mx, my, x2, y2);
    path.setAttribute('stroke-dasharray', `${Math.max(0.5, len * prog).toFixed(1)} ${len.toFixed(1)}`);
  }
  g.appendChild(path);
}

/* A Sosa chart pairs couples by construction: 2N and 2N+1 are the two people
   who had N, so the partner of any id is simply id^1. Matching on a shared
   marriage date instead missed the 49 of 140 couples whose wedding was never
   recorded — among them MOREAU Marin dit la Fleur and DAILLY Catherine, who
   name each other as spouse and lie together at Boutencourt but have no
   union date, and so stood apart on the map. */
const SPOUSE = {};
const UNION_Y = new Map();    /* id → the year the household began */
const UNION_EST = new Set();  /* … where that year is reasoned, not recorded */
const UNION_PL = new Map();   /* id → where the household stood */
const UNION_PL_EST = new Set(); /* … where that place is reasoned, not recorded */
(function buildSpouses() {
  ALL.forEach(p => {
    const mid = p.id ^ 1;
    if (p.id >= 2 && has(mid)) SPOUSE[p.id] = mid;
  });
  const real = pl => (pl && pl[2] != null) ? pl : null;
  ALL.forEach(p => {
    const mid = SPOUSE[p.id];
    if (mid == null || UNION_Y.has(p.id)) return;
    const q = get(mid);
    const cid = p.id >> 1;
    const kid = cid >= 1 && has(cid) ? get(cid) : null;
    let y = yr(p.u) ?? yr(q.u), est = false;
    if (y == null) {
      /* no certificate: the couple was keeping house by the time their child
         arrived, and failing that by the time both had come of age */
      const cby = kid ? yr(kid.b) : null;
      const bys = [yr(p.b), yr(q.b)].filter(v => v != null);
      if (cby != null) { y = cby - 1; est = true; }
      else if (bys.length) { y = Math.max(...bys) + 22; est = true; }
    }
    /* Where the household stood. No certificate names the place for about a
       third of these couples, but their child was christened somewhere, and a
       child is born where its parents were living — so the child's birthplace
       stands in. Without it the two halves of a couple sit in the villages
       they were each born in and never share a roof on the map. */
    let pl = real(p.up) || real(q.up), plEst = false;
    if (!pl && kid) { pl = real(kid.bp); plEst = !!pl; }
    if (y == null) return;
    UNION_Y.set(p.id, y); UNION_Y.set(mid, y);
    if (pl) { UNION_PL.set(p.id, pl); UNION_PL.set(mid, pl); }
    if (plEst) { UNION_PL_EST.add(p.id); UNION_PL_EST.add(mid); }
    if (est || plEst) { UNION_EST.add(p.id); UNION_EST.add(mid); }
  });
})();

/* One reading of a union for everything downstream — the recorded date and
   place when there is one, the reasoned one otherwise. */
function unionYear(p)  { return UNION_Y.get(p.id) ?? yr(p.u); }
function unionPlace(p) {
  const u = UNION_PL.get(p.id);
  if (u) return u;
  return (p.up && p.up[2] != null) ? p.up : null;
}

const MED_AGE = (() => {
  const a = ALL.map(p => p.a).filter(x => x != null).sort((x, y) => x - y);
  return a.length ? a[Math.floor(a.length / 2)] : 62;
})();

function effectiveDeath(p) {
  const dy = yr(p.d);
  if (dy) return dy;
  const by = yr(p.b);
  return by ? by + MED_AGE : null;
}

function personAlive(p, time) {
  const by = yr(p.b);
  if (!by || by > time) return false;
  const dy = effectiveDeath(p);
  return dy ? time <= dy : true;
}

function personLife(p, year) {
  const by = yr(p.b), dy = yr(p.d);
  if (!by || by > year) return null;
  const fadeYrs = 4;
  if (dy && year > dy + fadeYrs) return null;
  let age = year - by;
  if (p.b && p.b[3]) age = null;
  let scale = 1, gray = 0, opacity = 1, gone = false;
  if (dy && year > dy) { opacity = Math.max(0, 1 - (year - dy) / fadeYrs); gone = true; }
  if (age != null) {
    if (age < 18) scale = 0.55 + (age / 18) * 0.45;
    else if (dy) {
      const span = Math.max(1, dy - by - 18);
      gray = Math.min(0.85, (age - 18) / span);
    }
  }
  return { age, scale, gray, opacity, dead: gone };
}

function cardPasses(p, time) {
  if (!p.bp || p.bp[2] == null) return null;
  if (mapLiving) {
    if (!mapShowCards && p.id !== SEL) return null;
    const by = yr(p.b);
    if (by == null || by > time) return null;
    const edy = effectiveDeath(p);
    /* The dead stay in the stack for as long as their grave stands on the
       map, marked as deceased, then fade out of it together — so a card never
       blinks away and yanks everyone below it upward. */
    if (edy != null && time > edy) {
      const g = gravePhase(p, time);
      if (!g || g.op <= 0) return null;
      const st = personLifeVisual(p, edy);
      return st ? { ...st, opacity: g.op, dead: true } : null;
    }
    return personLifeVisual(p, time);
  }
  if (!mapShowCards) return null;
  return personLife(p, time);
}

function placesSame(a, b) {
  if (!a || !b) return false;
  if (a[0] === b[0]) return true;
  if (a[2] != null && b[2] != null)
    return Math.abs(a[2] - b[2]) < 0.004 && Math.abs(a[3] - b[3]) < 0.004;
  return false;
}

function cardPlaceLine(p) {
  const birth = p.bp?.[0] || '';
  if (!birth) return (p.dp || p.up)?.[0] || '';
  const finalPl = p.dp || (p.up && !placesSame(p.bp, p.up) ? p.up : null);
  const final = finalPl?.[0] || '';
  if (!final || placesSame(p.bp, finalPl)) return birth;
  return `${birth} → ${final}`;
}

function cardYears(p, st) {
  const span = lifeSpan(p);
  if (!span) return '';
  let age = p.a;
  if (age == null && st?.age != null) age = Math.floor(st.age);
  return age != null ? `${span} (${age})` : span;
}

/* ══════════ households ══════════ */
/* One grouping model feeds both the map cards and the living figures, so a
   family reads the same whichever layer you are looking at. */

/* Where a person is standing once they have finished moving. Mid-migration
   returns null: someone on the road belongs to no household yet. */
function settledPlace(p, time) {
  const by = yr(p.b);
  if (by == null || time < by) return null;
  const bp = (p.bp && p.bp[2] != null) ? p.bp : null;
  const uy = unionYear(p), up = unionPlace(p);
  if (uy != null && up && time >= uy) {
    /* only someone we can see leaving is shown on the road */
    if (bp && !placesSame(bp, up) && time < uy + MIG_YRS) return null;
    return up;
  }
  return bp;
}

/* A child stays part of the parents' household until they grow up, marry,
   die, or turn up somewhere else — then they get their own card and figure. */
function isDependentChild(kid, time, parentPl, kidPl) {
  const by = yr(kid.b);
  if (by == null || time < by) return false;
  if (kid.b[3]) return false;                       /* age only approximate */
  if (time - by >= 18) return false;
  const uy = UNION_Y.get(kid.id) ?? yr(kid.u);
  if (uy != null && time >= uy) return false;
  /* A child who dies keeps their seat for as long as their stone stands. It
     is their own marker either way, and moving it out of the family the
     instant they die would make the death read as a jump across the map. */
  const end = graveEnd(kid);
  if (end != null && time > end) return false;
  return placesSame(parentPl, kidPl);
}

/* Places compare by name first (see placesSame), so the group key does too. */
function locKey(pl) { return (pl[0] || '') + '|' + (pl[1] || ''); }

/* get() hands back the raw record, which carries no id of its own; households
   pass people around by object, so they need the ALL entry instead */
const BYID = new Map(ALL.map(p => [p.id, p]));
const getP = id => BYID.get(id);

/* Sosa numbering: the couple (2N, 2N+1) raised person N. */
function childIdOf(p) { const c = p.id >> 1; return c >= 1 ? c : null; }

/* → { units, locs } where a unit is one household and a loc is one place.
   opts.absorbKids  children at home stand with their parents (the figures do
                    this, so a family reads as one silhouette)
   opts.chain       link each household to the one it raised, so a place shows
                    a column of generations rather than a row of strangers */
function buildHouseholds(time, people, placeFn, opts) {
  const o = opts || {};
  const shown = new Map();
  people.forEach(p => {
    const pl = placeFn(p);
    if (pl && pl[2] != null) shown.set(p.id, pl);
  });

  const units = [], unitOf = new Map();
  const add = u => { u.members.forEach(m => unitOf.set(m.id, u)); units.push(u); return u; };

  /* married couples sharing a roof */
  ALL.forEach(p => {
    if (!shown.has(p.id) || unitOf.has(p.id)) return;
    const mid = SPOUSE[p.id];
    if (mid == null || !shown.has(mid) || unitOf.has(mid)) return;
    const uy = UNION_Y.get(p.id);
    if (uy == null || time < uy) return;
    if (!placesSame(shown.get(p.id), shown.get(mid))) return;
    const q = getP(mid);
    if (!q) return;
    const male = p.s === 'F' ? q : p, female = p.s === 'F' ? p : q;
    add({ kind: 'couple', pl: shown.get(p.id), adults: [male, female], kids: [],
          members: [male, female], key: 'c' + Math.min(p.id, mid),
          uy, uyEst: UNION_EST.has(p.id) });
  });

  /* everyone else opens as their own household */
  ALL.forEach(p => {
    if (!shown.has(p.id) || unitOf.has(p.id)) return;
    add({ kind: 'solo', pl: shown.get(p.id), adults: [p], kids: [],
          members: [p], key: 's' + p.id });
  });

  /* dependent children fold into their parents', oldest generation first so a
     parent always claims their child before that child claims a grandchild */
  if (o.absorbKids) {
    units.slice().sort((a, b) => (b.adults[0].G || 0) - (a.adults[0].G || 0)).forEach(u => {
      if (u.dropped) return;
      const cid = childIdOf(u.adults[0]);
      if (cid == null || !has(cid) || !shown.has(cid)) return;
      const ku = unitOf.get(cid);
      /* only a child who is still a household of one can be absorbed */
      if (!ku || ku === u || ku.dropped || ku.kind !== 'solo' || ku.kids.length) return;
      const kid = getP(cid);
      if (!kid || !isDependentChild(kid, time, u.pl, shown.get(cid))) return;
      u.kids.push(kid);
      u.members.push(kid);
      ku.dropped = true;
      unitOf.set(cid, u);
    });
  }

  const live = units.filter(u => !u.dropped);
  /* a stable sort key keeps stacks from reshuffling as years tick by */
  live.forEach(u => { u.sort = Math.min(...u.members.map(m => m.id)); });

  const groups = o.chain ? chainColumns(live, unitOf) : live.map(u => ({
    key: u.key, pl: u.pl, units: [u], sort: u.sort
  }));

  const locs = [];
  const byKey = new Map();
  groups.forEach(c => {
    const k = locKey(c.pl);
    let g = byKey.get(k);
    if (!g) { g = { key: k, name: c.pl[0] || '', dep: c.pl[1] || '', pl: c.pl, cols: [], units: [] };
              byKey.set(k, g); locs.push(g); }
    g.cols.push(c);
    c.units.forEach(u => g.units.push(u));
  });
  locs.forEach(g => g.cols.sort((a, b) => a.sort - b.sort));
  locs.sort((a, b) => a.key < b.key ? -1 : 1);
  return { units: live, locs, unitOf, shown };
}

/* Thread each household to the one it raised, as long as both stayed put, so
   one place shows a family growing downward instead of a row of look-alikes.
   A column is keyed on its youngest household: ancestors die off the top, and
   keying on the tail keeps the column the same object while they do. */
function chainColumns(live, unitOf) {
  live.forEach(u => {
    const cid = childIdOf(u.adults[0]);
    const cu = cid != null ? unitOf.get(cid) : null;
    if (cu && cu !== u && !cu.dropped && locKey(cu.pl) === locKey(u.pl)) u.childUnit = cu;
  });
  /* a household can be the child of at most one of the couples above it */
  const claimed = new Set();
  live.forEach(u => {
    if (!u.childUnit) return;
    if (claimed.has(u.childUnit.key)) { u.childUnit = null; return; }
    claimed.add(u.childUnit.key);
    u.childUnit.parentUnit = u;
  });
  const cols = [];
  live.forEach(u => {
    if (u.parentUnit) return;
    const chain = [], seen = new Set();
    let c = u;
    while (c && !seen.has(c.key)) { seen.add(c.key); chain.push(c); c = c.childUnit; }
    const tail = chain[chain.length - 1];
    cols.push({ key: tail.key, pl: u.pl, units: chain, sort: tail.sort });
  });
  return cols;
}

/* ══════════ living layer ══════════ */

/* one entry per person: every date the map can dramatise, resolved once */
const LIFE_EV = new Map();
(function buildLifeEvents() {
  ALL.forEach(p => {
    const by = yr(p.b), uy = yr(p.u), dy = yr(p.d);
    const edy = effectiveDeath(p);
    let tradeY = null;
    if (p.o && p.o.length) {
      let hint = null;
      p.o.forEach(o => {
        const m = String(o).match(/\b(1[5-9]\d\d)\b/);
        if (m && (hint == null || +m[1] < hint)) hint = +m[1];
      });
      tradeY = hint != null ? hint : (uy != null ? uy : (by != null ? by + 20 : null));
      if (by != null && tradeY != null && tradeY < by + 12) tradeY = by + 12;
      if (edy != null && tradeY != null && tradeY > edy) tradeY = edy;
    }
    const cid = p.id > 1 ? (p.id >> 1) : null;
    const kid = cid != null && has(cid) ? get(cid) : null;
    /* the year the household actually formed on the map, reasoned or recorded */
    const huy = unionYear(p), hup = unionPlace(p);
    const moved = !!(p.bp && hup && p.bp[2] != null &&
      (Math.abs(p.bp[2] - hup[2]) > 1e-4 || Math.abs(p.bp[3] - hup[3]) > 1e-4));
    LIFE_EV.set(p.id, {
      by, uy, dy, edy, certain: dy != null,
      approxBirth: !!(p.b && p.b[3]),
      tradeY, cat: p.c || null,
      childId: kid ? cid : null, kidY: kid ? yr(kid.b) : null,
      huy, moved, moveEnd: (moved && huy != null) ? huy + MIG_YRS : null,
      grave: (p.dp && p.dp[2] != null) ? p.dp : ((p.up && p.up[2] != null) ? p.up : p.bp)
    });
  });
})();

/* 0..1 eased progress since an event, or null before it happens */
function phase(now, y, span) {
  if (y == null || now < y) return null;
  const raw = (now - y) / (span || EVENT_YRS);
  return raw >= 1 ? 1 : smoothT(raw);
}

/* ── graves ──
   A death leaves a stone standing in the seat. For a couple it stays until
   the survivor joins them, so a widow is shown keeping her place beside her
   husband's grave rather than suddenly standing alone; after that both stones
   linger a few years and go together. Someone who died alone gets the same
   short vigil. */
const GRAVE_HOLD = 5, GRAVE_FADE = 4;

/* the year this person's stone starts to weather away */
function graveStart(p) {
  const edy = effectiveDeath(p);
  if (edy == null) return null;
  const sid = SPOUSE[p.id];
  if (sid != null && has(sid) && UNION_Y.get(p.id) != null) {
    const mate = getP(sid);
    const sEdy = mate ? effectiveDeath(mate) : null;
    if (sEdy != null && sEdy > edy) return sEdy;
  }
  return edy;
}

function graveEnd(p) {
  const s = graveStart(p);
  return s == null ? null : s + GRAVE_HOLD + GRAVE_FADE;
}

/* null while alive, else how solid the stone is and how far it has risen */
function gravePhase(p, time) {
  const edy = effectiveDeath(p);
  if (edy == null || time <= edy) return null;
  const going = time - (graveStart(p) + GRAVE_HOLD);
  return {
    op: going <= 0 ? 1 : Math.max(0, 1 - going / GRAVE_FADE),
    rise: Math.min(1, (time - edy) / 1.5)
  };
}

function livingRenderable(p, time) {
  const by = yr(p.b);
  if (by == null || by > time) return false;
  if (!p.bp || p.bp[2] == null) {
    /* no birthplace on record. They can still be put on the map from the year
       their household forms, and no earlier — we know where they ended up
       living, not where they started. */
    const uy = unionYear(p), up = unionPlace(p);
    if (uy == null || !up || time < uy) return false;
  }
  const end = graveEnd(p);
  return end == null || time <= end;
}

/* withKid: the child is already standing in this household, so the parent is
   drawn on their own — the two-figure glyph is for a young child living
   somewhere else, where nothing else on the map would show them */
function livingStage(age, ev, time, withKid) {
  if (age == null) return 'adult';
  if (age < 3) return 'infant';
  if (age < 13) return 'child';
  if (age < 18) return 'youth';
  if (!withKid && age < 60 && ev.kidY != null && time >= ev.kidY && time - ev.kidY < 10) return 'parent';
  if (age >= 60) return 'elder';
  return 'adult';
}

function coreRadius(age) {
  if (age == null) return 3;
  if (age < 3) return 1.9 + age * 0.15;
  if (age < 13) return 2.35 + (age - 3) * 0.055;
  if (age < 18) return 2.9 + (age - 13) * 0.06;
  if (age < 45) return 3.2;
  return 3.2 - Math.min(0.45, (age - 45) * 0.011);
}

function mixHex(a, b, k) {
  const ca = hex2rgb(a), cb = hex2rgb(b);
  return rgb2hex([0, 1, 2].map(i => ca[i] + (cb[i] - ca[i]) * k));
}

/* ground arc under a silhouette: chord 2r on a circle of radius 1.25r */
const GROUND_LEN_K = 2.318;
function groundPath(r, y) {
  const rr = (r * 1.25).toFixed(2), yy = (y || 0).toFixed(2);
  return `M ${(-r).toFixed(2)} ${yy} A ${rr} ${rr} 0 0 0 ${r.toFixed(2)} ${yy}`;
}
