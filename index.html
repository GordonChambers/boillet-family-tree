function ensureLivingDefs() {
  if (document.getElementById('living-defs')) return;
  const doc = new DOMParser().parseFromString(
    `<svg xmlns="http://www.w3.org/2000/svg">${LIVING_DEFS}</svg>`, 'image/svg+xml');
  const defs = doc.documentElement.firstElementChild;
  if (defs) mapSvg.insertBefore(document.importNode(defs, true), mapSvg.firstChild);
}

let livingG = null, livingGraves = null, livingLines = null, livingUnitsG = null, livingDots = null;
const livingNodes = new Map();
const graveNodes = new Map();

function ensureLivingGroups() {
  if (livingG) return;
  livingG = el('g', { id: 'living' });
  livingGraves = el('g', { 'pointer-events': 'none' });
  livingLines = el('g', { 'pointer-events': 'none' });
  livingUnitsG = el('g', { 'pointer-events': 'none' });
  livingDots = el('g', {});
  livingG.append(livingGraves, livingLines, livingUnitsG, livingDots);
}

function livingTheme() {
  const cs = getComputedStyle(document.documentElement);
  const v = (k, f) => cs.getPropertyValue(k).trim() || f;
  return {
    chalk: v('--chalk', '#E8E2D5'),
    chalk2: v('--chalk2', '#A5AEB9'),
    chalk3: v('--chalk3', '#6E7885'),
    gold: '#C9A44E'
  };
}

/* detail level relative to the fitted view: 0 sparse, 1 full node, 2 named */
function currentLod() {
  const rel = mapFitK > 0 ? zpMap.k / mapFitK : zpMap.k;
  return rel < 0.75 ? 0 : rel < 2 ? 1 : 2;
}

function makeLivingNode(p) {
  const g = el('g', { class: 'lnode', 'data-id': p.id });
  const n = {
    g,
    halo: el('circle', { r: 1, fill: 'none', 'stroke-width': 1.1, opacity: 0, 'pointer-events': 'none' }),
    dust: el('circle', { r: 1, fill: 'none', 'stroke-width': 0.9, 'stroke-dasharray': '1 2.4', opacity: 0, 'pointer-events': 'none' }),
    sel: el('circle', { r: 1, fill: 'none', 'stroke-width': 1.2, opacity: 0, 'pointer-events': 'none' }),
    ring: el('path', { d: '', fill: 'none', 'stroke-width': 1, 'stroke-linecap': 'round', opacity: 0, 'pointer-events': 'none' }),
    band: el('circle', { r: 1, fill: 'none', stroke: '#C9A44E', 'stroke-width': 1.15, opacity: 0, 'pointer-events': 'none' }),
    core: el('circle', { r: 1, 'pointer-events': 'none' }),
    fig: el('use', { width: 13, height: 13, x: -6.5, y: -11, opacity: 0, 'pointer-events': 'none' }),
    sigil: el('use', { width: 8, height: 8, opacity: 0, 'pointer-events': 'none' }),
    cross: el('use', { width: 9, height: 9, x: -4.5, y: -9.5, opacity: 0, 'pointer-events': 'none' }),
    label: el('text', { x: 0, y: 3, 'font-family': 'IBM Plex Mono, monospace', 'font-size': 7.8, opacity: 0, 'pointer-events': 'none' }),
    /* elementsFromPoint skips <g>, so the tap target carries the id itself */
    hit: el('circle', { r: 9, fill: 'transparent', 'data-id': p.id })
  };
  n.hit.style.cursor = 'pointer';
  g.append(n.halo, n.dust, n.sel, n.ring, n.band, n.core, n.fig, n.sigil, n.label, n.hit);
  return n;
}

const EVENT_COL = { born: 'verd', trade: 'cat', wed: 'gold', kid: 'gold', died: 'madder' };

/* most attributes hold steady between frames; skipping the unchanged ones
   keeps the SVG off the style-recalc path during playback */
function sa(node, k, v) {
  const c = node.__a || (node.__a = {});
  if (c[k] === v) return;
  c[k] = v;
  node.setAttribute(k, v);
}
function scol(node, v) {
  if (node.__c === v) return;
  node.__c = v;
  node.style.color = v;
}

function activeLifeEvent(ev, time) {
  let best = null;
  const consider = (kind, y) => {
    if (y == null || time < y || time > y + EVENT_YRS) return;
    if (!best || y > best.y) best = { kind, y };
  };
  consider('born', ev.by);
  consider('trade', ev.tradeY);
  consider('wed', ev.uy);
  consider('kid', ev.kidY);
  consider('died', ev.edy);
  return best;
}

function updateLivingNode(p, ctx) {
  const ev = LIFE_EV.get(p.id);
  const xy = ctx.pos.get(p.id);
  let n = livingNodes.get(p.id);
  if (!n) {
    n = makeLivingNode(p);
    livingNodes.set(p.id, n);
    livingDots.appendChild(n.g);
  }
  const { time, th, lod } = ctx;
  /* the node is drawn at design size and scaled here, so the figure and
     everything pinned to it move together as the zoom changes */
  const K = ctx.K || 1;
  sa(n.g, 'transform',
     `translate(${xy[0].toFixed(2)} ${xy[1].toFixed(2)}) scale(${K.toFixed(4)})`);
  sa(n.g, 'opacity', ctx.dim && !ctx.dim.has(p.id) ? '0.3' : '1');

  const dead = ev.edy != null && time > ev.edy;
  const grave = dead ? gravePhase(p, time) : null;
  const dphase = dead ? Math.min(1, (time - ev.edy) / DEATH_FADE) : 0;
  /* the living chrome — rings, sigil, age arc — goes with the person; the
     stone that replaces them carries its own opacity */
  const alive = dead ? 0 : 1;
  const age = ev.by != null ? (dead ? ev.edy - ev.by : time - ev.by) : null;
  const pop = REDUCED_MOTION ? 1 : (phase(time, ev.by, BIRTH_YRS) ?? 1);
  const r = coreRadius(age) * (0.25 + 0.75 * pop);
  const base = p.s === 'F' ? '#C0605A' : '#6E9CBF';
  const fill = mixHex(base, '#7C8797', age == null ? 0 : Math.max(0, Math.min(0.5, (age - 45) / 80)));
  const evNow = activeLifeEvent(ev, time);
  const catCol = ev.cat ? (CATC[ev.cat] || th.chalk2) : th.chalk2;
  /* household slot: members of one family share a plinth, so their figures
     shrink a little and the child sits smaller still */
  const slot = ctx.slots ? ctx.slots.get(p.id) : null;
  const figK = slot ? slot.figK : 1;

  /* figure, or the stone that takes its place */
  const figSize = (10 + r * 1.1) * (0.3 + 0.7 * pop) * figK;
  const feet = figSize * 0.115, head = -figSize * 0.78;
  sa(n.core, 'r', '0');
  if (grave) {
    /* the stone rises out of the seat the person stood in */
    const gs = figSize * (0.62 + 0.16 * grave.rise);
    sa(n.fig, 'href', '#sil-grave');
    sa(n.fig, 'width', gs.toFixed(2));
    sa(n.fig, 'height', gs.toFixed(2));
    sa(n.fig, 'x', (-gs / 2).toFixed(2));
    sa(n.fig, 'y', (feet - gs * 0.97).toFixed(2));
    scol(n.fig, th.chalk3);
    sa(n.fig, 'opacity', (0.85 * grave.op).toFixed(3));
  } else {
    sa(n.fig, 'href', '#sil-' + livingStage(age, ev, time, slot && slot.hasKid));
    sa(n.fig, 'width', figSize.toFixed(2));
    sa(n.fig, 'height', figSize.toFixed(2));
    sa(n.fig, 'x', (-figSize / 2).toFixed(2));
    sa(n.fig, 'y', (-figSize * 0.86).toFixed(2));
    scol(n.fig, fill);
    sa(n.fig, 'opacity', '0.94');
  }

  /* age ring — solid when the death is recorded, dotted when it is a guess.
     Inside a household the shared plinth carries the ground, so the personal
     arc is dropped to keep the group reading as one silhouette. */
  const span = (ev.edy != null && ev.by != null) ? Math.max(1, ev.edy - ev.by) : null;
  const frac = span ? Math.min(1, Math.max(0, (Math.min(time, ev.edy) - ev.by) / span)) : 0;
  const sure = ev.certain && !ev.approxBirth;
  const ringR = figSize * 0.44;
  if (lod > 0 && !(slot && slot.grouped)) {
    sa(n.ring, 'd', groundPath(ringR, feet));
    const glen = GROUND_LEN_K * ringR;
    sa(n.ring, 'stroke-dasharray', `${(glen * frac).toFixed(2)} ${glen.toFixed(2)}`);
    sa(n.ring, 'stroke', sure ? th.chalk2 : th.chalk3);
    sa(n.ring, 'stroke-width', '0.85');
    sa(n.ring, 'opacity', ((sure ? 0.72 : 0.6) * alive).toFixed(3));
  } else sa(n.ring, 'opacity', '0');

  /* wedding band, drawn on over BAND_YRS. A couple standing together gets the
     entangled pair of rings from the household chrome instead. */
  const wed = ev.uy != null ? phase(time, ev.uy, BAND_YRS) : null;
  if (wed != null && lod > 0 && !(slot && slot.coupled)) {
    const br = 2.1;
    const circ = 2 * Math.PI * br;
    sa(n.band, 'r', br.toFixed(2));
    sa(n.band, 'cy', (head - br - 1).toFixed(2));
    sa(n.band, 'stroke-dasharray', circ.toFixed(1));
    sa(n.band, 'stroke-dashoffset', (circ * (1 - (REDUCED_MOTION ? 1 : wed))).toFixed(1));
    sa(n.band, 'opacity', (0.85 * alive).toFixed(3));
  } else sa(n.band, 'opacity', '0');

  /* occupation sigil, from the year the trade is first documented */
  const trade = ev.tradeY != null && ev.cat && time >= ev.tradeY;
  if (trade && lod > 0) {
    const tp = REDUCED_MOTION ? 1 : (phase(time, ev.tradeY, 1.5) ?? 0);
    /* a badge at the hip: standing beside the figure it would reach into the
       next seat along and read as the neighbour's trade */
    const gs = 7 * (0.5 + 0.5 * tp);
    const sx = ringR * 0.85, sy = -figSize * 0.2;
    sa(n.sigil, 'href', '#sg-' + ev.cat);
    sa(n.sigil, 'width', gs.toFixed(2));
    sa(n.sigil, 'height', gs.toFixed(2));
    sa(n.sigil, 'x', (sx - gs / 2).toFixed(2));
    sa(n.sigil, 'y', (sy - gs / 2).toFixed(2));
    scol(n.sigil, catCol);
    sa(n.sigil, 'opacity', (0.9 * tp * alive).toFixed(3));
  } else sa(n.sigil, 'opacity', '0');

  /* The stone itself now marks the death, so the old cross is redundant. What
     it still has to say is whether the date is attested: a recorded burial
     gets a clean stone, a reckoned one a puff of dust as it settles. */
  const cy0 = -figSize * 0.33;
  if (grave && !ev.certain && dphase < 1) {
    sa(n.dust, 'cy', cy0.toFixed(2));
    sa(n.dust, 'r', (r + 1.5 + dphase * 6).toFixed(2));
    sa(n.dust, 'stroke', th.chalk3);
    sa(n.dust, 'opacity', (0.55 * (1 - dphase) * grave.op).toFixed(3));
  } else sa(n.dust, 'opacity', '0');

  /* event pulse */
  if (evNow && !REDUCED_MOTION && lod > 0) {
    const pr = phase(time, evNow.y, EVENT_YRS) ?? 0;
    const key = EVENT_COL[evNow.kind];
    const col = key === 'gold' ? th.gold : key === 'cat' ? catCol
      : key === 'madder' ? '#C0605A' : key === 'verd' ? '#6E9E85' : th.chalk;
    sa(n.halo, 'cy', cy0.toFixed(2));
    sa(n.halo, 'r', (r + 1.5 + pr * 9).toFixed(2));
    sa(n.halo, 'stroke', col);
    sa(n.halo, 'opacity', (0.5 * (1 - pr)).toFixed(3));
  } else sa(n.halo, 'opacity', '0');

  /* selection */
  if (SEL === p.id) {
    sa(n.sel, 'cy', cy0.toFixed(2));
    sa(n.sel, 'r', (figSize * 0.56).toFixed(2));
    sa(n.sel, 'stroke', th.chalk);
    sa(n.sel, 'opacity', '0.9');
  } else sa(n.sel, 'opacity', '0');

  /* first name, centred under the feet — captioning the figure the way the
     place names caption the towns. Held back at the widest zoom, where the
     figures are too close together for the text to belong to anything. */
  const named = lod > 0 || SEL === p.id;
  if (named) {
    const txt = (firstGiven(p) || p.n).slice(0, 12);
    if (n.label.textContent !== txt) n.label.textContent = txt;
    /* names are wider than the seats they sit under, so neighbours in a
       household drop to alternate lines rather than printing over each other */
    const row = slot ? (slot.seat || 0) % 2 : 0;
    sa(n.label, 'text-anchor', 'middle');
    sa(n.label, 'x', '0');
    sa(n.label, 'y', (feet + 8 + row * 7).toFixed(2));
    sa(n.label, 'font-size', '6');
    /* the name stays under the stone — it is whose grave it is */
    sa(n.label, 'fill', grave ? th.chalk2 : th.chalk);
    sa(n.label, 'opacity',
       ((SEL === p.id ? 0.95 : 0.72) * (grave ? grave.op : 1)).toFixed(3));
  } else sa(n.label, 'opacity', '0');

  sa(n.hit, 'cy', cy0.toFixed(2));
  sa(n.hit, 'r', Math.max(5.5, figSize * 0.5).toFixed(1));
}

function drawLivingLines(shown, ctx) {
  const { time, offMap, pos, slots, th, lod } = ctx;
  livingLines.textContent = '';
  /* two people seated in one household need no link drawn between them —
     the shared plinth and the rings already say it */
  const sameUnit = (a, b) => {
    const x = slots && slots.get(a), y = slots && slots.get(b);
    return !!(x && y && x.unit && x.unit === y.unit);
  };

  shown.forEach(p => {
    if (!pos.has(p.id)) return;
    const mig = (ctx.migs && ctx.migs.get(p.id)) || travelState(p, time, offMap);
    if (!mig) return;
    if (mig.t >= 1 || REDUCED_MOTION) {
      /* once settled, land the trail on the seat they actually took */
      const end = pos.get(p.id);
      migCurve(livingLines, mig.x0, mig.y0, end[0], end[1], mig.col, 0.3, 0.9);
      return;
    }
    /* comet: a short lit segment trailing the traveller */
    const mx = mig.mx, my = mig.my;
    const len = quadLen(mig.x0, mig.y0, mx, my, mig.x1, mig.y1);
    const head = len * mig.t;
    if (head < 0.6) return;
    const trail = Math.min(head, Math.max(8, len * 0.3));
    const path = el('path', {
      d: `M ${mig.x0.toFixed(1)} ${mig.y0.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${mig.x1.toFixed(1)} ${mig.y1.toFixed(1)}`,
      fill: 'none', stroke: mig.col, 'stroke-width': 1.3, 'stroke-linecap': 'round', opacity: 0.7,
      'stroke-dasharray': `0 ${(head - trail).toFixed(1)} ${trail.toFixed(1)} ${len.toFixed(1)}`
    });
    livingLines.appendChild(path);
  });

  /* parent and child, while the child is still at home */
  if (lod > 0) {
    shown.forEach(p => {
      const ev = LIFE_EV.get(p.id);
      if (!ev || ev.childId == null) return;
      if (sameUnit(p.id, ev.childId)) return;
      const a = pos.get(p.id), b = pos.get(ev.childId);
      if (!a || !b) return;
      const cev = LIFE_EV.get(ev.childId);
      if (!cev || cev.by == null) return;
      const cage = time - cev.by;
      if (cage < 0 || cage > 18) return;
      if (cev.huy != null && time >= cev.huy) return;
      const near = ctx.dim && ctx.dim.has(p.id) && ctx.dim.has(ev.childId);
      livingLines.appendChild(el('line', {
        x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1),
        stroke: th.chalk3, 'stroke-width': near ? 0.9 : 0.6,
        opacity: ((near ? 0.5 : 0.16) * (1 - cage / 18) + (near ? 0.1 : 0.03)).toFixed(3)
      }));
    });
  }

  /* A child striking out on their own. Leaving town draws its own curve, but
     leaving the family seat for a household across the same village would
     otherwise be a silent jump, so hold a line back to the parents for a few
     years and let it fade. */
  if (lod > 0) {
    shown.forEach(p => {
      const ev = LIFE_EV.get(p.id);
      if (!ev || ev.by == null) return;
      const leaves = Math.min(ev.by + 18, ev.huy != null ? ev.huy : Infinity);
      if (!isFinite(leaves)) return;
      const since = time - leaves;
      if (since < 0 || since > DEPART_YRS) return;
      if (livingMigState(p, time, offMap)) return;
      const me = pos.get(p.id);
      if (!me) return;
      const ps = [p.id * 2, p.id * 2 + 1].map(i => pos.get(i)).filter(Boolean);
      if (!ps.length) return;
      const px = ps.reduce((s, q) => s + q[0], 0) / ps.length;
      const py = ps.reduce((s, q) => s + q[1], 0) / ps.length;
      if (Math.hypot(me[0] - px, me[1] - py) < 1.5) return;
      livingLines.appendChild(el('line', {
        x1: px.toFixed(1), y1: py.toFixed(1), x2: me[0].toFixed(1), y2: me[1].toFixed(1),
        stroke: th.chalk2, 'stroke-width': 0.9, 'stroke-dasharray': '2.5 2',
        opacity: (0.55 * (1 - since / DEPART_YRS)).toFixed(3)
      }));
    });
  }

  const linked = new Set();
  shown.forEach(p => {
    const sid = SPOUSE[p.id];
    if (!sid || linked.has(p.id) || linked.has(sid)) return;
    const uy = UNION_Y.get(p.id);
    if (uy == null || time < uy) return;
    if (sameUnit(p.id, sid)) { linked.add(p.id); linked.add(sid); return; }
    const a = pos.get(p.id), b = pos.get(sid);
    if (!a || !b) return;
    linked.add(p.id); linked.add(sid);
    livingLines.appendChild(el('line', {
      x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1),
      stroke: th.gold, 'stroke-width': 1.1, opacity: 0.6, 'stroke-dasharray': '3 2'
    }));
  });
}

function updateGraves(time, th, lod, scale, dim) {
  const active = new Set();
  const size = 7 * scale;
  if (lod > 0) {
    ALL.forEach(p => {
      const ev = LIFE_EV.get(p.id);
      if (!ev || !ev.certain || ev.dy == null || time < ev.dy) return;
      const pl = ev.grave;
      if (!pl || pl[2] == null) return;
      active.add(p.id);
      let u = graveNodes.get(p.id);
      if (!u) {
        u = el('use', { 'pointer-events': 'none' });
        u.setAttribute('href', '#sil-grave');
        const [gx, gy] = prj(pl[2], pl[3]);
        const a = p.id * 2.39996, rr = 3.5 + (p.id % 4) * 2.4;
        u.dataset.gx = gx + Math.cos(a) * rr;
        u.dataset.gy = gy + Math.sin(a) * rr;
        livingGraves.appendChild(u);
        graveNodes.set(p.id, u);
      }
      sa(u, 'width', size.toFixed(2));
      sa(u, 'height', size.toFixed(2));
      sa(u, 'x', (+u.dataset.gx - size / 2).toFixed(2));
      sa(u, 'y', (+u.dataset.gy - size / 2).toFixed(2));
      scol(u, th.chalk3);
      const fade = 0.2 * Math.min(1, (time - ev.dy) / DEATH_FADE);
      const dull = dim && !dim.has(p.id) ? DIM_OP : 1;
      sa(u, 'opacity', (fade * dull).toFixed(3));
    });
  }
  graveNodes.forEach((u, id) => {
    if (!active.has(id)) { u.remove(); graveNodes.delete(id); }
  });
}

let tickerSig = '';
const tickerBox = document.getElementById('life-ticker');

function eventPlace(p, ev, kind) {
  if (kind === 'born') return p.bp?.[0];
  if (kind === 'wed') return p.up?.[0];
  if (kind === 'move') return unionPlace(p)?.[0];
  if (kind === 'died') return (p.dp || p.up || p.bp)?.[0];
  if (kind === 'kid' && ev.childId != null) return get(ev.childId)?.bp?.[0];
  return null;
}

function hideLifeTicker() {
  if (!tickerBox) return;
  const tw = document.getElementById('tkw');
  if (tw) tw.classList.remove('on');
  tickerBox.textContent = '';
  tickerSig = '';
}

function updateLifeTicker(time) {
  if (!tickerBox) return;
  const rows = [];
  ALL.forEach(p => {
    const ev = LIFE_EV.get(p.id);
    if (!ev || !p.bp) return;
    const add = (y, kind) => {
      if (y != null && y <= time && y > time - TICKER_YRS) rows.push({ id: p.id, y, kind });
    };
    add(ev.by, 'born');
    add(ev.uy, 'wed');
    add(ev.moveEnd, 'move');
    add(ev.kidY, 'kid');
    if (ev.certain) add(ev.dy, 'died');
  });
  rows.sort((a, b) => b.y - a.y || a.id - b.id);
  const top = rows.slice(0, TICKER_MAX);
  const sig = L + '|' + top.map(r => `${r.id}${r.kind}${r.y}`).join(',');
  if (sig !== tickerSig) {
    const nWas = tickerBox.childElementCount;
    tickerSig = sig;
    tickerBox.textContent = '';
    if (nWas !== top.length) requestAnimationFrame(measureMapTools);
    top.forEach(r => {
      const p = get(r.id);
      const ev = LIFE_EV.get(r.id);
      const b = document.createElement('button');
      b.className = 'ev-' + r.kind;
      b.dataset.y = r.y;
      const verb = t(r.kind === 'born' ? 'evBorn' : r.kind === 'wed' ? 'evWed'
        : r.kind === 'move' ? 'evMove' : r.kind === 'kid' ? 'evKid' : 'evDied');
      const place = eventPlace(p, ev, r.kind);
      const gv = (p.g || '').replace(/["()]/g, '').split(/[ \-]/)[0] || '';
      b.innerHTML = `<span class="ty">${r.y}</span> ${verb} · <b>${gv ? gv + ' ' : ''}${p.n}</b>` +
        (place ? ` · ${place}` : '');
      b.onclick = () => select(r.id);
      tickerBox.appendChild(b);
    });
  }
  Array.from(tickerBox.children).forEach(b => {
    const since = time - (+b.dataset.y);
    b.style.opacity = Math.max(0.3, 1 - since / TICKER_YRS).toFixed(2);
  });
  /* keep the shell up even in quiet years — an empty log is still a log */
  const tw = document.getElementById('tkw');
  if (tw && !tw.classList.contains('on')) {
    tw.classList.add('on');
    requestAnimationFrame(measureMapTools);
  }
}

function resetLivingNodes() {
  livingNodes.forEach(n => n.g.remove());
  livingNodes.clear();
}

/* household seating on the map: a family stands shoulder to shoulder, and
   separate households at one place queue up above and below each other */
/* Seat pitch has to clear the figures themselves — an adult glyph is about
   12.4 units across and a child's 8.9 — and the row pitch has to clear the
   name printed under each one. */
const HH_ROW = 27, HH_ADULT_W = 14, HH_KID_W = 11;
/* clear space between a village marker and the bracket beside the queue */
const HH_GAP = 16;

/* The people track the zoom at half rate: double the map and they grow by
   √2, not 2. Drawn at full rate they swamped the map the moment you looked
   closely; drawn at a fixed screen size they stopped belonging to the ground
   they stand on. Everything in a household — seats, plinth, rings, captions
   — takes this one factor, so a family keeps its proportions at every zoom. */
function householdScale() {
  const rel = mapFitK > 0 ? zpMap.k / mapFitK : 1;
  return Math.min(2.4, 1 / Math.sqrt(Math.max(0.05, rel)));
}

/* Where each place's queue ended up last frame. A household forming or dying
   changes the height of its queue, which changes the answer for everything it
   touches; solved from nothing each frame that lands as a jump, so the solver
   is seeded from where things already are and walks part of the way. */
const hhOff = new Map();
const HH_EASE = 0.25;

/* Push the queues apart until they stop sharing ground. Deterministic — same
   boxes in, same answer out — so a place does not twitch between frames while
   the years run, and bounded, so nobody is shoved so far from their village
   that the leader line stops being believable. */
function separateHouseholds(boxes, K) {
  if (boxes.length < 2) return;
  const PAD = 4 * K, MAXOFF = 70 * K, EASE = 0.5;
  for (let pass = 0; pass < 60; pass++) {
    let hit = false;
    for (let i = 0; i < boxes.length; i++) {
      const a = boxes[i];
      for (let j = i + 1; j < boxes.length; j++) {
        const b = boxes[j];
        const dx = (b.cx + b.ox + b.dx) - (a.cx + a.ox + a.dx);
        const dy = (b.cy + b.dy) - (a.cy + a.dy);
        const ox = (a.w + b.w) / 2 + PAD - Math.abs(dx);
        const oy = (a.h + b.h) / 2 + PAD - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        hit = true;
        /* out along whichever axis is the shorter way clear; two places at the
           very same spot break the tie on their order, which is stable */
        if (ox < oy) {
          const s = (dx || 1) > 0 ? ox * EASE / 2 : -ox * EASE / 2;
          a.dx -= s; b.dx += s;
        } else {
          const s = (dy || 1) > 0 ? oy * EASE / 2 : -oy * EASE / 2;
          a.dy -= s; b.dy += s;
        }
      }
    }
    for (const b of boxes) {
      const d = Math.hypot(b.dx, b.dy);
      if (d > MAXOFF) { b.dx *= MAXOFF / d; b.dy *= MAXOFF / d; }
    }
    if (!hit) break;
  }
}

function livingLayout(time) {
  const shown = ALL.filter(p => livingRenderable(p, time));
  const settled = [], moving = [];
  shown.forEach(p => (settledPlace(p, time) ? settled : moving).push(p));

  const hh = buildHouseholds(time, settled, p => settledPlace(p, time), { absorbKids: true });
  const pos = new Map(), slots = new Map(), units = [];
  const K = householdScale();
  const ROW = HH_ROW * K, ADULT_W = HH_ADULT_W * K, KID_W = HH_KID_W * K;

  /* Measure every place's queue before anybody sits down. Villages a few
     kilometres apart put their households on the same patch of map, and a seat
     assigned before the queues have been pushed apart is a seat in the wrong
     place. */
  const boxes = hh.locs.map(g => {
    const [cx, cy] = prj(g.pl[2], g.pl[3]);
    const n = g.units.length;
    /* One household stands on its village. Several of them cannot — they queue
       up the map and the outer ones end up nowhere near it — so the queue steps
       aside and a bracket beside it carries a leader back to the spot. */
    const widest = Math.max(...g.units.map(u =>
      u.adults.length * ADULT_W + u.kids.length * KID_W));
    const shift = n > 1 ? HH_GAP * K + widest / 2 : 0;
    const x0 = n > 1 ? cx : cx - widest / 2, x1 = cx + shift + widest / 2;
    return { g, key: g.key, cx, cy, n, shift, dx: 0, dy: 0,
             w: x1 - x0, h: n * ROW + 6 * K, ox: (x0 + x1) / 2 - cx };
  });
  /* a deliberate jump through the years re-solves outright; one frame's worth
     of drift walks there instead */
  const warp = Math.abs(time - seatT) > 3;
  if (warp) hhOff.clear();
  boxes.forEach(b => {
    const o = hhOff.get(b.key);
    if (o) { b.dx = o[0]; b.dy = o[1]; }
  });
  separateHouseholds(boxes, K);
  boxes.forEach(b => {
    const o = hhOff.get(b.key);
    if (o && !warp) {
      b.dx = o[0] + (b.dx - o[0]) * HH_EASE;
      b.dy = o[1] + (b.dy - o[1]) * HH_EASE;
    }
    hhOff.set(b.key, [b.dx, b.dy]);
  });

  boxes.forEach(bx => {
    const { g, n, shift } = bx;
    const cx = bx.cx + bx.dx, cy = bx.cy + bx.dy;
    g.units.forEach((u, i) => {
      const uy = cy + (i - (n - 1) / 2) * ROW;
      const w = u.adults.length * ADULT_W + u.kids.length * KID_W;
      const grouped = u.members.length > 1;
      const coupled = u.kind === 'couple';
      let x = cx + shift - w / 2;
      const adultXs = [];
      u.adults.forEach((m, j) => {
        const mx = x + ADULT_W / 2; x += ADULT_W;
        adultXs.push(mx);
        pos.set(m.id, [mx, uy]);
        slots.set(m.id, { grouped, coupled, figK: grouped ? 0.92 : 1, unit: u.key,
                          hasKid: u.kids.length > 0, seat: j });
      });
      const kidXs = [];
      u.kids.forEach(k => {
        const kx = x + KID_W / 2; x += KID_W;
        kidXs.push(kx);
        pos.set(k.id, [kx, uy]);
        slots.set(k.id, { grouped: true, coupled: false, figK: 0.68, unit: u.key,
                          seat: u.adults.length + kidXs.length - 1 });
      });
      units.push({ u, cx: cx + shift, cy: uy, ax: bx.cx, ay: bx.cy,
                   off: shift > 0 || Math.hypot(bx.dx, bx.dy) > 5 * K, w,
                   grouped, coupled, adultXs, kidXs, K });
    });
  });

  /* remember where everyone was sitting: someone who leaves has to set off
     from the seat they were actually in, not from the bare place marker */
  if (time < seatT - 0.01) { lastSeat.clear(); departSeat.clear(); }
  seatT = time;
  settled.forEach(p => { if (pos.has(p.id)) lastSeat.set(p.id, pos.get(p.id)); });

  /* anyone mid-move keeps the old spiral offsets: they belong to no household
     until the curve finishes, so they must not sit on top of one another */
  const pairs = [];
  moving.forEach(p => {
    pairs.push({ id: p.id, pl: p.bp });
    const up = unionPlace(p);
    if (unionYear(p) && up && time >= unionYear(p)) pairs.push({ id: p.id, pl: up });
  });
  const offMap = buildDotOffsets(pairs);
  const migs = new Map();
  moving.forEach(p => {
    if (!departSeat.has(p.id) && lastSeat.has(p.id)) departSeat.set(p.id, lastSeat.get(p.id));
    const mig = travelState(p, time, offMap);
    if (!mig) {
      const xy = livingXY(p, time, offMap);
      if (xy) pos.set(p.id, xy);
    } else {
      migs.set(p.id, mig);
      pos.set(p.id, quadAt(mig.x0, mig.y0, mig.mx, mig.my, mig.x1, mig.y1, mig.t));
    }
    if (pos.has(p.id))
      slots.set(p.id, { grouped: false, coupled: false, figK: 1, unit: null, seat: 0 });
  });

  return { shown, pos, slots, units, offMap, migs, K };
}

/* the seat someone was last in, and the one they set out from */
const lastSeat = new Map(), departSeat = new Map();
let seatT = -Infinity;

/* livingMigState re-anchored on the seat the traveller vacated, so the curve
   leaves the family group rather than the place marker beside it */
function travelState(p, time, offMap) {
  const mig = livingMigState(p, time, offMap);
  if (!mig) return null;
  const from = departSeat.get(p.id);
  if (from) { mig.x0 = from[0]; mig.y0 = from[1]; }
  const [mx, my] = migControl(mig.x0, mig.y0, mig.x1, mig.y1);
  mig.mx = mx; mig.my = my;
  return mig;
}

/* the chrome that turns adjacent figures into one silhouette: a shared plinth,
   the couple's two entangled rings, and a tick separating the children */
function drawHouseholdChrome(layout, ctx) {
  livingUnitsG.textContent = '';
  const { th, lod, time, dim } = ctx;
  if (lod < 1) return;

  /* Where several households had to step aside from their village, a rule down
     the near edge of the queue says which of them belong together, and a leader
     runs from the middle of it back to the marker on the spot. */
  const groups = new Map();
  layout.units.forEach(un => {
    if (!un.off) return;
    const k = un.ax.toFixed(2) + '|' + un.ay.toFixed(2);
    let s = groups.get(k);
    if (!s) { s = { ax: un.ax, ay: un.ay, left: Infinity, right: -Infinity,
                    top: un.cy, bot: un.cy, K: un.K };
              groups.set(k, s); }
    s.left = Math.min(s.left, un.cx - un.w / 2);
    s.right = Math.max(s.right, un.cx + un.w / 2);
    if (un.cy < s.top) s.top = un.cy;
    if (un.cy > s.bot) s.bot = un.cy;
  });
  groups.forEach(s => {
    const K = s.K;
    /* the rule goes on whichever side of the queue the village is on */
    const near = s.ax <= (s.left + s.right) / 2;
    const bx = near ? s.left - 3 * K : s.right + 3 * K;
    const y0 = s.top - 9 * K, y1 = s.bot + 5 * K;
    const ly = Math.max(y0, Math.min(y1, s.ay));
    livingLines.appendChild(el('line', {
      x1: bx.toFixed(1), y1: y0.toFixed(1), x2: bx.toFixed(1), y2: y1.toFixed(1),
      stroke: th.chalk2, 'stroke-width': (0.7 * K).toFixed(2),
      'stroke-linecap': 'round', opacity: 0.45
    }));
    livingLines.appendChild(el('line', {
      x1: s.ax.toFixed(1), y1: s.ay.toFixed(1), x2: bx.toFixed(1), y2: ly.toFixed(1),
      stroke: th.chalk3, 'stroke-width': (0.5 * K).toFixed(2), opacity: 0.4
    }));
    livingLines.appendChild(el('circle', {
      cx: s.ax.toFixed(1), cy: s.ay.toFixed(1), r: (1.8 * K).toFixed(2),
      fill: 'none', stroke: th.chalk3, 'stroke-width': (0.6 * K).toFixed(2), opacity: 0.6
    }));
  });
  layout.units.forEach(un => {
    if (!un.grouped) return;
    const dull = dim && !un.u.members.some(m => dim.has(m.id)) ? DIM_OP : 1;
    /* the chrome takes the same zoom factor as the figures it belongs to */
    const K = un.K || 1;
    const y = un.cy + 1.5 * K, half = un.w / 2 - K;

    livingUnitsG.appendChild(el('path', {
      d: `M ${(un.cx - half).toFixed(1)} ${y.toFixed(1)} Q ${un.cx.toFixed(1)} ` +
         `${(y + 1.5 * K).toFixed(1)} ${(un.cx + half).toFixed(1)} ${y.toFixed(1)}`,
      fill: 'none', stroke: th.chalk2, 'stroke-width': (0.9 * K).toFixed(2),
      'stroke-linecap': 'round', opacity: (0.5 * dull).toFixed(3)
    }));

    if (un.coupled && un.adultXs.length === 2) {
      const mx = (un.adultXs[0] + un.adultXs[1]) / 2, my = un.cy - 11.5 * K;
      const wp = un.u.uy != null ? (phase(time, un.u.uy, BAND_YRS) ?? 0) : 1;
      const op = (0.92 * dull * (REDUCED_MOTION ? 1 : wp)).toFixed(3);
      if (+op > 0.01) {
        const r = 1.55 * K, d = 1.2 * K;
        const rg = el('g', { fill: 'none', stroke: th.gold,
                             'stroke-width': (0.55 * K).toFixed(2), opacity: op });
        /* dotted where the marriage year was reasoned from the children
           rather than read off a certificate — the same convention the age
           rings use for an estimated death */
        if (un.u.uyEst) rg.setAttribute('stroke-dasharray', `${(0.7 * K).toFixed(2)} ${(0.8 * K).toFixed(2)}`);
        rg.appendChild(el('circle', { cx: (mx - d).toFixed(2), cy: my.toFixed(2), r: r }));
        rg.appendChild(el('circle', { cx: (mx + d).toFixed(2), cy: my.toFixed(2), r: r }));
        /* the left ring's near arc, redrawn last, so the two read as linked */
        const ax = (mx - d + r * 0.5).toFixed(2);
        rg.appendChild(el('path', {
          d: `M ${ax} ${(my - r * 0.866).toFixed(2)} A ${r} ${r} 0 0 1 ${ax} ${(my + r * 0.866).toFixed(2)}`
        }));
        livingUnitsG.appendChild(rg);
      }
    }

    if (un.kidXs.length && un.adultXs.length) {
      const sx = (un.adultXs[un.adultXs.length - 1] + un.kidXs[0]) / 2;
      livingUnitsG.appendChild(el('line', {
        x1: sx.toFixed(1), y1: (un.cy - 6.5 * K).toFixed(1),
        x2: sx.toFixed(1), y2: (un.cy + 0.5 * K).toFixed(1),
        stroke: th.chalk3, 'stroke-width': (0.6 * K).toFixed(2),
        opacity: (0.45 * dull).toFixed(3)
      }));
    }
  });
}

function updateLivingLayer() {
  if (!mapLiving) { hideLifeTicker(); mapObstacles = []; return; }
  ensureLivingDefs();
  ensureLivingGroups();
  if (livingG.parentNode !== mapG) mapG.appendChild(livingG);

  const time = mapTime;
  const th = livingTheme();
  const lod = currentLod();
  livingLod = lod;
  livingK = zpMap.k;

  const layout = livingLayout(time);
  const { shown, pos, slots } = layout;
  const dim = SEL != null ? (selPath || lineageOf(SEL)) : null;

  const K = layout.K;
  const ctx = { time, offMap: layout.offMap, pos, slots, migs: layout.migs,
                th, lod, dim, K };
  drawLivingLines(shown, ctx);
  drawHouseholdChrome(layout, ctx);
  shown.forEach(p => { if (pos.has(p.id)) updateLivingNode(p, ctx); });
  livingNodes.forEach((n, id) => {
    if (!pos.has(id)) { n.g.remove(); livingNodes.delete(id); }
  });
  updateGraves(time, th, lod, K, dim);
  updateLifeTicker(time);
  /* the cards steer clear of every figure on the map */
  mapObstacles = [];
  pos.forEach(xy => mapObstacles.push([xy[0], xy[1], 11 * K]));
}

/* ══════════ map card stacks ══════════ */

/* Where a card is pinned on the map. Unlike the figures this never goes null
   mid-move: a card that hopped onto the road would only read as jitter, so it
   changes place once, on the wedding, together with the stack it joins. */
function cardPlaceOf(p, time) {
  if (mapLiving) {
    const uy = unionYear(p), up = unionPlace(p);
    if (uy != null && up && time >= uy) return up;
  }
  if (p.bp && p.bp[2] != null) return p.bp;
  const uy = unionYear(p), up = unionPlace(p);
  return (uy != null && up && time >= uy) ? up : null;
}

/* two interlocking gold bands, sitting in the seam between husband and wife */
const RINGS_SVG =
  '<svg viewBox="0 0 44 20" width="44" height="20" aria-hidden="true">' +
  '<g fill="none" stroke="#C9A44E" stroke-width="1.7" stroke-linecap="round">' +
  '<circle cx="18" cy="10" r="6.4"/><circle cx="26" cy="10" r="6.4"/>' +
  '<path d="M21.2 4.46A6.4 6.4 0 0 1 21.2 15.54"/></g></svg>';

const CARD_PAD = 15;        /* clearance kept between stacks, screen px */
const CARD_STANDOFF = 30;   /* how far a stack floats off its anchor */
const CARD_MAX_OFF = 700;   /* villages cluster tightly; the leader lines
                               let a stack travel well clear of the pack */
const CARD_EASE = 0.18;     /* per-frame approach — low enough to look calm */
const CARD_STEP = 10;       /* and never more than this many px in one frame */
const CARD_DEADBAND = 0.45; /* below this a stack simply does not move */

const stackNodes = new Map();   /* locKey → stack element */
const stackState = new Map();   /* locKey → { dx, dy, tx, ty, ix, iy, pinned } */
const rowHeights = new Map();   /* row signature → natural px height */
let calloutRows = [];
let mapCalloutG = null;

function stackAnchorXY(pl) { return prj(pl[2], pl[3]); }

/* dx, dy are the offsets to the box's top-left corner. Anchoring the corner
   rather than the centre is what makes a stack grow *into* free space: a new
   generation extends it downward and a second family extends it rightward,
   with everything already on screen staying exactly where it was. */
function applyStackTransform(elm, s, w, h) {
  elm.style.transform =
    `scale(var(--map-inv)) translate(${s.dx.toFixed(1)}px,${s.dy.toFixed(1)}px)`;
}

/* where a leader line should touch a box, coming in from the anchor */
function boxEdge(cx, cy, hw, hh, tx, ty) {
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return [cx, cy];
  const s = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return [cx + dx * Math.min(1, s), cy + dy * Math.min(1, s)];
}

/* The leader lines sat underneath the map they lead across, so the ground and
   the dots painted over them and a stack five hundred pixels from its village
   looked like it belonged nowhere. They go above the map and below the people,
   which is where a leader line belongs: over what it crosses, under what it
   points at. */
function ensureCalloutG() {
  const before = document.getElementById('living');
  if (mapCalloutG && mapCalloutG.parentNode === mapG &&
      mapCalloutG.nextSibling === (before || null)) return;
  if (!mapCalloutG) mapCalloutG = el('g', { id: 'map-callouts', 'pointer-events': 'none' });
  if (before) mapG.insertBefore(mapCalloutG, before);
  else mapG.appendChild(mapCalloutG);
}

function drawCallouts() {
  if (!calloutRows.length) { if (mapCalloutG) mapCalloutG.textContent = ''; return; }
  ensureCalloutG();
  const ms = mapScaleNow();
  if (!ms) return;
  const cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue('--chalk3').trim() || '#6E7885';
  const frag = document.createDocumentFragment();
  calloutRows.forEach(r => {
    const s = stackState.get(r.key);
    if (!s || s.dx == null) return;
    const cx = r.ax + (s.dx + r.w / 2) / ms, cy = r.ay + (s.dy + r.h / 2) / ms;
    const hw = r.w / 2 / ms, hh = r.h / 2 / ms;
    const [ex, ey] = boxEdge(cx, cy, hw, hh, r.ax, r.ay);
    if (Math.hypot(ex - r.ax, ey - r.ay) * ms < 4) return;
    frag.appendChild(el('line', {
      x1: r.ax.toFixed(2), y1: r.ay.toFixed(2), x2: ex.toFixed(2), y2: ey.toFixed(2),
      stroke: ink, 'stroke-width': 1.1, opacity: s.pinned ? 0.95 : 0.8
    }));
    frag.appendChild(el('circle', {
      cx: r.ax.toFixed(2), cy: r.ay.toFixed(2), r: (2.6 / ms).toFixed(3),
      fill: 'none', stroke: ink, 'stroke-width': 1.2, opacity: 0.9
    }));
    /* a stub at the box end so the eye knows which of a dozen stacks it met */
    frag.appendChild(el('circle', {
      cx: ex.toFixed(2), cy: ey.toFixed(2), r: (1.6 / ms).toFixed(3),
      fill: ink, opacity: s.pinned ? 0.95 : 0.75
    }));
  });
  mapCalloutG.textContent = '';
  mapCalloutG.appendChild(frag);
}

function mapScaleNow() {
  const r = mapSvg.getBoundingClientRect();
  if (!r.width) return 0;
  return zpMap.k * Math.min(r.width / (MW + 16), r.height / (MH + 16));
}

/* the mapping the overlay uses, so the solver can talk about screen space:
   screen = origin + mapUnits * ms, and stack offsets are already screen px */
function mapOverlayFrame() {
  const r = mapSvg.getBoundingClientRect();
  if (!r.width) return null;
  const s = Math.min(r.width / (MW + 16), r.height / (MH + 16));
  return {
    ms: zpMap.k * s, rect: r,
    ox: (r.width - (MW + 16) * s) / 2 + 8 * s + zpMap.x * s,
    oy: (r.height - (MH + 16) * s) / 2 + 8 * s + zpMap.y * s
  };
}

/* The panels floating over the map are part of the furniture: a stack that
   slides under the legend or the event stream is simply unreadable. */
const PANEL_SEL = ['#stage-map .tools-map', '#lgw-map', '#tl-chart'];
function panelBoxes(fr) {
  const out = [];
  PANEL_SEL.forEach(sel => {
    const p = document.querySelector(sel);
    if (!p || !p.offsetParent) return;
    const b = p.getBoundingClientRect();
    if (!b.width || !b.height) return;
    out.push({
      x: b.left - fr.rect.left - fr.ox + b.width / 2,
      y: b.top - fr.rect.top - fr.oy + b.height / 2,
      w: b.width, h: b.height
    });
  });
  return out;
}

/* Nudge every stack until nothing overlaps anything, then walk it part of the
   way there. Seeded from the previous frame and damped, so the field settles
   instead of twitching while the years run. */
function solveStacks(rows, fr) {
  if (!rows.length) return;
  const ms = fr.ms;
  const panels = panelBoxes(fr);
  /* the visible map, expressed in the same space the boxes live in */
  const lo = { x: 6 - fr.ox, y: 6 - fr.oy };
  const hi = { x: fr.rect.width - 6 - fr.ox, y: fr.rect.height - 6 - fr.oy };
  const clamp = b => {
    b.x = Math.min(Math.max(b.x, lo.x + b.w / 2), Math.max(lo.x + b.w / 2, hi.x - b.w / 2));
    b.y = Math.min(Math.max(b.y, lo.y + b.h / 2), Math.max(lo.y + b.h / 2, hi.y - b.h / 2));
  };
  /* shove a box clear of an immovable rectangle, the short way out */
  const evict = (b, r) => {
    const ox = (b.w + r.w) / 2 + 4 - Math.abs(b.x - r.x);
    const oy = (b.h + r.h) / 2 + 4 - Math.abs(b.y - r.y);
    if (ox <= 0 || oy <= 0) return;
    if (ox < oy) b.x += (b.x <= r.x ? -1 : 1) * ox;
    else b.y += (b.y <= r.y ? -1 : 1) * oy;
  };
  let mx = 0, my = 0;
  rows.forEach(r => { mx += r.ax; my += r.ay; });
  mx /= rows.length; my /= rows.length;

  const B = rows.map(r => {
    const s = r.state;
    const px = r.ax * ms, py = r.ay * ms;
    /* the resting place: straight out from the middle of the map */
    let ox = r.ax - mx, oy = r.ay - my;
    const m = Math.hypot(ox, oy) || 1;
    const reach = CARD_STANDOFF + Math.max(r.w, r.h) * 0.35;
    s.ix = (ox / m) * reach - r.w / 2; s.iy = (oy / m) * reach - r.h / 2;
    if (s.tx == null) { s.tx = s.ix; s.ty = s.iy; }
    /* the solver reasons about centres; tx/ty are top-left corner offsets */
    return { r, s, px, py, w: r.w, h: r.h,
             x: px + s.tx + r.w / 2, y: py + s.ty + r.h / 2 };
  });

  const obs = mapObstacles.map(o => [o[0] * ms, o[1] * ms, Math.min(o[2] * ms, 30)]);

  for (let it = 0; it < 30; it++) {
    /* a weak pull home: the leader lines carry the association, so a stack is
       free to travel a long way rather than crowd its neighbours */
    B.forEach(b => {
      if (b.s.pinned) return;
      b.x += (b.px + b.s.ix + b.w / 2 - b.x) * 0.04;
      b.y += (b.py + b.s.iy + b.h / 2 - b.y) * 0.04;
    });
    for (let i = 0; i < B.length; i++) {
      for (let j = i + 1; j < B.length; j++) {
        const a = B[i], c = B[j];
        const ox = (a.w + c.w) / 2 + CARD_PAD - Math.abs(a.x - c.x);
        const oy = (a.h + c.h) / 2 + CARD_PAD - Math.abs(a.y - c.y);
        if (ox <= 0 || oy <= 0) continue;
        const wa = a.s.pinned ? 0 : 1, wc = c.s.pinned ? 0 : 1, tw = wa + wc;
        if (!tw) continue;
        let sx = 0, sy = 0;
        if (ox < oy) sx = (a.x <= c.x ? -1 : 1) * ox;
        else sy = (a.y <= c.y ? -1 : 1) * oy;
        a.x += sx * wa / tw; a.y += sy * wa / tw;
        c.x -= sx * wc / tw; c.y -= sy * wc / tw;
      }
    }
    if (it >= 2) {
      B.forEach(b => {
        if (b.s.pinned) return;
        for (const o of obs) {
          const dx = o[0] - b.x, dy = o[1] - b.y;
          const px = b.w / 2 + o[2] - Math.abs(dx), py = b.h / 2 + o[2] - Math.abs(dy);
          if (px <= 0 || py <= 0) continue;
          if (px < py) b.x -= (dx >= 0 ? 1 : -1) * px;
          else b.y -= (dy >= 0 ? 1 : -1) * py;
        }
      });
    }
    B.forEach(b => { if (!b.s.pinned) { panels.forEach(r => evict(b, r)); clamp(b); } });
  }

  B.forEach(b => {
    const s = b.s;
    if (s.pinned) { s.dx = s.tx; s.dy = s.ty; return; }
    let dx = b.x - b.w / 2 - b.px, dy = b.y - b.h / 2 - b.py;
    const m = Math.hypot(dx, dy);
    if (m > CARD_MAX_OFF) { dx = dx / m * CARD_MAX_OFF; dy = dy / m * CARD_MAX_OFF; }
    s.tx = dx; s.ty = dy;
    if (s.dx == null) { s.dx = dx; s.dy = dy; return; }
    const ex = s.tx - s.dx, ey = s.ty - s.dy;
    if (Math.abs(ex) < CARD_DEADBAND && Math.abs(ey) < CARD_DEADBAND) return;
    /* ease toward the target, but cap the step so a stack whose neighbours
       just vanished glides into the gap instead of snapping across it */
    const d = Math.hypot(ex, ey);
    const k = Math.min(CARD_EASE, CARD_STEP / d);
    s.dx += ex * k;
    s.dy += ey * k;
  });
}

function wireStackDrag(elm, key) {
  let pid = null, sx = 0, sy = 0, x0 = 0, y0 = 0, moved = 0, held = false;
  const rowOf = () => calloutRows.find(r => r.key === key);

  elm.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const s = stackState.get(key);
    if (!s || s.dx == null) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY;
    x0 = s.dx; y0 = s.dy; moved = 0; held = false;
    e.stopPropagation();
  });

  elm.addEventListener('pointermove', e => {
    if (pid == null || e.pointerId !== pid) return;
    const ddx = e.clientX - sx, ddy = e.clientY - sy;
    moved = Math.max(moved, Math.hypot(ddx, ddy));
    if (moved <= 3) return;
    const s = stackState.get(key);
    if (!s) return;
    /* capture only once this is really a drag — grabbing the pointer on
       pointerdown would retarget the click and swallow taps on the cards */
    if (!held) {
      held = true;
      elm.setPointerCapture(pid);
      elm.classList.add('dragging');
    }
    s.pinned = true;
    s.dx = s.tx = x0 + ddx;
    s.dy = s.ty = y0 + ddy;
    const r = rowOf();
    elm.classList.add('pinned');
    if (r) applyStackTransform(elm, s, r.w, r.h);
    drawCallouts();
    e.preventDefault();
  });

  const end = e => {
    if (pid == null || e.pointerId !== pid) return;
    if (held) { try { elm.releasePointerCapture(pid); } catch (_) {} }
    pid = null;
    elm.classList.remove('dragging');
    if (held) {
      /* a drag must not also read as a tap on the card underneath */
      const eat = ev => { ev.stopPropagation(); ev.preventDefault(); };
      elm.addEventListener('click', eat, { capture: true, once: true });
      setTimeout(() => elm.removeEventListener('click', eat, true), 0);
    }
  };
  elm.addEventListener('pointerup', end);
  elm.addEventListener('pointercancel', end);

  /* double-click the place name to hand the stack back to the layout */
  elm.addEventListener('dblclick', e => {
    const s = stackState.get(key);
    if (!s) return;
    s.pinned = false;
    elm.classList.remove('pinned');
    e.stopPropagation();
    renderPersonCards();
  });
}

/* the same headstone the map draws, small enough to sit in a line of type */
const GRAVE_MARK =
  '<svg class="pdead" viewBox="0 0 12 12" aria-hidden="true">' +
  '<path d="M6 2.1c1.85 0 3.15 1.35 3.15 3.1v5.05H2.85V5.2C2.85 3.45 4.15 2.1 6 2.1z"/>' +
  '<path d="M1.7 10.05h8.6v1.55H1.7z"/></svg>';

function personCardHtml(p, st) {
  const gv = firstGiven(p);
  const mark = st.dead ? GRAVE_MARK : '';
  return `<div class="pn">${mark}${p.n}${gv ? ' <em>' + gv + '</em>' : ''}</div>` +
    `<div class="py">${cardYears(p, st)}</div>` +
    `<div class="pp">${cardPlaceLine(p)}</div>`;
}

/* a row wrapper lets a card collapse its own height as it fades out, so the
   people below it slide up instead of snapping */
function personRow(p) {
  const row = document.createElement('div');
  row.className = 'mrow';
  row.dataset.p = p.id;
  const card = document.createElement('div');
  card.className = 'pcard' + (p.s === 'F' ? ' f' : '');
  card.dataset.id = p.id;
  card.addEventListener('click', e => { e.stopPropagation(); select(p.id); });
  row.appendChild(card);
  mapCardNodes[p.id] = card;
  return row;
}

/* Which generations of a column are worth drawing: everything from the oldest
   one still showing a face down to the youngest. If the generation above the
   top one has died out, its bar is kept — that bar is the generation, not the
   people, and losing it would erase the fact that they were ever here. */
function columnGens(col, vis) {
  let first = -1, last = -1;
  col.units.forEach((u, i) => {
    if (!u.members.some(m => vis.has(m.id))) return;
    if (first < 0) first = i;
    last = i;
  });
  if (first < 0) return null;
  return { gens: col.units.slice(first, last + 1), leadSep: first > 0 };
}

function famSignature(col, vis) {
  const c = columnGens(col, vis);
  if (!c) return null;
  const parts = c.leadSep ? ['sep'] : [];
  c.gens.forEach((u, i) => {
    if (i) parts.push('sep');
    const live = u.members.filter(m => vis.has(m.id));
    const both = u.kind === 'couple' && u.adults.every(a => vis.has(a.id));
    u.adults.forEach((a, j) => {
      if (!vis.has(a.id)) return;
      parts.push('p' + a.id);
      if (both && j === 0) parts.push('rings');
    });
    u.kids.forEach(k => { if (vis.has(k.id)) parts.push('p' + k.id); });
    if (!live.length) parts.push('gap');
  });
  return parts.join(',');
}

function sepRow() {
  const sr = document.createElement('div');
  sr.className = 'mrow';
  sr.innerHTML = '<div class="msep"></div>';
  return sr;
}

function buildFam(col, vis) {
  const fam = document.createElement('div');
  fam.className = 'mfam';
  fam.dataset.col = col.key;
  const c = columnGens(col, vis);
  if (!c) return fam;
  if (c.leadSep) fam.appendChild(sepRow());
  c.gens.forEach((u, i) => {
    if (i) fam.appendChild(sepRow());
    const both = u.kind === 'couple' && u.adults.every(a => vis.has(a.id));
    u.adults.forEach((a, j) => {
      if (!vis.has(a.id)) return;
      const row = personRow(a);
      /* husband above wife, edges meeting so the rings sit inside one block */
      if (both) row.firstChild.classList.add(j === 0 ? 'mtop' : 'mbot');
      fam.appendChild(row);
      if (both && j === 0) {
        const rr = document.createElement('div');
        rr.className = 'mrow';
        rr.innerHTML = `<div class="mrings">${RINGS_SVG}</div>`;
        fam.appendChild(rr);
      }
    });
    u.kids.forEach(k => { if (vis.has(k.id)) fam.appendChild(personRow(k)); });
  });
  return fam;
}

function renderPersonCards() {
  if (!cardsVisible()) {
    mapCardsEl.textContent = '';
    mapCardNodes = {};
    stackNodes.clear();
    calloutRows = [];
    drawCallouts();
    return;
  }
  const time = mapTime;
  const vis = new Map(), people = [];
  ALL.forEach(p => {
    const st = cardPasses(p, time);
    if (st && cardPlaceOf(p, time)) vis.set(p.id, st);
  });
  /* The ledger holds everyone born by now, the dead included: they are what
     keeps a column's generations threaded together once the top has gone. */
  ALL.forEach(p => {
    if (!cardPlaceOf(p, time)) return;
    const by = yr(p.b);
    if (by == null || by > time) return;
    if (!mapShowCards && !vis.has(p.id)) return;
    people.push(p);
  });

  const hh = buildHouseholds(time, people, p => cardPlaceOf(p, time), { chain: true });
  mapCardNodes = {};
  const live = new Set();
  const fr = mapOverlayFrame();
  /* A place you have zoomed past has no business dragging its stack back into
     view — culling it is what makes zooming in an effective way to declutter. */
  const inView = pl => {
    if (!fr) return true;
    const [x, y] = stackAnchorXY(pl);
    const sx = fr.ox + x * fr.ms, sy = fr.oy + y * fr.ms;
    return sx > -140 && sx < fr.rect.width + 140 && sy > -140 && sy < fr.rect.height + 140;
  };

  /* ── write: build or patch the DOM for every place ── */
  hh.locs.forEach(g => {
    g.shownCols = g.cols.filter(c => famSignature(c, vis) != null);
    if (!g.shownCols.length || !inView(g.pl)) return;
    live.add(g.key);
    let stack = stackNodes.get(g.key);
    if (!stack) {
      stack = document.createElement('div');
      stack.className = 'mstack';
      stack.dataset.key = g.key;
      stack.innerHTML = '<div class="mstack-box"><div class="mstack-head">' +
        '<span class="nm"></span><span class="dep"></span></div>' +
        '<div class="mstack-fams"></div></div>';
      mapCardsEl.appendChild(stack);
      stackNodes.set(g.key, stack);
      wireStackDrag(stack, g.key);
    }
    if (!stackState.has(g.key)) stackState.set(g.key, { dx: null, dy: null, tx: null, ty: null, pinned: false });

    const head = stack.querySelector('.mstack-head');
    const fams = stack.querySelector('.mstack-fams');
    const sigs = g.shownCols.map(c => c.key + ':' + famSignature(c, vis));
    const cardCount = g.shownCols.reduce(
      (n, c) => n + c.units.reduce((k, u) => k + u.members.filter(m => vis.has(m.id)).length, 0), 0);
    const grouped = cardCount > 1 || g.shownCols.length > 1;
    stack.classList.toggle('grouped', grouped);
    head.style.display = grouped ? '' : 'none';
    if (grouped) {
      head.querySelector('.nm').textContent = g.name;
      head.querySelector('.dep').textContent = g.dep;
    }

    const sig = sigs.join('|');
    if (fams.dataset.sig !== sig) {
      fams.textContent = '';
      g.shownCols.forEach(c => fams.appendChild(buildFam(c, vis)));
      fams.dataset.sig = sig;
    } else {
      /* same shape: just re-register the cards for this frame */
      fams.querySelectorAll('.pcard').forEach(c => { mapCardNodes[+c.dataset.id] = c; });
    }

    let hasSel = false;
    g.shownCols.forEach(c => c.units.forEach(u => u.members.forEach(m => {
      const card = mapCardNodes[m.id];
      if (!card) return;
      const st = vis.get(m.id);
      if (!st) return;
      const html = personCardHtml(m, st);
      if (card.__html !== html) { card.__html = html; card.innerHTML = html; }
      card.style.setProperty('--pg', st.gray.toFixed(3));
      card.style.setProperty('--po', st.opacity.toFixed(3));
      const inLine = !selPath || selPath.has(m.id);
      card.classList.toggle('sel', SEL === m.id);
      card.classList.toggle('dead', !!st.dead);
      card.classList.toggle('dim', !!selPath && !inLine);
      if (SEL === m.id) hasSel = true;
    })));
    stack.classList.toggle('hassel', hasSel);
    stack.classList.toggle('pinned', !!stackState.get(g.key).pinned);
    /* left/top sit in map units; the transform then works in screen px */
    const [ax0, ay0] = stackAnchorXY(g.pl);
    stack.style.left = ax0 + 'px';
    stack.style.top = ay0 + 'px';
  });

  /* the element goes, the placement stays: pan back and a stack you dragged
     into place is still where you put it */
  stackNodes.forEach((elm, key) => {
    if (live.has(key)) return;
    elm.remove();
    stackNodes.delete(key);
  });

  /* ── read: natural row heights, then the finished stack boxes ── */
  const collapsing = [];
  hh.locs.forEach(g => {
    if (!live.has(g.key)) return;
    g.units.forEach(u => u.members.forEach(m => {
      const card = mapCardNodes[m.id];
      if (!card) return;
      const row = card.parentNode;
      const st = vis.get(m.id);
      if (!st || st.opacity >= 0.999) { if (row.style.height) row.style.height = ''; return; }
      const sigk = g.key + '/' + m.id;
      let nat = rowHeights.get(sigk);
      if (!nat) { row.style.height = ''; nat = row.offsetHeight; rowHeights.set(sigk, nat); }
      collapsing.push([row, nat * st.opacity]);
    }));
  });
  collapsing.forEach(([row, h]) => { row.style.height = h.toFixed(1) + 'px'; });

  const rows = [];
  hh.locs.forEach(g => {
    if (!live.has(g.key)) return;
    const stack = stackNodes.get(g.key);
    const [ax, ay] = stackAnchorXY(g.pl);
    rows.push({ key: g.key, elm: stack, ax, ay,
                w: stack.offsetWidth, h: stack.offsetHeight, state: stackState.get(g.key) });
  });

  /* ── write: solved positions and their leader lines ── */
  if (fr && fr.ms) solveStacks(rows, fr);
  rows.forEach(r => { if (r.state.dx != null) applyStackTransform(r.elm, r.state, r.w, r.h); });
  calloutRows = rows.map(r => ({ key: r.key, ax: r.ax, ay: r.ay, w: r.w, h: r.h }));
  drawCallouts();
  syncMapOverlay(zpMap);
  settleStacks(rows);
}

/* The solver only walks part of the way each pass, which is what keeps the
   motion calm. When the clock is not running nothing would drive those passes,
   so keep asking for frames until every stack has come to rest. */
let cardSettle = 0;
function settleStacks(rows) {
  if (cardSettle) return;
  const moving = rows.some(r => {
    const s = r.state;
    return s.dx != null && !s.pinned &&
      (Math.abs(s.tx - s.dx) > CARD_DEADBAND || Math.abs(s.ty - s.dy) > CARD_DEADBAND);
  });
  if (!moving) return;
  cardSettle = requestAnimationFrame(() => {
    cardSettle = 0;
    if (cardsVisible()) renderPersonCards();
  });
}

function mapPlaceInsert(g) {
  if (livingG && livingG.parentNode === mapG) mapG.insertBefore(g, livingG);
  else mapG.appendChild(g);
}

function drawMapPlaces() {
  if (mapPlacesG) { mapPlacesG.remove(); mapPlacesG = null; }
  if (mapLineageG) { mapLineageG.remove(); mapLineageG = null; }
  mapPlacesShown = 0;
  if (mapLiving) return;

  const dotStroke = getComputedStyle(document.documentElement).getPropertyValue('--chalk').trim() || '#E8E2D5';
  const lineage = selPath ? lineagePlaceCounts(selPath) : null;
  mapPlacesG = el('g', { id: 'map-places' });
  mapLineageG = el('g', { id: 'map-lineage', 'pointer-events': 'none' });

  PLIST.forEach(pl => {
    const pk = placeKey(pl);
    const lin = lineage?.get(pk);
    const ev = pl.ev.filter(e => mapLayers[e.type] && (!e.y || e.y <= mapTime));
    const [x, y] = prj(pl.la, pl.lo);
    const inLine = !lineage || !!lin;

    if (ev.length) {
      mapPlacesShown++;
      const ys = ev.map(e => e.y).filter(Boolean).sort((a, b) => a - b);
      const med = ys.length ? ys[Math.floor(ys.length / 2)] : pl.med;
      const c = el('circle', {
        cx: x.toFixed(1), cy: y.toFixed(1), r: MAP_DOT(ev.length).toFixed(1),
        fill: med ? ramp(ERA, med) : '#4A5563', 'fill-opacity': inLine ? .82 : .35,
        stroke: dotStroke, 'stroke-width': .7, opacity: inLine ? 1 : DIM_OP,
        'data-place-key': pk
      });
      c.style.cursor = 'pointer';
      c.style.transition = 'opacity .25s, fill-opacity .25s';
      mapPlacesG.appendChild(c);
    }

    if (lin && lin.count > 0) {
      const [ox, oy] = ev.length ? MAP_DOT_OFF(1) : [0, 0];
      mapLineageG.appendChild(el('circle', {
        cx: (x + ox).toFixed(1), cy: (y + oy).toFixed(1), r: MAP_DOT(lin.count).toFixed(1),
        fill: lin.med ? ramp(ERA, lin.med) : '#6E9CBF', 'fill-opacity': .92,
        stroke: '#6E9CBF', 'stroke-width': 1.4, opacity: 1
      }));
    }
  });

  mapPlaceInsert(mapPlacesG);
  mapPlaceInsert(mapLineageG);
  /* the cards route around the dots they are describing */
  mapObstacles = [];
  PLIST.forEach(pl => {
    const n = pl.ev.filter(e => mapLayers[e.type] && (!e.y || e.y <= mapTime)).length;
    if (!n) return;
    const [x, y] = prj(pl.la, pl.lo);
    mapObstacles.push([x, y, MAP_DOT(n) + 3]);
  });
}

function updateMapCount(shown) {
  const mi = document.getElementById('mapcount');
  if (!mi) return;
  const parts = [];
  if (mapLiving) {
    const n = ALL.filter(p => personAlive(p, mapTime) && p.bp && p.bp[2] != null).length;
    parts.push(`${n} ${t('living').toLowerCase()}`);
    if (mapShowCards) {
      const nCards = ALL.filter(p => cardPasses(p, mapTime)).length;
      parts.push(`${nCards} ${t('cards').toLowerCase()}`);
    } else if (SEL) parts.push('1 ' + t('cards').toLowerCase());
  } else if (mapShowCards) {
    const nCards = ALL.filter(p => cardPasses(p, mapTime)).length;
    parts.push(`${nCards} ${t('cards').toLowerCase()}`);
  }
  if (!mapLiving) {
    const on = ['b','u','d'].filter(k => mapLayers[k]).map(k => t(k==='b'?'births':k==='u'?'unions':'deaths').toLowerCase());
    if (on.length) parts.push(on.join('+'));
    if (mapLayers.mig) parts.push(t('migr').toLowerCase());
    parts.push(`${shown} ${t('places').toLowerCase()}`);
  }
  mi.textContent = parts.join(' · ') || '—';
}

/* The ground itself: sea, coast, rivers, built-up areas and the towns that
   name them. Drawn first, beneath the departments, so it reads as landscape
   rather than as another set of markers competing with the family. */
function drawTerrain(parent) {
  const cs = getComputedStyle(document.documentElement);
  const v = (k, f) => cs.getPropertyValue(k).trim() || f;
  const water = v('--terr-water', '#22384B');
  const waterInk = v('--terr-water-ink', '#3E6A87');
  const town = v('--terr-town', '#2A3038');
  const label = v('--map-label', '#46525F');
  const g = el('g', { id: 'map-terrain', 'pointer-events': 'none' });
  const path = pts => pts.map(c => prj(c[1], c[0]).map(n => n.toFixed(1)).join(',')).join(' ');

  TERRAIN.sea.forEach(ring => {
    g.appendChild(el('polygon', { points: path(ring), fill: water, 'fill-opacity': 0.55 }));
  });
  TERRAIN.towns.forEach(ring => {
    g.appendChild(el('polygon', { points: path(ring), fill: town, 'fill-opacity': 0.55 }));
  });
  TERRAIN.coast.forEach(line => {
    g.appendChild(el('polyline', {
      points: path(line), fill: 'none', stroke: waterInk,
      'stroke-width': 1.1, 'stroke-linejoin': 'round', opacity: 0.8
    }));
  });
  TERRAIN.lakes.forEach(l => {
    g.appendChild(el('polygon', { points: path(l.c), fill: water, 'fill-opacity': 0.8,
                                  stroke: waterInk, 'stroke-width': 0.6 }));
  });
  TERRAIN.rivers.forEach(r => {
    /* Natural Earth's rank runs 1 (great river) to 10 (brook) */
    const w = Math.max(0.5, 2.2 - (r.r || 6) * 0.16);
    g.appendChild(el('polyline', {
      points: path(r.c), fill: 'none', stroke: waterInk, 'stroke-width': w.toFixed(2),
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.85
    }));
  });
  TERRAIN.places.forEach(([name, lo, la]) => {
    const [x, y] = prj(la, lo);
    const tx = el('text', {
      x: (x + 4).toFixed(1), y: (y - 3).toFixed(1), fill: label,
      'font-family': 'IBM Plex Mono, monospace', 'font-size': 8.6,
      'letter-spacing': '0.1em', opacity: 0.9, 'pointer-events': 'none'
    });
    tx.textContent = name.toUpperCase();
    g.appendChild(el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 1.6,
                                 fill: label, opacity: 0.85 }));
    g.appendChild(tx);
  });
  parent.appendChild(g);
}

function drawMapStatic() {
  const stroke = getComputedStyle(document.documentElement).getPropertyValue('--map-stroke').trim() || '#333F4D';
  const fill = getComputedStyle(document.documentElement).getPropertyValue('--map-fill').trim() || '#161E27';
  const label = getComputedStyle(document.documentElement).getPropertyValue('--map-label').trim() || '#46525F';
  const dotStroke = getComputedStyle(document.documentElement).getPropertyValue('--chalk').trim() || '#E8E2D5';
  mapStaticG = el('g', { id: 'map-static' });

  DATA.deps.forEach(d => {
    d.rings.forEach(r => {
      const pts = r.map(c => prj(c[1], c[0]).map(v => v.toFixed(1)).join(',')).join(' ');
      /* with the terrain showing, the departments become outlines so the
         ground underneath stays visible */
      mapStaticG.appendChild(el('polygon', { points:pts, fill: mapTerrain ? 'none' : fill,
        stroke, 'stroke-width':.9, 'stroke-linejoin':'round' }));
    });
    if (DEPLAB[d.code]) {
      const [lx, ly] = prj(DEPLAB[d.code][0], DEPLAB[d.code][1]);
      const tx = el('text', { x:lx.toFixed(1), y:ly.toFixed(1), fill:label, 'text-anchor':'middle',

      tx.textContent = d.nom.toUpperCase(); mapStaticG.appendChild(tx);
    }

    mapStaticG.appendChild(el('circle', {
      cx: x.toFixed(1), cy: y.toFixed(1), r: '3.5',
      fill: 'none', stroke: dotStroke, 'stroke-width': '0.9', opacity: '0.75'
    }));
    const tx = el('text', {
      x: (x + 5.5).toFixed(1), y: (y + 3.5).toFixed(1),
      fill: dotStroke, 'font-family': 'EB Garamond, serif',
      'font-size': '12.5', 'font-weight': '600', 'pointer-events': 'none'

    mapStaticG.appendChild(tx);

  mapStaticBuilt = true;
}

function drawMapMigrations() {
  if (mapMigG) { mapMigG.remove(); mapMigG = null; }
  if (!mapLayers.mig || mapLiving) return;
  mapMigG = el('g', { id: 'map-mig', 'pointer-events': 'none' });
  MIG.filter(m => !m.y || m.y <= mapTime).forEach(m => {
    const [x1,y1] = prj(m.a[2], m.a[3]), [x2,y2] = prj(m.b[2], m.b[3]);
    const mx = (x1+x2)/2 - (y2-y1)*0.22, my = (y1+y2)/2 + (x2-x1)*0.22;
    mapMigG.appendChild(el('path', { d:`M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
      fill:'none', stroke: ramp(ERA, m.y || 1800), 'stroke-width':.9, opacity:.55 }));
  });
  mapPlaceInsert(mapMigG);
}

function refreshMapTime() {
  drawMapMigrations();
  let shown = 0;
  if (!mapLiving) {
    drawMapPlaces();
    shown = mapPlacesShown;
  }
  updateLivingLayer();
  renderPersonCards();
  updateHistStream();
  updateMapCount(shown);
}

function drawMap() {
  mapStaticBuilt = false;
  mapStaticG = null;
  mapMigG = null;
  mapPlacesG = null;
  mapLineageG = null;
  mapG.textContent = '';
  drawMapStatic();
  refreshMapTime();
}

function fitMapCore() {
  const st = document.getElementById('stage-map').getBoundingClientRect();
  if (!st.width) return;
  const las = PLIST.map(p => p.la).sort((a,b)=>a-b), los = PLIST.map(p => p.lo).sort((a,b)=>a-b);
  const q = (arr, f) => arr[Math.floor((arr.length-1)*f)];
  const [x0, y0] = prj(q(las,.97), q(los,.03)), [x1, y1] = prj(q(las,.03), q(los,.97));
  const w = Math.abs(x1-x0) + 40, h = Math.abs(y1-y0) + 40;
  const s = Math.min(st.width/(MW+16), st.height/(MH+16));
  const k = Math.min(st.width/(w*s), st.height/(h*s)) * 0.96;
  mapFitK = k;
  zpMap.focus((x0+x1)/2, (y0+y1)/2, k);
  syncMapOverlay(zpMap);
}

function histLineText(ev) {
  const [y0, y1] = histSpan(ev);
  const loc = ev.loc ? ` · ${ev.loc}` : '';
  const scope = ev.s === 'fr' ? t('histFr') : ev.s === 'reg' ? t('histReg') : t('histLoc');
  const span = y1 > y0 ? `${y0}–${y1} · ` : '';
  return `${span}${scope}${loc} · ${L === 'fr' ? ev.fr : ev.en}`;
}

const HIST_SCALE_W = 62, HIST_GAP = 4, HIST_BOX_L = 26;
let histEls = null, histLayout = { h:198, center:99, pxYr:6, win:30 };
let histH = [], histHKey = '', histWarp = [];

function initHistStream() {
  const stream = document.getElementById('hist-stream');
  if (!stream) return;
  stream.innerHTML = '';
  histEls = HIST.map((ev, i) => {
    const node = document.createElement('div');
    node.className = 'hist-ev' + (ev.s === 'reg' ? ' reg' : ev.s === 'loc' ? ' loc' : '');
    node.dataset.i = i;
    node.innerHTML = `<span class="hist-line">${histLineText(ev)}</span>`;
    stream.appendChild(node);
    return node;
  });
  histHKey = '';
}

/* Box heights only change when the panel changes width or the language
   changes, so measure them all in one layout and keep them. Reading
   offsetHeight per item per frame was forcing forty layouts a frame, which is
   what made the stream stutter as it rolled. */
function measureHistHeights(width) {
  const key = width + '|' + L;
  if (key === histHKey || !histEls) return;
  histHKey = key;
  histEls.forEach(n => { n.style.display = ''; n.style.visibility = 'hidden'; n.style.top = '0px'; });
  histH = histEls.map(n => n.offsetHeight);
  histEls.forEach(n => { n.style.display = 'none'; n.style.visibility = ''; });
}

/* Stacking that only ever pushes downwards makes a crowded decade drift away
   from its years, and the drift lands on whichever item happens to be lowest.
   Collect the ones that collide into a block instead and hang the block off
   the mean of its anchors, so a cluster spreads either side of its date. */
function layoutHistEvents(items, minGap) {
  if (!items.length) return items;
  items.sort((a, b) => a.anchorY - b.anchorY || a.i - b.i);
  const blocks = [];
  const blockTop = list => {
    let off = 0, sum = 0;
    for (const x of list) { sum += x.anchorY - x.h / 2 - off; off += x.h + minGap; }
    return sum / list.length;
  };
  const blockH = list => list.reduce((s, x) => s + x.h, 0) + minGap * (list.length - 1);
  for (const it of items) {
    let list = [it], top = it.anchorY - it.h / 2, h = it.h;
    while (blocks.length) {
      const prev = blocks[blocks.length - 1];
      if (prev.top + prev.h + minGap <= top) break;
      blocks.pop();
      list = prev.list.concat(list);
      h = blockH(list);
      top = blockTop(list);
    }
    blocks.push({ list, top, h });
  }
  blocks.forEach(b => {
    let y = b.top;
    b.list.forEach(x => { x.top = y; x.boxCy = y + x.h / 2; y += x.h + minGap; });
  });
  return items;
}

function histScopeColor(s) {
  const root = getComputedStyle(document.documentElement);
  const key = s === 'fr' ? '--hist-fr' : s === 'reg' ? '--hist-reg' : '--hist-loc';
  return root.getPropertyValue(key).trim() || '#6E9CBF';
}

function drawHistOverlay(overlay, layout, items, t) {
  const { h, center, pxYr, win } = layout;
  const w = overlay.parentElement ? overlay.parentElement.clientWidth : 200;
  overlay.setAttribute('viewBox', `0 0 ${w} ${h}`);
  overlay.textContent = '';
  const axisX = HIST_SCALE_W - 1;
  overlay.appendChild(el('line', {
    x1: axisX, y1: 0, x2: axisX, y2: h,
    stroke: '#2A3542', 'stroke-width': 1, opacity: .55
  }));
  const yStart = Math.ceil((t - win) / 10) * 10;
  const yEnd = Math.floor((t + win) / 10) * 10;
  for (let y = yStart; y <= yEnd; y += 10) {
    const py = center + (y - t) * pxYr;
    if (py < -6 || py > h + 6) continue;
    const major = y % 50 === 0;
    overlay.appendChild(el('line', {
      x1: axisX - (major ? 8 : 5), y1: py, x2: axisX, y2: py,
      stroke: '#4A5562', 'stroke-width': major ? .9 : .55, opacity: major ? .85 : .6
    }));
    const tx = el('text', {
      x: axisX - 10, y: py + 4.5, 'text-anchor': 'end', fill: '#6E7885',
      'font-family': 'IBM Plex Mono, monospace', 'font-size': major ? 13.5 : 12.5, opacity: major ? .95 : .72
    });
    tx.textContent = y;
    overlay.appendChild(tx);
  }
  const calloutX = HIST_SCALE_W + 8;
  const woad = getComputedStyle(document.documentElement).getPropertyValue('--woad').trim() || '#6E9CBF';
  items.forEach(it => {
    if (it.opacity < .04) return;
    const col = histScopeColor(it.ev.s);
    const [y0, y1] = histSpan(it.ev);
    /* a war that ran twenty years is a length of the scale, not a taller box —
       inflating the box was what pushed its neighbours out of reach of their
       own dates */
    if (y1 > y0) {
      overlay.appendChild(el('line', {
        x1: axisX, y1: (center + (y0 - t) * pxYr).toFixed(1),
        x2: axisX, y2: (center + (y1 - t) * pxYr).toFixed(1),
        stroke: col, 'stroke-width': it.on ? 3.2 : 2.4, 'stroke-linecap': 'round',
        opacity: (it.on ? .7 : .3) * it.opacity
      }));
    }
    /* elbow into the box: straight out from the axis, then a diagonal, then a
       short run into the text, so the eye can follow it back to the year */
    const midX = HIST_SCALE_W + HIST_BOX_L - 6;
    overlay.appendChild(el('polyline', {
      points: `${axisX},${it.anchorY.toFixed(1)} ${calloutX},${it.anchorY.toFixed(1)} ` +
              `${midX},${it.boxCy.toFixed(1)} ${HIST_SCALE_W + HIST_BOX_L},${it.boxCy.toFixed(1)}`,
      fill: 'none', stroke: col, 'stroke-width': it.on ? 1.1 : .65,
      opacity: (it.on ? .85 : .45) * it.opacity, 'stroke-linejoin': 'round'
    }));
    overlay.appendChild(el('circle', {
      cx: axisX, cy: it.anchorY, r: it.on ? 2.6 : 2,
      fill: col, opacity: (it.on ? .95 : .55) * it.opacity
    }));
  });
  overlay.appendChild(el('circle', {
    cx: axisX, cy: center, r: 3.2, fill: woad, opacity: .95
  }));
}

function updateHistStream() {
  const stream = document.getElementById('hist-stream');
  const overlay = document.getElementById('hist-overlay');
  const viewport = stream && stream.parentElement;
  if (!stream || !viewport || !histEls) return;
  const h = viewport.clientHeight || 198;
  const center = h / 2;
  /* a taller scale spreads the anchors, which is what keeps a callout short
     enough to follow back to its year */
  const pxYr = Math.max(5, Math.min(16, h / 34));
  const win = Math.ceil(h / pxYr / 2) + 8;
  histLayout = { h, center, pxYr, win };
  measureHistHeights(viewport.clientWidth);
  const t = mapTime;
  const active = [];

  HIST.forEach((ev, i) => {
    const node = histEls[i];
    const [y0, y1] = histSpan(ev);
    if (t < y0 - win || t > y1 + win) {
      if (node.style.display !== 'none') { node.style.display = 'none'; node.dataset.off = '1'; }
      return;
    }
    const mid = (y0 + y1) / 2;
    const anchorY = center + (mid - t) * pxYr;
    const on = t >= y0 && t <= y1;
    const dist = on ? 0 : Math.min(Math.abs(t - y0), Math.abs(t - y1));
    /* One curve for how present an event is: nothing at the edge of the
       window, full within a dozen years of now. It drives both the fade and
       the room the item claims, so an item arrives at no width and no ink and
       grows into both — nothing appears out of nowhere and shoves the
       readable ones off their dates. */
    const fade = Math.max(0, Math.min(1, (win - dist) / Math.max(1, win - 12)));
    const box = histH[i] || 22;
    active.push({ node, ev, i, anchorY, box, h: box * Math.max(0.1, fade),
                  on, opacity: fade, dist });
  });

  layoutHistEvents(active, HIST_GAP);

  /* An item coming back from hidden still carries the top it had when it left,
     and the transition would fly it across the panel to get here — that was
     the phantom drifting through the stream. Land it without a transition. */
  histWarp.length = 0;
  active.forEach(it => {
    const { node, on, opacity } = it;
    if (node.dataset.off === '1' || node.style.display === 'none') {
      node.classList.add('warp');
      node.style.display = '';
      node.dataset.off = '0';
      histWarp.push(node);
    }
    /* the box is centred in the room it claimed, so it grows about its middle */
    const boxTop = it.top + (it.h - it.box) / 2;
    node.style.top = boxTop.toFixed(2) + 'px';
    node.classList.toggle('on', on);
    const edge = Math.min(boxTop, h - boxTop - it.box);
    let op = opacity;
    if (edge < 28) op *= Math.max(0, edge / 28);
    it.opacity = op;
    node.style.opacity = op.toFixed(3);
  });
  if (histWarp.length) {
    const warped = histWarp.slice();
    requestAnimationFrame(() => warped.forEach(n => n.classList.remove('warp')));
  }

  if (overlay) drawHistOverlay(overlay, histLayout, active, t);
}

function drawHistChart() {
  const lab = document.getElementById('tl-chart-lab');
  if (lab) lab.textContent = t('histLeg');
  initHistStream();
  updateHistStream();
}

function stopPlay() {
  if (!playing) return;
  cancelAnimationFrame(playing);
  playing = null;
  document.getElementById('tl-play').textContent = t('play');
}

function tickFrame(now) {
  if (!playing) return;
  if (!lastFrame) lastFrame = now;
  const dt = (now - lastFrame) / 1000;
  lastFrame = now;
  mapTime = Math.min(YMAX, mapTime + dt * YRS_PER_SEC * playSpeed);
  syncMapFrame();
  if (mapTime >= YMAX) stopPlay();
  else playing = requestAnimationFrame(tickFrame);
}

function togglePlay() {
  if (typeof closeInvite === 'function') closeInvite();
  if (playing) { stopPlay(); return; }
  if (mapTime >= YMAX) setYear(YMIN);
  lastFrame = 0;
  playing = requestAnimationFrame(tickFrame);
  drawMapChips();
}

function stepYear(d) {
  stopPlay();
  setYear(mapTime + d);
}

/* two readouts, one number: the marker inside the stream and the one in the
   title bar that survives the fold */
const yrEls = ['hist-now-yr', 'tl-bar-yr'].map(id => document.getElementById(id));
function showYear(y) { yrEls.forEach(e => { if (e) e.textContent = y; }); }

function syncMapFrame() {
  const yf = Math.floor(mapTime);

  slEl.value = yf;
  if (yf !== mapYearFloor) {
    mapYearFloor = yf;
    if (mapStaticBuilt) refreshMapTime();
    else drawMap();
  } else {
    updateLivingLayer();
    renderPersonCards();
    updateHistStream();
  }
}

const slEl = document.getElementById('sl');
function setYear(y) {
  mapTime = Math.max(YMIN, Math.min(YMAX, +y));
  mapYearFloor = Math.floor(mapTime);
  slEl.value = mapYearFloor;

  }
}
